<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The E-FISCAL Machine — Phase 1 Demo</title>
<style>
/* ========== RESET & VARIABLES ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy-900: #0f172a; --navy-800: #1e293b; --navy-700: #334155;
  --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
  --slate-300: #cbd5e1; --slate-400: #94a3b8; --slate-500: #64748b;
  --slate-600: #475569; --slate-700: #334155; --slate-800: #1e293b;
  --gray-950: #030712;
  --blue-50: #eff6ff; --blue-100: #dbeafe; --blue-500: #3b82f6; --blue-600: #2563eb; --blue-700: #1d4ed8;
  --green-50: #f0fdf4; --green-100: #dcfce7; --green-500: #22c55e; --green-600: #16a34a; --green-700: #15803d;
  --red-50: #fef2f2; --red-100: #fee2e2; --red-500: #ef4444; --red-600: #dc2626; --red-700: #b91c1c;
  --amber-50: #fffbeb; --amber-100: #fef3c7; --amber-500: #f59e0b; --amber-600: #d97706;
  --orange-500: #f97316; --orange-600: #ea580c;
  --purple-50: #faf5ff; --purple-100: #f3e8ff; --purple-500: #a855f7; --purple-600: #7c3aed;
  --emerald-500: #10b981; --emerald-600: #059669;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --radius: 8px; --radius-sm: 4px; --radius-lg: 12px;
}
html, body { height: 100%; font-family: var(--font-sans); background: var(--slate-100); color: var(--gray-950); font-size: 14px; line-height: 1.5; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: inherit; }
a { color: var(--blue-600); text-decoration: none; }

/* ========== HEADER ========== */
.header { position: fixed; top: 0; left: 0; right: 0; height: 82px; background: var(--navy-900); z-index: 100; padding: 0 20px; }
.header__row1 { display: flex; align-items: center; gap: 16px; height: 46px; }
.header__brand { display: flex; align-items: center; gap: 10px; color: white; font-weight: 700; font-size: 15px; white-space: nowrap; }
.header__actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.header__btn { padding: 5px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; color: var(--slate-300); border: 1px solid var(--navy-700); transition: all 0.15s; }
.header__btn:hover { background: var(--navy-700); color: white; }
.header__btn--danger { color: var(--red-500); }
.header__btn--demo { background: var(--blue-600); color: white; border-color: var(--blue-600); }
.header__btn--demo:hover { background: var(--blue-500); }
.header__row2 { display: flex; align-items: center; gap: 2px; height: 36px; overflow-x: auto; }
.header__group { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--slate-500); text-transform: uppercase; padding: 0 8px 0 4px; white-space: nowrap; }
.header__tab { padding: 5px 12px; border-radius: var(--radius); color: var(--slate-300); font-weight: 500; font-size: 12.5px; transition: all 0.15s; white-space: nowrap; }
.header__tab:hover { background: var(--navy-700); color: white; }
.header__tab--active { background: var(--blue-600); color: white; }
.header__divider { width: 1px; height: 18px; background: var(--navy-700); margin: 0 8px; flex-shrink: 0; }
.clock-widget { display: flex; align-items: center; gap: 6px; background: var(--navy-800); border: 1px solid var(--navy-700); border-radius: var(--radius); padding: 3px 8px; }
.clock-widget__time { font-family: var(--font-mono); font-size: 11.5px; color: var(--amber-500); white-space: nowrap; }
.clock-widget__btn { padding: 2px 7px; border-radius: var(--radius-sm); font-size: 11px; color: var(--slate-300); border: 1px solid var(--navy-700); white-space: nowrap; }
.clock-widget__btn:hover { background: var(--navy-700); color: white; }

/* ========== LAYOUT ========== */
.app-main { padding-top: 82px; min-height: 100vh; }
.content-inner { max-width: 1060px; margin: 0 auto; padding: 24px; }
.split-view { display: flex; min-height: calc(100vh - 82px); }
.sidebar { width: 320px; border-right: 1px solid var(--slate-200); background: white; overflow-y: auto; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; background: var(--slate-50); }
.sidebar-header { padding: 14px 18px; border-bottom: 1px solid var(--slate-200); }
.sidebar-header h2 { font-size: 14px; font-weight: 700; }
.sidebar-item { padding: 11px 18px; border-bottom: 1px solid var(--slate-100); cursor: pointer; transition: background 0.1s; }
.sidebar-item:hover { background: var(--slate-50); }
.sidebar-item--selected { background: var(--blue-50); border-left: 3px solid var(--blue-600); }
.sidebar-item__title { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.sidebar-item__meta { font-size: 11.5px; color: var(--slate-500); }

/* ========== BADGES ========== */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge--blue { background: var(--blue-100); color: var(--blue-700); }
.badge--green { background: var(--green-100); color: var(--green-700); }
.badge--red { background: var(--red-100); color: var(--red-700); }
.badge--amber { background: var(--amber-100); color: var(--amber-600); }
.badge--purple { background: var(--purple-100); color: var(--purple-600); }
.badge--slate { background: var(--slate-200); color: var(--slate-600); }
.badge--orange { background: #fff7ed; color: var(--orange-600); }

/* ========== CARDS ========== */
.card { background: white; border: 1px solid var(--slate-200); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
.card--flush { padding: 0; }
.card__header { padding: 14px 20px; border-bottom: 1px solid var(--slate-200); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card__header h3 { font-size: 14px; font-weight: 700; }
.card__body { padding: 16px 20px; }
.section-title { font-size: 12px; font-weight: 700; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }

/* ========== TABS ========== */
.tabs { display: flex; border-bottom: 2px solid var(--slate-200); margin-bottom: 20px; }
.tab { padding: 10px 20px; font-weight: 600; font-size: 13px; color: var(--slate-500); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
.tab:hover { color: var(--slate-700); }
.tab--active { color: var(--blue-600); border-bottom-color: var(--blue-600); }

/* ========== FORMS & BUTTONS ========== */
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--slate-600); margin-bottom: 4px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 8px 12px; border: 1px solid var(--slate-300); border-radius: var(--radius-sm);
  font-size: 13px; background: white; color: var(--gray-950);
}
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; transition: all 0.15s; }
.btn--primary { background: var(--blue-600); color: white; }
.btn--primary:hover { background: var(--blue-700); }
.btn--success { background: var(--green-600); color: white; }
.btn--success:hover { background: var(--green-700); }
.btn--danger { background: var(--red-600); color: white; }
.btn--danger:hover { background: var(--red-700); }
.btn--outline { border: 1px solid var(--slate-300); color: var(--slate-700); background: white; }
.btn--outline:hover { background: var(--slate-50); }
.btn--sm { padding: 5px 10px; font-size: 12px; }
.btn--xs { padding: 3px 8px; font-size: 11px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ========== TABLES ========== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; padding: 9px 12px; font-weight: 600; font-size: 11.5px; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--slate-200); background: var(--slate-50); }
tbody td { padding: 9px 12px; border-bottom: 1px solid var(--slate-100); vertical-align: top; }
tbody tr:hover { background: var(--slate-50); }
tbody tr.expanded-row { background: var(--slate-50); }
.text-right { text-align: right; }

/* ========== ALERTS & MISC ========== */
.alert { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; }
.alert--success { background: var(--green-50); border: 1px solid var(--green-500); color: var(--green-700); }
.alert--error { background: var(--red-50); border: 1px solid var(--red-500); color: var(--red-700); }
.alert--warning { background: var(--amber-50); border: 1px solid var(--amber-500); color: var(--amber-600); }
.alert--info { background: var(--blue-50); border: 1px solid var(--blue-500); color: var(--blue-700); }
.alert ul { margin-left: 16px; margin-top: 4px; list-style: disc; }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-muted { color: var(--slate-500); }
.mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; }
.flex { display: flex; } .items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; } .gap-1 { gap: 4px; } .flex-wrap { flex-wrap: wrap; }
.hidden { display: none !important; }
pre.bill-text { font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; background: var(--slate-50); padding: 16px; border-radius: var(--radius); border: 1px solid var(--slate-200); max-height: 340px; overflow-y: auto; }
pre.recipe { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55; white-space: pre-wrap; background: var(--navy-900); color: var(--slate-200); padding: 14px; border-radius: var(--radius); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-grid .card { padding: 14px; margin-bottom: 0; }
@media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* ========== FIELD RENDERING (mechanical vs judgment) ========== */
.field-row { display: flex; gap: 8px; padding: 6px 10px; border-radius: var(--radius-sm); margin-bottom: 4px; font-size: 12.5px; align-items: baseline; }
.field-row--mech { background: var(--green-50); border-left: 3px solid var(--green-500); }
.field-row--judg { background: var(--amber-50); border-left: 3px solid var(--amber-500); }
.field-row__label { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--slate-600); min-width: 130px; }
.field-row__value { font-family: var(--font-mono); font-size: 12px; }
.draft-banner { background: var(--amber-50); border: 1px dashed var(--amber-500); color: var(--amber-600); font-size: 12px; padding: 8px 12px; border-radius: var(--radius); margin-bottom: 14px; }
.fingerprint { font-family: var(--font-mono); font-size: 11.5px; background: var(--navy-900); color: var(--amber-500); padding: 8px 12px; border-radius: var(--radius); display: inline-block; }
.stamp { display: inline-block; border: 2px solid var(--red-600); color: var(--red-600); font-weight: 800; letter-spacing: 0.12em; padding: 2px 10px; border-radius: 4px; transform: rotate(-3deg); font-size: 12px; }

/* ========== RAIL DIAGRAM ========== */
.rail-flow { margin: 8px 0; }
.rail-step { background: var(--blue-50); border: 1px solid rgba(37,99,235,0.25); border-radius: 10px; padding: 10px 14px; margin: 6px 0; font-size: 12.5px; line-height: 1.5; }
.rail-step--active { border-color: var(--blue-600); box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
.rail-step .step-n { display: inline-block; background: var(--navy-900); color: var(--amber-500); font-weight: bold; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; margin-right: 8px; font-size: 11px; font-family: var(--font-sans); }
.rail-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0; }
.rail-a { background: var(--blue-50); border: 1px solid rgba(37,99,235,0.3); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; }
.rail-b { background: var(--amber-50); border: 1px solid rgba(245,158,11,0.4); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; }
.rail-arrow { text-align: center; color: var(--amber-600); font-size: 12px; margin: 0; }

/* ========== CHECK TESTS ========== */
.check-test { display: flex; gap: 8px; padding: 5px 10px; font-size: 12.5px; align-items: baseline; border-bottom: 1px solid var(--slate-100); }
.check-test__icon { font-weight: 800; width: 18px; }
.check-test--pass .check-test__icon { color: var(--green-600); }
.check-test--fail .check-test__icon { color: var(--red-600); }

/* ========== CHAIN BREADCRUMB ========== */
.chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; margin: 8px 0; }
.chain__node { background: var(--slate-100); border: 1px solid var(--slate-300); border-radius: 6px; padding: 3px 8px; font-family: var(--font-mono); font-size: 11px; }
.chain__sep { color: var(--slate-400); }

/* ========== TALLY / STEPPER (vote machinery) ========== */
.tally { margin-bottom: 16px; }
.tally__counts { display: flex; gap: 16px; font-size: 12px; margin-bottom: 6px; }
.tally__counts span { font-weight: 600; }
.tally__bar { height: 28px; background: var(--slate-200); border-radius: var(--radius-sm); overflow: hidden; display: flex; position: relative; }
.tally__yea { background: var(--green-500); height: 100%; transition: width 0.05s linear; }
.tally__nay { background: var(--red-500); height: 100%; transition: width 0.05s linear; }
.tally__other { background: var(--slate-300); height: 100%; transition: width 0.05s linear; }
.tally__threshold { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gray-950); z-index: 2; }
.tally__threshold-label { position: absolute; top: -18px; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--slate-600); }
.stepper { display: flex; align-items: center; justify-content: center; margin-bottom: 24px; padding: 16px 0 6px; }
.stepper__circle { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid var(--slate-300); color: var(--slate-400); background: white; flex-shrink: 0; }
.stepper__circle--active { border-color: var(--blue-600); color: var(--blue-600); background: var(--blue-50); }
.stepper__circle--done { border-color: var(--green-600); color: white; background: var(--green-600); }
.stepper__circle--failed { border-color: var(--red-600); color: white; background: var(--red-600); }
.stepper__text { font-size: 10.5px; font-weight: 600; color: var(--slate-400); margin-top: 4px; text-align: center; max-width: 78px; }
.stepper__text--active { color: var(--blue-600); }
.stepper__text--done { color: var(--green-600); }
.stepper__text--failed { color: var(--red-600); }
.stepper__line { width: 44px; height: 2px; background: var(--slate-300); margin: 0 4px; flex-shrink: 0; }
.stepper__line--done { background: var(--green-600); }
.stepper__node { display: flex; flex-direction: column; align-items: center; }

/* ========== DEMO MODE ========== */
.demo-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: var(--navy-900); color: white; box-shadow: 0 -4px 20px rgba(0,0,0,0.25); }
.demo-bar__inner { max-width: 1000px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
.demo-bar__step { font-size: 11px; font-weight: 700; color: var(--blue-500); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; min-width: 88px; }
.demo-bar__text { flex: 1; font-size: 13.5px; line-height: 1.5; }
.demo-bar__text strong { color: var(--amber-500); }
.demo-bar__actions { display: flex; gap: 8px; flex-shrink: 0; }
.demo-bar__btn { padding: 8px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; }
.demo-bar__btn--next { background: var(--blue-600); color: white; }
.demo-bar__btn--next:hover { background: var(--blue-500); }
.demo-bar__btn--skip { color: var(--slate-400); border: 1px solid var(--slate-600); }
.demo-bar__btn--skip:hover { color: white; border-color: var(--slate-400); }
.demo-bar__progress { position: absolute; top: 0; left: 0; height: 3px; background: var(--blue-500); transition: width 0.4s ease; }
body.demo-active .app-main { padding-bottom: 90px; }
#smoke-results { position: fixed; inset: 90px 20px 20px; background: white; border: 2px solid var(--navy-900); border-radius: 8px; padding: 16px; overflow: auto; z-index: 300; font-size: 12px; }
</style>

<div id="app"></div>
<script>
/* =====================================================================
   THE E-FISCAL MACHINE — Phase 1 demo
   A toy model of the E-FISCAL Act (discussion draft, July 2026):
   Phase 1, Part A (the Journal, the Ledger, the Protocol, the Account)
   and Part B (the legislative-branch pilot; one payment on two rails).
   Architectural rule: the JOURNAL is the single source of truth. The
   Ledger is a pure function of it — "the published recipe."
   ===================================================================== */

/* ========== FORMAT UTILITIES ========== */
function formatCurrency(amount) {
  if (amount === null || amount === undefined) return 'N/A';
  const abs = Math.abs(amount);
  if (abs >= 1e9) return '$' + (amount / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return '$' + (amount / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return '$' + (amount / 1e3).toFixed(1) + 'K';
  return '$' + amount.toFixed(0);
}
function formatExact(amount) { return '$' + Number(amount).toLocaleString('en-US'); }
function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function formatDateTime(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
    dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' }) + ' (sim)';
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function addHours(iso, h) { return new Date(new Date(iso).getTime() + h * 3600 * 1000).toISOString(); }
// Business days skip Sat/Sun only. Demo simplification: no federal holidays.
function addBusinessDays(iso, n) {
  const d = new Date(iso);
  let added = 0;
  while (added < n) {
    d.setUTCDate(d.getUTCDate() + 1);
    const day = d.getUTCDay();
    if (day !== 0 && day !== 6) added++;
  }
  return d.toISOString();
}
// FNV-1a 32-bit — a deterministic stand-in for the SHA-256 fingerprint the
// Act would print in the statute (synchronous, so it can run at load).
function fingerprint(obj) {
  const s = JSON.stringify(obj);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return 'fp-' + h.toString(16).padStart(8, '0');
}

/* ========== VOTE MATH (reused from prior demo — verified rules) ========== */
function majorityPassed(count) {
  if (!count) return false;
  const voting = count.yea + count.nay;
  return voting > 0 && count.yea > count.nay;
}
function majorityNeeded(count) {
  if (!count) return null;
  const voting = count.yea + count.nay;
  return voting > 0 ? Math.floor(voting / 2) + 1 : null;
}
function overrideThreshold(count) {
  if (!count) return null;
  const voting = count.yea + count.nay;
  return voting > 0 ? Math.ceil(voting * 2 / 3) : null;
}
function overridePassed(count) {
  const t = overrideThreshold(count);
  return t !== null && count.yea >= t;
}
function isVetoOverridden(votes) {
  if (!votes || votes.presidentialAction !== 'vetoed') return false;
  return overridePassed(votes.vetoOverrideHouse) && overridePassed(votes.vetoOverrideSenate);
}
function statusLabel(s) {
  const m = { draft:'Draft', in_committee:'In Committee', house_floor:'House Floor', house_voting:'House Voting', house_passed:'House Passed',
    house_failed:'House Failed', senate_floor:'Senate Floor', senate_voting:'Senate Voting', senate_passed:'Senate Passed',
    senate_failed:'Senate Failed', presidential_review:'Presidential Review', signed:'Signed', vetoed:'Vetoed',
    veto_override_house:'Veto Override (House)', veto_override_senate:'Veto Override (Senate)', enacted:'Enacted', failed:'Failed' };
  return m[s] || s;
}
function statusBadgeClass(s) {
  if (['enacted','signed','house_passed','senate_passed'].includes(s)) return 'badge--green';
  if (['failed','house_failed','senate_failed','vetoed'].includes(s)) return 'badge--red';
  if (['house_voting','senate_voting','veto_override_house','veto_override_senate'].includes(s)) return 'badge--amber';
  if (s === 'presidential_review') return 'badge--purple';
  if (['house_floor','senate_floor','in_committee'].includes(s)) return 'badge--blue';
  return 'badge--slate';
}

/* ========== JOURNAL HELPERS ========== */
function nextSeq(journal) { return journal.length ? journal[journal.length - 1].seq + 1 : 1; }
// Append an entry. publicAt defaults to +24h ("public in 24 hours");
// instant=true for brake entries ("reasons published instantly").
function appendEntry(s, kind, payload, opts) {
  opts = opts || {};
  const e = {
    seq: nextSeq(s.journal),
    id: kind + '-' + uid(),
    version: 1,
    supersedes: null,
    kind,
    writtenAt: s.simNow,
    enteredAt: s.simNow,
    publicAt: opts.instant ? s.simNow : addHours(s.simNow, 24),
    lineId: opts.lineId || null,
    refs: opts.refs || [],
    payload
  };
  s.journal.push(e);
  return e;
}
function entryBySeq(journal, seq) { return journal.find(e => e.seq === seq) || null; }
function isPublic(entry, simNow) { return new Date(entry.publicAt) <= new Date(simNow); }
// Walk refs back to the law entry — "show the chain from this payment back to the law."
function chainFor(journal, seq) {
  const chain = [];
  let cur = entryBySeq(journal, seq);
  const guard = new Set();
  while (cur && !guard.has(cur.seq)) {
    guard.add(cur.seq);
    chain.push(cur);
    cur = cur.refs.length ? entryBySeq(journal, cur.refs[0]) : null;
  }
  return chain;
}

/* ========== THE LEDGER — the published recipe ==========
   The Ledger has no authority of its own. It is a pure function of the
   Journal: anyone can re-run this and must get identical numbers. */
const LEDGER_RECIPE = [
  'for each enacted line L:',
  '  provided(L)  = sum of L.installments where available',
  '  committed(L) = sum of approved commitment entries on L',
  '  paid(L)      = sum of payment entries on L',
  '             + sum of reconciliation entries on L (floor fallback)',
  '  remaining(L) = provided(L) - committed(L)   // unobligated',
  '  open(L)      = committed(L) - paid(L)       // obligated, unpaid',
  'totals = sum over lines; report to the penny'
].join('\n');

function deriveLedger(journal, lines) {
  const out = { lines: {}, totals: { provided: 0, committed: 0, paid: 0, remaining: 0, open: 0 } };
  for (const line of lines) {
    const provided = line.installments.filter(i => i.available).reduce((s, i) => s + i.amount, 0);
    const commitments = journal.filter(e => e.kind === 'commitment' && e.lineId === line.id && !e.payload.refused);
    const committed = commitments.reduce((s, e) => s + e.payload.amount, 0);
    const paid = journal.filter(e => (e.kind === 'payment' || e.kind === 'reconciliation') && e.lineId === line.id)
      .reduce((s, e) => s + e.payload.amount, 0);
    const perCommitment = commitments.map(c => {
      const paidDown = journal.filter(e => (e.kind === 'payment' || e.kind === 'reconciliation') && e.payload.commitmentRef === c.seq)
        .reduce((s, e) => s + e.payload.amount, 0);
      const requestedOpen = journal.filter(e => e.kind === 'request' && e.payload.commitmentRef === c.seq && requestHasLiveWarrantPathPending(journal, e))
        .reduce((s, e) => s + e.payload.amount, 0);
      return { seq: c.seq, description: c.payload.description, contractor: c.payload.contractor, committed: c.payload.amount, paidDown, requestedOpen, open: c.payload.amount - paidDown };
    });
    out.lines[line.id] = { provided, committed, paid, remaining: provided - committed, open: committed - paid, perCommitment };
    out.totals.provided += provided; out.totals.committed += committed; out.totals.paid += paid;
  }
  out.totals.remaining = out.totals.provided - out.totals.committed;
  out.totals.open = out.totals.committed - out.totals.paid;
  return out;
}
// A request that produced a warrant not yet paid, or a pending flag,
// still holds claim against its commitment (prevents duplicate over-draws).
function requestHasLiveWarrantPathPending(journal, reqEntry) {
  const check = journal.find(e => e.kind === 'check' && e.refs.includes(reqEntry.seq));
  if (!check) return false;
  if (check.payload.outcome === 'VIOLATION') return false;
  const warrant = journal.find(e => e.kind === 'warrant' && chainContains(journal, e.seq, reqEntry.seq));
  if (warrant) {
    const paid = journal.find(e => e.kind === 'payment' && e.refs.includes(warrant.seq));
    return !paid;
  }
  // pending judgment flag
  if (check.payload.outcome === 'FLAG') {
    const adj = journal.find(e => e.kind === 'adjudication' && e.payload.flagRef === check.seq);
    return !adj || adj.payload.decision === 'approve';
  }
  return false;
}
function chainContains(journal, fromSeq, targetSeq) {
  return chainFor(journal, fromSeq).some(e => e.seq === targetSeq);
}

function pendingFlags(journal) {
  return journal.filter(e => e.kind === 'check' && e.payload.outcome === 'FLAG')
    .filter(flag => !journal.some(a => a.kind === 'adjudication' && a.payload.flagRef === flag.seq));
}
function warrantsAwaitingPayment(journal) {
  return journal.filter(e => e.kind === 'warrant')
    .filter(w => !journal.some(p => p.kind === 'payment' && p.refs.includes(w.seq)));
}
function payeeById(payees, listId, payeeId) {
  return (payees[listId] || []).find(p => p.id === payeeId) || null;
}
function lineById(state, lineId) { return state.bill.annex.lines.find(l => l.id === lineId) || null; }

/* ========== THE CONFORMITY CHECK — published, re-runnable code ==========
   Five tests: enough left, right purpose, inside the window, eligible
   recipient, no duplicate. Three outcomes: PASS / VIOLATION / FLAG. */
function runConformityCheck(state, req) {
  // req: { lineId, commitmentRef, payeeId, amount, purposeCode, invoiceNo }
  const line = lineById(state, req.lineId);
  const ledger = deriveLedger(state.journal, state.bill.annex.lines);
  const L = ledger.lines[req.lineId];
  const commitment = entryBySeq(state.journal, req.commitmentRef);
  const tests = [];
  let citedTerm = null;

  // 1. enough-left: against the commitment's open balance (incl. live pending requests)
  const per = commitment ? L.perCommitment.find(c => c.seq === commitment.seq) : null;
  const headroom = per ? per.open - per.requestedOpen : 0;
  const enoughLeft = !!per && req.amount <= headroom;
  tests.push({ id: 'enough-left', pass: enoughLeft, detail: per ? `${formatExact(req.amount)} requested vs ${formatExact(Math.max(0, headroom))} open on commitment #${commitment.seq}` : 'no such commitment' });
  if (!enoughLeft) citedTerm = citedTerm || (line ? line.enactedText : 'the enacted amount');

  // 2. right-purpose
  const rightPurpose = !!line && line.purposeCodes.includes(req.purposeCode);
  tests.push({ id: 'right-purpose', pass: rightPurpose, detail: `purpose "${req.purposeCode}" vs enacted purposes [${line ? line.purposeCodes.join(', ') : ''}]` });
  if (!rightPurpose) citedTerm = citedTerm || (line ? line.enactedText : '');

  // 3. inside-window (31 U.S.C. 1502 analogue — checked at request time on the demo clock)
  const now = new Date(state.simNow);
  const insideWindow = !!line && new Date(line.availability.start) <= now && (line.availability.noYear || now <= new Date(line.availability.end + 'T23:59:59Z'));
  tests.push({ id: 'inside-window', pass: insideWindow, detail: line ? (line.availability.noYear ? 'no-year (Availability Type X)' : `window ${line.availability.start} → ${line.availability.end}`) : '' });
  if (!insideWindow) citedTerm = citedTerm || (line ? line.enactedText : '');

  // 4. eligible-recipient: on the enacted payee list
  const payee = line ? payeeById(state.payees, line.payeeListId, req.payeeId) : null;
  tests.push({ id: 'eligible-recipient', pass: !!payee, detail: payee ? payee.name : `payee not on the enacted list for this line` });
  if (!payee) citedTerm = citedTerm || (line ? line.enactedText : '');

  // 5. no-duplicate: same commitment + invoice number
  const dup = state.journal.some(e => e.kind === 'request' && e.payload.commitmentRef === req.commitmentRef && e.payload.invoiceNo === req.invoiceNo);
  tests.push({ id: 'no-duplicate', pass: !dup, detail: dup ? `invoice ${req.invoiceNo} already requested against commitment #${req.commitmentRef}` : `invoice ${req.invoiceNo} is new` });
  if (dup) citedTerm = citedTerm || 'one payment per obligation and invoice';

  const anyFail = tests.some(t => !t.pass);
  if (anyFail) {
    return { outcome: 'VIOLATION', tests, citedTerm, flag: null };
  }
  // Judgment trigger: the machine never evaluates a judgment term — it
  // routes it to the named officer with a clock.
  if (payee && payee.needsJudgment && line.judgmentFields.length) {
    const jf = line.judgmentFields.find(j => j.term === payee.needsJudgment) || line.judgmentFields[0];
    return {
      outcome: 'FLAG', tests, citedTerm: null,
      flag: {
        term: jf.term, quote: jf.quote, adjudicator: jf.officer,
        deadline: addBusinessDays(state.simNow, jf.clockBusinessDays),
        largeAmount: req.amount >= OVERSIGHT_PING_THRESHOLD
      }
    };
  }
  return { outcome: 'PASS', tests, citedTerm: null, flag: null };
}

// Commitment-time check ("the check runs at contract-signing — where
// spending law actually bites — and again at payment").
function runCommitmentCheck(state, com) {
  const line = lineById(state, com.lineId);
  const ledger = deriveLedger(state.journal, state.bill.annex.lines);
  const L = ledger.lines[com.lineId];
  const tests = [];
  let citedTerm = null;
  const enoughLeft = !!L && com.amount <= L.remaining;
  tests.push({ id: 'enough-left', pass: enoughLeft, detail: L ? `${formatExact(com.amount)} vs ${formatExact(Math.max(0, L.remaining))} unobligated` : '' });
  if (!enoughLeft) citedTerm = line ? line.enactedText : '';
  const now = new Date(state.simNow);
  const insideWindow = !!line && new Date(line.availability.start) <= now && (line.availability.noYear || now <= new Date(line.availability.end + 'T23:59:59Z'));
  tests.push({ id: 'inside-window', pass: insideWindow, detail: line ? (line.availability.noYear ? 'no-year (X)' : `window ${line.availability.start} → ${line.availability.end}`) : '' });
  if (!insideWindow) citedTerm = citedTerm || (line ? line.enactedText : '');
  const rightPurpose = !!line && line.purposeCodes.includes(com.purposeCode);
  tests.push({ id: 'right-purpose', pass: rightPurpose, detail: `purpose "${com.purposeCode}"` });
  if (!rightPurpose) citedTerm = citedTerm || (line ? line.enactedText : '');
  return { outcome: tests.some(t => !t.pass) ? 'VIOLATION' : 'PASS', tests, citedTerm };
}

/* ========== DEADLINE PROCESSING (runs inside ADVANCE_CLOCK) ========== */
function processDeadlines(s) {
  // 1. Overdue judgment flags → silence deems approval, by operation of law.
  for (const flag of pendingFlags(s.journal)) {
    if (new Date(flag.payload.flag.deadline) <= new Date(s.simNow)) {
      const adj = appendEntry(s, 'adjudication', {
        flagRef: flag.seq, decision: 'approve', deemed: true,
        decidedBy: 'operation of law — silence deems approval (no adjudication within the enacted clock)',
        reasons: 'The named adjudicator did not act within ' + flag.payload.flag.term + '’s enacted clock; silence can never be a way to sit on lawful money.'
      }, { lineId: flag.lineId, refs: [flag.seq] });
      appendEntry(s, 'warrant', { checkRef: flag.seq, autoIssued: true, deemed: true, amount: reqAmountForCheck(s.journal, flag), payeeId: reqPayeeForCheck(s.journal, flag) },
        { lineId: flag.lineId, refs: [adj.seq] });
    }
  }
  // 2. Expired brake → automatic release ("expiring in 72 hours unless renewed").
  if (s.brake.active && new Date(s.brake.expiresAt) <= new Date(s.simNow)) {
    s.brake.active = false;
    appendEntry(s, 'brake-release', { reason: 'expired after 72 hours without renewal', lineId: s.brake.lineId }, { lineId: s.brake.lineId, instant: true });
  }
}
function reqForCheck(journal, checkEntry) {
  return entryBySeq(journal, checkEntry.refs[0]);
}
function reqAmountForCheck(journal, checkEntry) {
  const r = reqForCheck(journal, checkEntry);
  return r ? r.payload.amount : 0;
}
function reqPayeeForCheck(journal, checkEntry) {
  const r = reqForCheck(journal, checkEntry);
  return r ? r.payload.payeeId : null;
}
function nextDeadline(s) {
  const candidates = [];
  for (const f of pendingFlags(s.journal)) candidates.push(f.payload.flag.deadline);
  if (s.brake.active) candidates.push(s.brake.expiresAt);
  for (const e of s.journal) if (!isPublic(e, s.simNow)) candidates.push(e.publicAt);
  const future = candidates.filter(c => new Date(c) > new Date(s.simNow)).sort();
  return future.length ? future[0] : null;
}

/* ========== STORE & REDUCER ========== */
const Store = {
  _state: null,
  _listeners: [],
  getState() { return this._state; },
  dispatch(action) {
    this._state = reducer(this._state, action);
    this._persist();
    this._notify();
  },
  subscribe(fn) { this._listeners.push(fn); return () => { this._listeners = this._listeners.filter(l => l !== fn); }; },
  _notify() { this._listeners.forEach(fn => fn(this._state)); },
  _persist() { try { localStorage.setItem('efiscal-demo-state-v1', JSON.stringify(this._state)); } catch(e) {} },
  init() {
    try { const s = localStorage.getItem('efiscal-demo-state-v1'); if (s) { this._state = JSON.parse(s); return; } } catch(e) {}
    this._state = getInitialState();
  }
};

function reducer(state, action) {
  const s = JSON.parse(JSON.stringify(state));
  switch (action.type) {
    case 'SET_STATE': return action.payload;
    case 'SET_VIEW': s.currentView = action.payload; return s;
    case 'SELECT_LINE': s.selectedLineId = action.payload; return s;
    case 'SELECT_ENTRY': s.selectedEntrySeq = s.selectedEntrySeq === action.payload ? null : action.payload; return s;
    case 'SELECT_STUDY_COPY': s.selectedStudyCopyId = action.payload; return s;
    case 'SET_BILL_TAB': s.billTab = action.payload; return s;
    case 'SET_JOURNAL_FILTER': s.journalFilter = action.payload; return s;

    /* --- enactment (vote machinery writes here) --- */
    case 'UPDATE_BILL_STATUS': s.bill.status = action.payload.status; return s;
    case 'UPDATE_VOTES': Object.assign(s.bill.votes, action.payload.votes); return s;
    case 'ENACT_BILL': s.bill.status = 'enacted'; return s; // nothing hits the Journal yet
    case 'CERTIFY_ENACTMENT': {
      // The Clerk and the Secretary — the officers who attest enrolled
      // bills today — jointly certify the enacted formalization into the
      // Journal, whose law record they hold.
      if (s.bill.status !== 'enacted' || s.certified) return s;
      const law = appendEntry(s, 'law', {
        title: s.bill.title, fingerprint: s.bill.annex.fingerprint,
        lineIds: s.bill.annex.lines.map(l => l.id),
        certifiedBy: ['Clerk of the House', 'Secretary of the Senate']
      });
      appendEntry(s, 'certification', { lawRef: law.seq, note: 'Enrollment certification: printed text controls; the file is the same content in a second form.' }, { refs: [law.seq] });
      s.certified = true;
      return s;
    }
    case 'CERTIFY_READINESS': {
      // Shadow first: a line runs under ordinary process until the
      // Director and the Comptroller General jointly certify readiness.
      const r = s.readiness[action.payload.lineId];
      if (!r || r.mode === 'certified' || !s.certified) return s;
      r.mode = 'certified';
      r.certifiedBy = ['Director, Office of the Fiscal Record', 'Comptroller General'];
      r.certifiedAt = s.simNow;
      appendEntry(s, 'readiness-cert', { lineId: action.payload.lineId, certifiedBy: r.certifiedBy, standard: 'published in advance; quarantined trial (test data never enters the Journal)' }, { lineId: action.payload.lineId });
      return s;
    }

    /* --- the payment pipeline --- */
    case 'ADD_COMMITMENT': {
      const { lineId, amount, contractor, description, purposeCode } = action.payload;
      if (!s.certified) return s;
      if (s.readiness[lineId] && s.readiness[lineId].mode !== 'certified') {
        appendEntry(s, 'note', { note: 'Refused: line is in SHADOW — it runs under ordinary process until the Director and Comptroller General certify readiness.', refusedKind: 'commitment', lineId }, { lineId, instant: true });
        return s;
      }
      const check = runCommitmentCheck(s, { lineId, amount, purposeCode });
      const lawEntry = s.journal.find(e => e.kind === 'law');
      const lawRefs = lawEntry ? [lawEntry.seq] : [];
      if (check.outcome === 'VIOLATION') {
        appendEntry(s, 'commitment', { amount, contractor, description, purposeCode, refused: true, tests: check.tests, citedTerm: check.citedTerm }, { lineId, refs: lawRefs });
        return s;
      }
      appendEntry(s, 'commitment', { amount, contractor, description, purposeCode, refused: false, tests: check.tests }, { lineId, refs: lawRefs });
      return s;
    }
    case 'SUBMIT_REQUEST': {
      const req = action.payload; // { lineId, commitmentRef, payeeId, amount, purposeCode, invoiceNo }
      if (!s.certified) return s;
      if (s.floor.systemDown) {
        // The floor: if the system is down, payments proceed the old way
        // and reconcile after — never delay a lawful payment.
        s.floor.oldWayPayments.push({ at: s.simNow, ...req });
        return s;
      }
      if (s.readiness[req.lineId] && s.readiness[req.lineId].mode !== 'certified') {
        appendEntry(s, 'note', { note: 'Refused: line is in SHADOW — ordinary process applies until readiness is certified.', refusedKind: 'request', lineId: req.lineId }, { lineId: req.lineId, instant: true });
        return s;
      }
      if (s.brake.active && (s.brake.lineId === null || s.brake.lineId === req.lineId)) {
        // The brake suspends NEW requests only; it is not a conformity
        // violation and payments in flight are never touched.
        appendEntry(s, 'note', { note: 'Refused: the BRAKE is pulled on this line (3 of 4 Appropriations principals). New requests are suspended; reasons are on the record; the brake expires in 72 hours unless renewed.', refusedKind: 'request', brake: true, lineId: req.lineId }, { lineId: req.lineId, instant: true });
        return s;
      }
      // Run the check BEFORE appending the request entry, so the request
      // does not collide with itself on the no-duplicate test.
      const result = runConformityCheck(s, req);
      const reqEntry = appendEntry(s, 'request', { ...req }, { lineId: req.lineId, refs: [req.commitmentRef] });
      const checkEntry = appendEntry(s, 'check', { requestRef: reqEntry.seq, outcome: result.outcome, tests: result.tests, citedTerm: result.citedTerm, flag: result.flag }, { lineId: req.lineId, refs: [reqEntry.seq] });
      if (result.outcome === 'PASS') {
        // The warrant issues by itself — no human touches it, and none could.
        appendEntry(s, 'warrant', { checkRef: checkEntry.seq, autoIssued: true, deemed: false, amount: req.amount, payeeId: req.payeeId }, { lineId: req.lineId, refs: [checkEntry.seq] });
      } else if (result.outcome === 'FLAG' && result.flag.largeAmount) {
        // Large flagged amounts ping the overseers in real time — without
        // pausing the clock.
        s.oversightPings.push({ at: s.simNow, checkRef: checkEntry.seq, amount: req.amount, sentTo: 'Chairs and ranking members, Committees on Appropriations' });
      }
      return s;
    }
    case 'ADJUDICATE_FLAG': {
      const { flagRef, decision, reasons, citedTerm } = action.payload;
      const flag = entryBySeq(s.journal, flagRef);
      if (!flag || flag.kind !== 'check' || flag.payload.outcome !== 'FLAG') return s;
      if (s.journal.some(a => a.kind === 'adjudication' && a.payload.flagRef === flagRef)) return s;
      // A denial must cite the exact enacted term violated.
      if (decision === 'deny' && !citedTerm) return s;
      const adj = appendEntry(s, 'adjudication', { flagRef, decision, reasons: reasons || '', citedTerm: citedTerm || null, deemed: false, decidedBy: flag.payload.flag.adjudicator }, { lineId: flag.lineId, refs: [flagRef] });
      if (decision === 'approve') {
        appendEntry(s, 'warrant', { checkRef: flagRef, autoIssued: true, deemed: false, amount: reqAmountForCheck(s.journal, flag), payeeId: reqPayeeForCheck(s.journal, flag) }, { lineId: flag.lineId, refs: [adj.seq] });
      }
      return s;
    }
    case 'EXECUTE_PAYMENT': {
      const warrant = entryBySeq(s.journal, action.payload.warrantRef);
      if (!warrant || warrant.kind !== 'warrant') return s;
      if (s.journal.some(p => p.kind === 'payment' && p.refs.includes(warrant.seq))) return s;
      const line = lineById(s, warrant.lineId);
      const check = entryBySeq(s.journal, warrant.payload.checkRef);
      const reqEntry = check ? reqForCheck(s.journal, check) : null;
      const rail = line ? line.rail : 'A';
      if (rail === 'B') {
        if (s.account.balance < warrant.payload.amount) {
          appendEntry(s, 'note', { note: 'Payment held: the Congressional General Account balance is insufficient. The Council must requisition first (the Bank credits on requisition; no Treasury officer acts).', refusedKind: 'payment' }, { lineId: warrant.lineId, instant: true });
          return s;
        }
        s.account.balance -= warrant.payload.amount;
      }
      appendEntry(s, 'payment', {
        warrantRef: warrant.seq, amount: warrant.payload.amount, payeeId: warrant.payload.payeeId,
        commitmentRef: reqEntry ? reqEntry.payload.commitmentRef : null,
        rail,
        certifiedBy: rail === 'A' ? 'House CAO / Secretary of the Senate (the chambers’ disbursing officers, 2 U.S.C. §§5309, 1907)' : 'Federal Reserve Bank of New York, from the Congressional General Account (janitor rule: the Bank holds no key)',
        processedBy: rail === 'A' ? 'Treasury, exactly as today — pay only against a warrant, and pay every warranted payment' : 'the Fed’s ordinary systems'
      }, { lineId: warrant.lineId, refs: [warrant.seq] });
      return s;
    }

    /* --- the clock --- */
    case 'ADVANCE_CLOCK': {
      if (action.payload.toNext) {
        const nd = nextDeadline(s);
        if (!nd) return s;
        s.simNow = addHours(nd, 0.02); // land just past it
      } else if (action.payload.businessDays) {
        s.simNow = addBusinessDays(s.simNow, action.payload.businessDays);
      } else {
        s.simNow = addHours(s.simNow, action.payload.hours || 1);
      }
      processDeadlines(s);
      return s;
    }

    /* --- the brake --- */
    case 'PULL_BRAKE': {
      const { holders, reasons, lineId } = action.payload;
      if (!holders || holders.length < 3) return s; // three of four to pull
      s.brake = { active: true, lineId: lineId || null, pulledAt: s.simNow, expiresAt: addHours(s.simNow, 72), holders, reasons: reasons || '', renewals: 0 };
      appendEntry(s, 'brake', { holdersSigned: holders, reasons: reasons || '', lineId: lineId || null, expiresAt: s.brake.expiresAt, note: 'Suspends NEW requests only. Payments in flight are never touched. A separate technical switch merely returns a line to ordinary processing and never stops money.' }, { lineId: lineId || null, instant: true });
      return s;
    }
    case 'RENEW_BRAKE': {
      if (!s.brake.active) return s;
      s.brake.expiresAt = addHours(s.brake.expiresAt, 72);
      s.brake.renewals += 1;
      appendEntry(s, 'brake', { renewed: true, holdersSigned: s.brake.holders, expiresAt: s.brake.expiresAt }, { lineId: s.brake.lineId, instant: true });
      return s;
    }
    case 'RELEASE_BRAKE': {
      if (!s.brake.active) return s;
      s.brake.active = false;
      appendEntry(s, 'brake-release', { reason: 'released by the principals', lineId: s.brake.lineId }, { lineId: s.brake.lineId, instant: true });
      return s;
    }

    /* --- the floor --- */
    case 'SET_SYSTEM_DOWN': {
      s.floor.systemDown = true; s.floor.downSince = s.simNow;
      return s;
    }
    case 'RESTORE_SYSTEM': {
      s.floor.systemDown = false;
      // Reconcile after: every old-way payment enters the Journal now.
      for (const p of s.floor.oldWayPayments) {
        appendEntry(s, 'reconciliation', { note: 'Paid the old way while the system was down; reconciled into the record after restore. At no time shall the machine’s operation or non-operation delay or prevent the payment of any amount lawfully due.', at: p.at, amount: p.amount, payeeId: p.payeeId, commitmentRef: p.commitmentRef, lineId: p.lineId }, { lineId: p.lineId });
      }
      s.floor.oldWayPayments = [];
      return s;
    }

    /* --- milestones & the Account --- */
    case 'CERTIFY_MILESTONE': {
      for (const line of s.bill.annex.lines) {
        const m = line.milestones.find(m => m.id === action.payload.milestoneId);
        if (m && m.status === 'pending') {
          m.status = 'certified';
          const inst = line.installments.find(i => i.id === m.unlocksInstallment);
          if (inst) inst.available = true;
          appendEntry(s, 'milestone-cert', { milestoneId: m.id, certifier: m.certifier, description: m.description, unlockedInstallment: m.unlocksInstallment, note: 'A condition that executes itself: the second installment becomes available upon certification, automatically.' }, { lineId: line.id });
        }
      }
      return s;
    }
    case 'COUNCIL_REQUISITION': {
      const { amount, basis, votes } = action.payload;
      if (!votes || votes < 3) return s; // three votes to act; ties fail toward ordinary processing
      const reqn = appendEntry(s, 'requisition', { amount, basis, by: 'The Council', note: 'As-needed funding on the consumer-bureau pattern; its basis entered in the Journal. No Treasury officer takes any action at any step.' });
      appendEntry(s, 'credit', { requisitionRef: reqn.seq, amount, by: 'Federal Reserve Bank of New York', note: 'A special obligation of the United States arises by operation of the statute; the Bank records it and credits the Account. General obligation — coins-and-United-States-notes family — expressly not a Federal Reserve note or a Treasury security. Outside the debt limit; pays the Bank’s own overnight rate.' }, { refs: [reqn.seq] });
      s.account.balance += amount;
      s.account.obligationOutstanding += amount;
      s.council.lastVote = { at: s.simNow, votes, amount };
      return s;
    }

    /* --- outside reconstruction --- */
    case 'RUN_RECONSTRUCTION': {
      const official = deriveLedger(s.journal, s.bill.annex.lines);
      const rebuilt = deriveLedger(JSON.parse(JSON.stringify(s.journal)), JSON.parse(JSON.stringify(s.bill.annex.lines)));
      s.reconstruction = {
        at: s.simNow,
        match: JSON.stringify(official) === JSON.stringify(rebuilt),
        officialTotals: official.totals, rebuiltTotals: rebuilt.totals
      };
      return s;
    }
    case 'RESET_DEMO': return getInitialState();
    default: return s;
  }
}

/* ========== VOTE SIMULATION (reused machinery, single bill) ========== */
const HOUSE_MEMBERS = []; const SENATE_MEMBERS = [];
for (let i = 1; i <= 435; i++) HOUSE_MEMBERS.push({ id: 'h' + i, name: 'Representative ' + i, chamber: 'house' });
for (let i = 1; i <= 100; i++) SENATE_MEMBERS.push({ id: 's' + i, name: 'Senator ' + i, chamber: 'senate' });

let voteAnimating = false;
let voteInterval = null;

function generateVoteOutcome(totalMembers, members, targetYea, variance) {
  const yea = Math.min(totalMembers, Math.max(0, targetYea + Math.floor((Math.random() - 0.5) * variance * 2)));
  const absent = Math.floor(Math.random() * Math.min(10, totalMembers * 0.05));
  const present = Math.floor(Math.random() * Math.min(5, totalMembers * 0.02));
  const nay = totalMembers - yea - absent - present;
  const outcomes = [];
  for (let i = 0; i < totalMembers; i++) {
    let vote;
    if (i < yea) vote = 'yea';
    else if (i < yea + nay) vote = 'nay';
    else if (i < yea + nay + present) vote = 'present';
    else vote = 'absent';
    outcomes.push({ memberId: members[i].id, vote });
  }
  for (let i = outcomes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [outcomes[i], outcomes[j]] = [outcomes[j], outcomes[i]];
  }
  return outcomes;
}

function startVoteAnimation(chamber, isOverride) {
  if (voteAnimating) return;
  voteAnimating = true;
  const isHouse = chamber === 'house';
  const totalMembers = isHouse ? 435 : 100;
  const members = isHouse ? HOUSE_MEMBERS : SENATE_MEMBERS;
  const targetYea = isHouse ? (isOverride ? 292 : 237) : (isOverride ? 68 : 55);
  const variance = isHouse ? 20 : 8;
  const outcomes = generateVoteOutcome(totalMembers, members, targetYea, variance);
  let idx = 0;
  const counts = { yea: 0, nay: 0, present: 0, absent: 0 };
  const prefix = isOverride ? `override-${chamber}` : chamber;

  voteInterval = setInterval(() => {
    if (idx >= outcomes.length) {
      clearInterval(voteInterval);
      voteAnimating = false;
      const voteUpdate = {};
      if (isOverride) {
        if (isHouse) voteUpdate.vetoOverrideHouse = { ...counts };
        else voteUpdate.vetoOverrideSenate = { ...counts };
      } else {
        if (isHouse) voteUpdate.houseCount = { ...counts };
        else voteUpdate.senateCount = { ...counts };
      }
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { votes: voteUpdate } });
      if (!isOverride) {
        Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { status: majorityPassed(counts) ? (isHouse ? 'house_passed' : 'senate_passed') : (isHouse ? 'house_failed' : 'senate_failed') } });
      } else {
        const st = Store.getState();
        if (isVetoOverridden(st.bill.votes)) Store.dispatch({ type: 'ENACT_BILL' });
      }
      return;
    }
    const v = outcomes[idx];
    counts[v.vote]++;
    idx++;
    const yeaEl = document.getElementById(`${prefix}-yea-count`);
    const nayEl = document.getElementById(`${prefix}-nay-count`);
    const otherEl = document.getElementById(`${prefix}-other-count`);
    const yeaBar = document.getElementById(`${prefix}-yea-bar`);
    const nayBar = document.getElementById(`${prefix}-nay-bar`);
    const otherBar = document.getElementById(`${prefix}-other-bar`);
    const castEl = document.getElementById(`${prefix}-cast`);
    if (yeaEl) yeaEl.textContent = counts.yea;
    if (nayEl) nayEl.textContent = counts.nay;
    if (otherEl) otherEl.textContent = counts.present + counts.absent;
    if (yeaBar) yeaBar.style.width = (counts.yea / totalMembers * 100) + '%';
    if (nayBar) nayBar.style.width = (counts.nay / totalMembers * 100) + '%';
    if (otherBar) otherBar.style.width = ((counts.present + counts.absent) / totalMembers * 100) + '%';
    if (castEl) castEl.textContent = idx;
  }, 7);
}

/* ========== VIEW: THE PROBLEM ========== */
function renderProblem(state) {
  return `<div class="content-inner">
    <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">The Translation Problem</h1>
    <p class="text-muted mb-4" style="font-size:13.5px;">When Congress passes a spending law, it passes paragraphs of text. Before a dollar can move, someone must translate those paragraphs into what a financial system runs on — and today, all of that translation happens <strong>after the vote, outside the enacted text, by the executive branch</strong>.</p>

    <div class="card card--flush mb-4">
      <div class="card__header"><h3>How prose becomes payment today</h3><span class="text-sm text-muted">one row is enacted law — six are translation</span></div>
      <div class="card__body">
        <ol style="margin-left:18px;font-size:13px;line-height:1.7;">
          <li><strong>Identity.</strong> Treasury assigns the account its code — the Treasury Account Symbol (below)</li>
          <li><strong>On the books.</strong> Treasury issues a warrant crediting the account (FS Form 6200, electronic in CARS; the GAO countersignature was abolished in 1991)</li>
          <li><strong>The schedule.</strong> OMB apportions on the SF-132 — written by presidential staff after the vote, and legally binding</li>
          <li><strong>The internal split.</strong> The agency subdivides the schedule into allowances</li>
          <li><strong>The commitment.</strong> The agency signs the contract — where spending law actually bites</li>
          <li><strong>Payment.</strong> Nearly all federal cash sits in one pool — the government's account at the Federal Reserve; an appropriation "balance" is a ledger entitlement against it</li>
          <li><strong>Reporting.</strong> Upward and outward, in the executive's own categories (DATA Act broker files → USAspending, monthly, after obligation)</li>
        </ol>
      </div>
    </div>

    <div class="grid-2 mb-4">
      <div class="card" style="margin-bottom:0;">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:8px;">The text IS machine-readable — the money is not</h3>
        <p class="text-sm mb-2">Enrolled bills and public laws have been published in <strong>USLM XML</strong> since the 113th Congress (GPO/OLRC, github.com/usgpo/uslm). But USLM has <strong>no fiscal elements</strong>: a dollar figure like "$41,455,000" is just a text node. No element carries an amount, an account, a period of availability, or budget authority.</p>
        <p class="text-sm mb-2">The House Clerk's <strong>Comparative Print Suite</strong> (2022) already parses and <em>executes</em> amendments against structured law text. E-FISCAL extends that idea from text diffs to fiscal records.</p>
        <p class="text-xs text-muted">Since 2022, OMB apportionments must post publicly within 2 business days (P.L. 117-103, Div. E &sect;204) — the first structured public fiscal act after enactment. The posting site was taken down in March 2025 and restored by court order that August: executive-held fiscal data is only as public as the executive keeps it.</p>
      </div>
      <div class="card card--flush" style="margin-bottom:0;">
        <div class="card__header"><h3>The Treasury Account Symbol — 8 components</h3><span class="text-xs text-muted">assigned by Treasury in CARS, after enactment</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Field</th><th>Len</th><th>What it says</th></tr></thead>
          <tbody class="text-sm">
            <tr><td>SP — Sub-level Prefix</td><td>2</td><td>Subdivision prefix</td></tr>
            <tr><td>ATA — Allocation Transfer Agency</td><td>3</td><td>Only when another agency spends the owner's funds</td></tr>
            <tr><td>AID — Agency Identifier</td><td>3</td><td>The owning agency</td></tr>
            <tr><td>BPOA / EPOA — Availability years</td><td>4+4</td><td>First and last usable years</td></tr>
            <tr><td>A — Availability Type</td><td>1</td><td>"X" = no-year (mutually exclusive with BPOA/EPOA)</td></tr>
            <tr><td>MAIN — Main Account</td><td>4</td><td>The account; the number family reveals the fund type</td></tr>
            <tr><td>SUB — Sub-Account</td><td>3</td><td>Optional finer split</td></tr>
          </tbody>
        </table></div>
        <p class="text-xs text-muted" style="padding: 8px 20px;">The explainer's 6-row table simplifies; the canonical component TAS is 24 fixed-width characters across these 8 fields. None of them appear in the enacted bill — which is the point.</p>
      </div>
    </div>

    <div class="grid-2 mb-4">
      <div class="alert alert--info" style="margin-bottom:0;">
        <strong>Exception one — appropriated, no schedule.</strong> The institutional Congress (House, Senate, committees, Members, officers, the Architect of the Capitol) is exempt from apportionment entirely — 31 U.S.C. &sect;1511(b)(3). Support agencies (GAO, LOC, CBO, GPO) self-apportion under &sect;1513(a). That empty seat is where this pilot lands.
      </div>
      <div class="alert alert--info" style="margin-bottom:0;">
        <strong>Exception two — never touches the Treasury.</strong> The CFPB's Director requisitions from the Fed's combined earnings into a fund at the Fed — no Treasury account, no warrant, no annual review — audited by GAO and upheld 7-2 in 2024: a standing law naming a source, a purpose, and a cap IS an "Appropriation made by Law."
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:14px;font-weight:700;margin-bottom:8px;">The fix — the one-page version</h3>
      <ol style="margin-left:18px;font-size:13px;line-height:1.75;">
        <li><strong>The problem.</strong> The executable version of every spending law is produced after enactment, by the executive. February 2025 showed what that costs.</li>
        <li><strong>The fix.</strong> Enact the mechanical structure before the vote — amounts, dates, purposes, payees as labeled fields — with judgment calls named, clocked, and public.</li>
        <li><strong>The safety.</strong> A pilot only: Congress's own money, existing payment rails, no executive funds ever without a new law, and expressly no central bank digital currency.</li>
        <li><strong>The legal basis.</strong> The Journal and Statement-and-Account Clauses; the legislative branch's existing fiscal autonomy; funding on the model the Supreme Court upheld in 2024.</li>
        <li><strong>The ask.</strong> Authorize the infrastructure, the three-year pilot, and an independent evaluation due a full year before sunset.</li>
      </ol>
      <button class="btn btn--primary mt-2" data-action="set-view" data-view="bill">Read the bill &rarr;</button>
    </div>
  </div>`;
}

/* ========== VIEW: THE BILL ========== */
function getStepperState(bill) {
  const s = bill.status;
  const steps = [
    { label: 'Committee', state: 'pending' },
    { label: 'House Vote', state: 'pending' },
    { label: 'Senate Vote', state: 'pending' },
    { label: 'Presidential', state: 'pending' },
    { label: 'Enacted', state: 'pending' }
  ];
  const idx = ['draft','in_committee'].includes(s) ? 0 :
    ['house_floor','house_voting'].includes(s) ? 1 :
    ['house_passed','house_failed','senate_floor','senate_voting'].includes(s) ? 2 :
    ['senate_passed','senate_failed','presidential_review','signed','vetoed','veto_override_house','veto_override_senate'].includes(s) ? 3 :
    s === 'enacted' ? 4 : 0;
  for (let i = 0; i < 5; i++) {
    if (i < idx) steps[i].state = 'done';
    else if (i === idx) steps[i].state = 'active';
  }
  if (s === 'enacted') steps[4].state = 'done';
  if (['house_failed','failed'].includes(s)) { steps[0].state = 'done'; steps[1].state = 'failed'; }
  if (s === 'senate_failed') { steps[0].state = 'done'; steps[1].state = 'done'; steps[2].state = 'failed'; }
  return steps;
}
function renderStepper(steps) {
  return `<div class="stepper">${steps.map((st, i) => `
    ${i > 0 ? `<div class="stepper__line ${st.state === 'done' || (steps[i-1] && steps[i-1].state === 'done') ? 'stepper__line--done' : ''}"></div>` : ''}
    <div class="stepper__node">
      <div class="stepper__circle stepper__circle--${st.state}">${st.state === 'done' ? '&#10003;' : st.state === 'failed' ? '&#10007;' : (i+1)}</div>
      <div class="stepper__text stepper__text--${st.state}">${st.label}</div>
    </div>
  `).join('')}</div>`;
}

function renderFieldRows(line) {
  const mech = (label, value) => `<div class="field-row field-row--mech"><span class="field-row__label">${label}</span><span class="field-row__value">${value}</span></div>`;
  const judg = (label, value) => `<div class="field-row field-row--judg"><span class="field-row__label">${label}</span><span class="field-row__value">${value}</span></div>`;
  const t = line.tas;
  let html = '';
  html += mech('Amount', formatExact(line.amount) + ' <span class="badge badge--amber">DRAFT [$]</span>');
  if (line.installments.length > 1) {
    html += mech('Installments', line.installments.map(i => `${formatExact(i.amount)} (${i.available ? 'available' : 'locked — ' + i.unlockedBy})`).join(' · '));
  }
  html += mech('Availability', line.availability.noYear ? 'no-year — until expended (Type X)' : `${line.availability.start} &rarr; ${line.availability.end}`);
  html += mech('Purposes', line.purposeCodes.join(', '));
  html += mech('Eligible payees', 'enacted list "' + line.payeeListId + '" (' + (PAYEE_LISTS[line.payeeListId] || []).length + ' entries)');
  html += mech('Rail', line.rail === 'A' ? 'A — Treasury (chambers’ officers certify; Treasury processes as today)' : 'B — the Bank pays from the Congressional General Account');
  html += mech('TAS (illustrative)', `${t.sp}-${t.ata || '&mdash;'}-${t.aid}-${line.availability.noYear ? 'X' : t.bpoa + '/' + t.epoa}-${t.main}-${t.sub}`);
  for (const jf of line.judgmentFields) {
    html += judg('Judgment: "' + jf.term + '"', escHtml(jf.quote) + ` &mdash; assigned to <strong>${escHtml(jf.officer)}</strong>, ${jf.clockBusinessDays} business days, silence deems approval`);
  }
  for (const m of line.milestones) {
    html += mech('Milestone', `${escHtml(m.description)} &mdash; unlocks installment ${m.unlocksInstallment} (${m.status})`);
  }
  return html;
}

function renderBill(state) {
  const bill = state.bill;
  const tab = state.billTab;
  return `<div class="content-inner">
    <div class="flex items-center gap-2 mb-2" style="flex-wrap:wrap;">
      <h1 style="font-size:20px;font-weight:800;">${escHtml(bill.title)}</h1>
      <span class="badge ${statusBadgeClass(bill.status)}">${statusLabel(bill.status)}</span>
      ${state.certified ? '<span class="badge badge--green">Certified into the Journal</span>' : ''}
    </div>
    <p class="text-sm text-muted mb-4">Electronic Fiscal Information, Statutory Codification and Automated Legislation. The bill carries the legislative text <em>and</em> an Annex that is the machine-readable schedule — enacted together; the printed text controls.</p>
    <div class="tabs">
      <button class="tab ${tab==='text'?'tab--active':''}" data-action="set-bill-tab" data-tab="text">Text</button>
      <button class="tab ${tab==='annex'?'tab--active':''}" data-action="set-bill-tab" data-tab="annex">Annex — Formalized Schedule</button>
      <button class="tab ${tab==='enact'?'tab--active':''}" data-action="set-bill-tab" data-tab="enact">Enactment</button>
    </div>
    ${tab === 'text' ? renderBillText(bill) : ''}
    ${tab === 'annex' ? renderBillAnnex(state) : ''}
    ${tab === 'enact' ? renderBillEnact(state) : ''}
  </div>`;
}
function renderBillText(bill) {
  return bill.sections.map(sec => `<div class="card" style="padding:16px 20px;">
    <h3 style="font-size:13px;font-weight:800;margin-bottom:6px;">${escHtml(sec.heading)}</h3>
    <p class="text-sm" style="line-height:1.7;">${escHtml(sec.prose)}</p>
  </div>`).join('');
}
function renderBillAnnex(state) {
  const annex = state.bill.annex;
  return `<div>
    <div class="draft-banner"><strong>All amounts are DRAFT placeholders</strong> — bracketed in the discussion draft, bracketed here. TAS digits are illustrative: today the real TAS is assigned by Treasury in CARS <em>after</em> enactment — closing that gap is what the Annex is for.</div>
    ${annex.lines.map(line => `<div class="card" style="padding:16px 20px;">
      <div class="flex justify-between items-center mb-2" style="flex-wrap:wrap;gap:6px;">
        <h3 style="font-size:13.5px;font-weight:800;">${escHtml(line.name)}</h3>
        <span class="text-sm"><strong>${formatCurrency(line.amount)}</strong> <span class="badge badge--amber">DRAFT</span></span>
      </div>
      <p class="text-xs text-muted mb-2" style="font-style:italic;">"${escHtml(line.enactedText)}"</p>
      ${renderFieldRows(line)}
    </div>`).join('')}
    <div class="card" style="padding:14px 20px;">
      <div class="flex items-center gap-2" style="flex-wrap:wrap;">
        <span class="section-title" style="margin:0;">Fingerprint printed in the statute</span>
        <span class="fingerprint">${annex.fingerprint}</span>
        <span class="text-xs text-muted">demo hash (FNV-1a) — stands in for SHA-256. The printed text controls; the file is the same content in a second form, and anyone can verify the match.</span>
      </div>
    </div>
    <div class="alert alert--info"><span style="background:var(--green-100);padding:1px 6px;border-radius:4px;font-weight:700;">green</span> = mechanical fields — the only things the machine ever evaluates. <span style="background:var(--amber-100);padding:1px 6px;border-radius:4px;font-weight:700;">amber</span> = judgment fields — marked in the text, assigned to a named officer, never touched by the machine.</div>
  </div>`;
}
function renderBillEnact(state) {
  const bill = state.bill;
  const v = bill.votes;
  const s = bill.status;
  return `<div>
    ${renderStepper(getStepperState(bill))}
    ${renderCommitteeStage(bill, s)}
    ${renderVoteSection(bill, 'house', v, s)}
    ${renderVoteSection(bill, 'senate', v, s)}
    ${renderPresidentialSection(bill, v, s)}
    ${v.presidentialAction === 'vetoed' ? renderOverrideSection(bill, v, s) : ''}
    ${s === 'enacted' && !state.certified ? `<div class="card mb-4">
      <div class="card__header"><h3>Certification into the Journal</h3></div>
      <div class="card__body">
        <p class="text-sm mb-2">The bill is enacted. The <strong>Clerk of the House</strong> and the <strong>Secretary of the Senate</strong> — the officers who attest enrolled bills today — jointly certify the enacted formalization into the Journal, whose law record they hold.</p>
        <button class="btn btn--success" data-action="certify-enactment">Certify the Enacted File into the Journal</button>
      </div>
    </div>` : ''}
    ${state.certified ? '<div class="alert alert--success"><strong>Certified.</strong> The law is Journal entry #1 — the formalized schedule is now the operative record. Every line still runs in SHADOW until the Director and the Comptroller General certify readiness, line by line (Governance view).</div>' : ''}
  </div>`;
}
function renderCommitteeStage(bill, status) {
  const past = !['draft','in_committee'].includes(status);
  return `<div class="card mb-4">
    <div class="card__header"><h3>Committee of Jurisdiction</h3><span class="text-sm text-muted">referral &middot; markup &middot; report</span></div>
    <div class="card__body">
      <p class="text-xs text-muted mb-2">Appropriation bills originate in the House by longstanding custom and are shaped in committee before floor consideration.</p>
      ${status === 'draft' ? `<button class="btn btn--primary" data-action="refer-committee">Refer to Committee</button>` : ''}
      ${status === 'in_committee' ? `<div class="alert alert--info mb-2">Markup underway.</div><button class="btn btn--primary" data-action="report-bill">Report Bill to the House Floor</button>` : ''}
      ${past ? '<div class="alert alert--success">Reported to the House floor.</div>' : ''}
    </div>
  </div>`;
}
function renderVoteSection(bill, chamber, votes, status) {
  const isHouse = chamber === 'house';
  const total = isHouse ? 435 : 100;
  const label = isHouse ? 'House of Representatives' : 'United States Senate';
  const count = isHouse ? votes.houseCount : votes.senateCount;
  const cast = count ? count.yea + count.nay + count.present + count.absent : 0;
  const needsCloture = !isHouse && status === 'house_passed' && !(votes.cloture && votes.cloture.invoked);
  const canVote = isHouse ?
    ['house_floor','house_voting'].includes(status) :
    ['senate_floor','senate_voting'].includes(status);
  const passed = majorityPassed(count);
  const voteDone = cast >= total;
  const needed = majorityNeeded(count);
  const tied = voteDone && count && count.yea === count.nay && !votes.vpTieBreak;
  return `<div class="card mb-4">
    <div class="card__header"><h3>${label}</h3><span class="text-sm text-muted"><span id="${chamber}-cast">${cast}</span> / ${total} votes cast</span></div>
    <div class="card__body">
      <p class="text-xs text-muted mb-2">Passage requires a majority of Members present and voting (a quorum being present)${isHouse ? '' : ' — the Vice President breaks a tie'}.</p>
      ${!isHouse && needsCloture ? `<div class="alert alert--warning mb-2"><strong>Cloture required.</strong> Most measures need 60 votes to end debate (Rule XXII).${votes.cloture && !votes.cloture.invoked ? ` Last motion failed ${votes.cloture.yea}&ndash;${votes.cloture.nay}.` : ''}</div>
      <button class="btn btn--primary mb-2" data-action="file-cloture">File Cloture Motion (60 to proceed)</button>` : ''}
      ${!isHouse && votes.cloture && votes.cloture.invoked ? `<p class="text-xs mb-2" style="color:var(--green-600);">Cloture invoked ${votes.cloture.yea}&ndash;${votes.cloture.nay}.</p>` : ''}
      <div class="tally">
        <div class="tally__counts">
          <span style="color:var(--green-600)">Yea: <span id="${chamber}-yea-count">${count ? count.yea : 0}</span></span>
          <span style="color:var(--red-600)">Nay: <span id="${chamber}-nay-count">${count ? count.nay : 0}</span></span>
          <span style="color:var(--slate-500)">Other: <span id="${chamber}-other-count">${count ? count.present + count.absent : 0}</span></span>
        </div>
        <div class="tally__bar">
          <div class="tally__yea" id="${chamber}-yea-bar" style="width:${count ? count.yea/total*100 : 0}%"></div>
          <div class="tally__nay" id="${chamber}-nay-bar" style="width:${count ? count.nay/total*100 : 0}%"></div>
          <div class="tally__other" id="${chamber}-other-bar" style="width:${count ? (count.present+count.absent)/total*100 : 0}%"></div>
          <div class="tally__threshold" style="left:50%"><span class="tally__threshold-label">majority</span></div>
        </div>
      </div>
      ${voteDone && !tied ? `<div class="alert ${passed ? 'alert--success' : 'alert--error'}">${passed ? 'PASSED' : 'FAILED'}: ${count.yea} yea, ${count.nay} nay &mdash; ${needed} of the ${count.yea + count.nay} voting needed${votes.vpTieBreak && !isHouse ? ' (incl. the Vice President’s tie-breaking vote)' : ''}</div>` : ''}
      ${tied && !isHouse ? `<div class="alert alert--warning">TIED ${count.yea}&ndash;${count.nay}.</div><button class="btn btn--primary" data-action="vp-tiebreak">Vice President Votes Aye</button>` : ''}
      ${tied && isHouse ? `<div class="alert alert--error">TIED — a tie vote fails in the House.</div>` : ''}
      ${canVote && !voteDone ? `<button class="btn btn--primary" data-action="simulate-vote" data-chamber="${chamber}" ${voteAnimating ? 'disabled' : ''}>Simulate ${isHouse ? 'House' : 'Senate'} Vote</button>` : ''}
    </div>
  </div>`;
}
function renderPresidentialSection(bill, votes, status) {
  if (!['senate_passed','presidential_review','signed','vetoed','veto_override_house','veto_override_senate','enacted'].includes(status)) return '';
  return `<div class="card mb-4">
    <div class="card__header"><h3>Presidential Action</h3></div>
    <div class="card__body">
      ${votes.presidentialAction === 'signed' ? '<div class="alert alert--success"><strong>President Signed</strong> the bill into law.</div>' : ''}
      ${votes.presidentialAction === 'no_action' ? '<div class="alert alert--success"><strong>Became Law Without Signature</strong> — ten days passed with Congress in session (Art. I, &sect; 7).</div>' : ''}
      ${votes.presidentialAction === 'vetoed' ? '<div class="alert alert--error"><strong>President Vetoed</strong> the bill.</div>' : ''}
      ${!votes.presidentialAction ? `<p class="mb-2 text-sm">The bill has passed both chambers. Sign, veto, or let ten days pass.</p>
        <div class="flex gap-2">
          <button class="btn btn--success" data-action="sign-bill">Sign into Law</button>
          <button class="btn btn--outline" data-action="no-action-bill">Let 10 Days Pass</button>
          <button class="btn btn--danger" data-action="veto-bill">Veto</button>
        </div>` : ''}
    </div>
  </div>`;
}
function renderOverrideSection(bill, votes, status) {
  const chambers = [
    { key: 'house', label: 'House Override Vote', total: 435, count: votes.vetoOverrideHouse, prefix: 'override-house' },
    { key: 'senate', label: 'Senate Override Vote', total: 100, count: votes.vetoOverrideSenate, prefix: 'override-senate' }
  ];
  return chambers.map(ch => {
    const count = ch.count;
    const cast = count ? count.yea + count.nay + count.present + count.absent : 0;
    const voteDone = cast >= ch.total;
    const threshold = count && (count.yea + count.nay) > 0 ? overrideThreshold(count) : Math.ceil(ch.total * 2 / 3);
    const passed = count && overridePassed(count);
    const canVote = ch.key === 'house' ? ['vetoed','veto_override_house'].includes(status) && !votes.vetoOverrideHouse :
      ['veto_override_house','veto_override_senate'].includes(status) && votes.vetoOverrideHouse && !votes.vetoOverrideSenate;
    return `<div class="card mb-4">
      <div class="card__header"><h3>${ch.label} (2/3 of those voting)</h3><span class="text-sm text-muted"><span id="${ch.prefix}-cast">${cast}</span> / ${ch.total} votes cast</span></div>
      <div class="card__body">
        <div class="tally">
          <div class="tally__counts">
            <span style="color:var(--green-600)">Yea: <span id="${ch.prefix}-yea-count">${count ? count.yea : 0}</span></span>
            <span style="color:var(--red-600)">Nay: <span id="${ch.prefix}-nay-count">${count ? count.nay : 0}</span></span>
            <span style="color:var(--slate-500)">Other: <span id="${ch.prefix}-other-count">${count ? count.present + count.absent : 0}</span></span>
          </div>
          <div class="tally__bar">
            <div class="tally__yea" id="${ch.prefix}-yea-bar" style="width:${count ? count.yea/ch.total*100 : 0}%"></div>
            <div class="tally__nay" id="${ch.prefix}-nay-bar" style="width:${count ? count.nay/ch.total*100 : 0}%"></div>
            <div class="tally__other" id="${ch.prefix}-other-bar" style="width:${count ? (count.present+count.absent)/ch.total*100 : 0}%"></div>
            <div class="tally__threshold" style="left:66.7%"><span class="tally__threshold-label">2/3</span></div>
          </div>
        </div>
        ${voteDone ? `<div class="alert ${passed ? 'alert--success' : 'alert--error'}">${passed ? 'OVERRIDE PASSED' : 'OVERRIDE FAILED'}: ${count.yea} yea, ${count.nay} nay &mdash; ${threshold} of the ${count.yea + count.nay} voting needed</div>` : ''}
        ${canVote && !voteDone ? `<button class="btn btn--primary" data-action="simulate-override" data-chamber="${ch.key}" ${voteAnimating ? 'disabled' : ''}>Simulate ${ch.key === 'house' ? 'House' : 'Senate'} Override</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ========== VIEW: THE JOURNAL ========== */
const KIND_BADGES = {
  law: 'badge--purple', certification: 'badge--purple', 'readiness-cert': 'badge--blue',
  commitment: 'badge--blue', request: 'badge--slate', check: 'badge--amber', warrant: 'badge--green',
  payment: 'badge--green', adjudication: 'badge--amber', brake: 'badge--red', 'brake-release': 'badge--slate',
  requisition: 'badge--orange', credit: 'badge--orange', 'milestone-cert': 'badge--blue',
  reconciliation: 'badge--slate', discrepancy: 'badge--amber', note: 'badge--red'
};
function entrySummary(e) {
  const p = e.payload;
  switch (e.kind) {
    case 'law': return `Enacted law certified — fingerprint ${p.fingerprint} — by ${p.certifiedBy.join(' + ')}`;
    case 'certification': return p.note;
    case 'readiness-cert': return `Line ${p.lineId} certified out of shadow by ${p.certifiedBy.join(' + ')}`;
    case 'commitment': return (p.refused ? 'REFUSED commitment — ' : 'Commitment — ') + `${formatExact(p.amount)} · ${p.contractor} · ${p.description}`;
    case 'request': return `Payment request ${formatExact(p.amount)} · invoice ${p.invoiceNo} · pays down commitment #${p.commitmentRef}`;
    case 'check': return `Conformity check → ${p.outcome}` + (p.outcome === 'FLAG' ? ` ("${p.flag.term}" — ${p.flag.adjudicator}, due ${formatDateTime(p.flag.deadline)})` : '');
    case 'warrant': return `Warrant issued ${p.deemed ? 'by operation of law (silence deemed approval)' : 'automatically'} — ${formatExact(p.amount)} — not money; orders no one`;
    case 'payment': return `PAID ${formatExact(p.amount)} on Rail ${p.rail} — certified by ${p.certifiedBy.split('(')[0].trim()}`;
    case 'adjudication': return `Judgment ${p.decision.toUpperCase()}${p.deemed ? ' (deemed by silence)' : ''} — ${p.decidedBy}`;
    case 'brake': return p.renewed ? `BRAKE RENEWED — expires ${formatDateTime(p.expiresAt)}` : `BRAKE PULLED (${p.holdersSigned.length} of 4) on ${p.lineId || 'all lines'} — ${p.reasons}`;

function renderLatestCheck(state) {
  const check = [...state.journal].reverse().find(e => e.kind === 'check');
