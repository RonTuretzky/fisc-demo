function getStepperState(bill) {
  const s = bill.status;
  const steps = [
    { label: 'House Vote', state: 'pending' },
    { label: 'Senate Vote', state: 'pending' },
    { label: 'Presidential', state: 'pending' },
    { label: 'Enacted', state: 'pending' }
  ];
  const idx = ['draft','house_floor','house_voting'].includes(s) ? 0 :
    ['house_passed','house_failed','senate_floor','senate_voting'].includes(s) ? 1 :
    ['senate_passed','senate_failed','presidential_review','signed','vetoed','veto_override_house','veto_override_senate'].includes(s) ? 2 :
    s === 'enacted' ? 3 : 0;
  for (let i = 0; i < 4; i++) {
    if (i < idx) steps[i].state = 'done';
    else if (i === idx) steps[i].state = 'active';
  }
  if (s === 'enacted') steps[3].state = 'done';
  if (['house_failed','failed'].includes(s)) { steps[0].state = 'failed'; steps[1].state = 'pending'; steps[2].state = 'pending'; steps[3].state = 'pending'; }
  if (s === 'senate_failed') { steps[0].state = 'done'; steps[1].state = 'failed'; }
  return steps;
}

function renderStepper(steps) {
  return `<div class="stepper">${steps.map((st, i) => `
    ${i > 0 ? `<div class="stepper__line ${st.state === 'done' || (steps[i-1] && steps[i-1].state === 'done') ? 'stepper__line--done' : ''}"></div>` : ''}
    <div class="stepper__node">
      <div class="stepper__circle stepper__circle--${st.state}">${st.state === 'done' ? '&#10003;' : st.state === 'failed' ? '&#10007;' : (i+1)}</div>
      <div class="stepper__text stepper__text--${st.state}">${st.label}</div>
    </div>
  `).join('')}</div>`;
}

function renderVoteSection(bill, chamber, votes, status) {
  const isHouse = chamber === 'house';
  const total = isHouse ? 435 : 100;
  const label = isHouse ? 'House of Representatives' : 'United States Senate';
  const count = isHouse ? votes.houseCount : votes.senateCount;
  const cast = count ? count.yea + count.nay + count.present + count.absent : 0;
  const canVote = isHouse ?
    ['draft','house_floor','house_voting'].includes(status) :
    ['house_passed','senate_floor','senate_voting'].includes(status);
  const passed = majorityPassed(count);
  const voteDone = cast >= total;
  const needed = majorityNeeded(count);

  return `<div class="card mb-4">
    <div class="card__header"><h3>${label}</h3><span class="text-sm text-muted"><span id="${chamber}-cast">${cast}</span> / ${total} votes cast</span></div>
    <div class="card__body">
      <p class="text-xs text-muted mb-2">Passage requires a majority of Members present and voting (a quorum being present)${isHouse ? '' : ' — the Vice President breaks a tie. Most Senate business also needs 60 votes to invoke cloture; the NDFR would flip that presumption for budgetary law'}.</p>
      <div class="tally">
        <div class="tally__counts">
          <span style="color:var(--green-600)">Yea: <span id="${chamber}-yea-count">${count ? count.yea : 0}</span></span>
          <span style="color:var(--red-600)">Nay: <span id="${chamber}-nay-count">${count ? count.nay : 0}</span></span>
          <span style="color:var(--slate-500)">Other: <span id="${chamber}-other-count">${count ? count.present + count.absent : 0}</span></span>
        </div>
        <div class="tally__bar">
          <div class="tally__yea" id="${chamber}-yea-bar" style="width:${count ? count.yea/total*100 : 0}%"></div>
          <div class="tally__nay" id="${chamber}-nay-bar" style="width:${count ? count.nay/total*100 : 0}%"></div>
          <div class="tally__other" id="${chamber}-other-bar" style="width:${count ? (count.present+count.absent)/total*100 : 0}%"></div>
          <div class="tally__threshold" style="left:50%"><span class="tally__threshold-label">majority</span></div>
        </div>
      </div>
      ${voteDone ? `<div class="alert ${passed ? 'alert--success' : 'alert--error'}">${passed ? 'PASSED' : 'FAILED'}: ${count.yea} yea, ${count.nay} nay &mdash; ${needed} of the ${count.yea + count.nay} Members voting needed</div>` : ''}
      ${canVote && !voteDone ? `<button class="btn btn--primary" data-action="simulate-vote" data-chamber="${chamber}" data-bill-id="${bill.id}" ${voteAnimating ? 'disabled' : ''}>Simulate ${isHouse ? 'House' : 'Senate'} Vote</button>` : ''}
    </div>
  </div>`;
}

function renderPresidentialSection(bill, votes, status) {
  if (!['senate_passed','presidential_review','signed','vetoed','veto_override_house','veto_override_senate','enacted'].includes(status)) return '';
  return `<div class="card mb-4">
    <div class="card__header"><h3>Presidential Action</h3></div>
    <div class="card__body">
      ${votes.presidentialAction === 'signed' ? '<div class="alert alert--success"><strong>President Signed</strong> the bill into law.</div>' : ''}
      ${votes.presidentialAction === 'no_action' ? '<div class="alert alert--success"><strong>Became Law Without Signature.</strong> The President neither signed nor returned the bill within ten days while Congress was in session (Art. I, &sect; 7) — the NDFR\'s "no alternative edit proposed in ten days" branch.</div>' : ''}
      ${votes.presidentialAction === 'vetoed' ? '<div class="alert alert--error"><strong>President Vetoed</strong> the bill.</div>' : ''}
      ${!votes.presidentialAction || votes.presidentialAction === 'pending' ? `<p class="mb-4 text-sm">The bill has passed both chambers. The President may sign it, veto it, or let ten days pass — in which case it becomes law without his signature while Congress is in session (a pocket veto only if Congress has adjourned).</p>
        <div class="flex gap-2">
          <button class="btn btn--success" data-action="sign-bill" data-bill-id="${bill.id}">Sign into Law</button>
          <button class="btn btn--outline" data-action="no-action-bill" data-bill-id="${bill.id}">Let 10 Days Pass</button>
          <button class="btn btn--danger" data-action="veto-bill" data-bill-id="${bill.id}">Veto</button>
        </div>` : ''}
    </div>
  </div>`;
}

function renderOverrideSection(bill, votes, status) {
  const chambers = [
    { key: 'house', label: 'House Override Vote', total: 435, count: votes.vetoOverrideHouse, prefix: 'override-house' },
    { key: 'senate', label: 'Senate Override Vote', total: 100, count: votes.vetoOverrideSenate, prefix: 'override-senate' }
  ];
  return chambers.map(ch => {
    const count = ch.count;
    const cast = count ? count.yea + count.nay + count.present + count.absent : 0;
    const voteDone = cast >= ch.total;
    // 2/3 of Members present AND voting — 'present' votes count toward the
    // quorum but are excluded from the override denominator.
    const threshold = count && (count.yea + count.nay) > 0 ? overrideThreshold(count) : Math.ceil(ch.total * 2 / 3);
    const passed = count && overridePassed(count);
    const canVote = ch.key === 'house' ? ['vetoed','veto_override_house'].includes(status) && !votes.vetoOverrideHouse :
      ['veto_override_house','veto_override_senate'].includes(status) && votes.vetoOverrideHouse && !votes.vetoOverrideSenate;

    return `<div class="card mb-4">
      <div class="card__header"><h3>${ch.label} (2/3 of those voting)</h3><span class="text-sm text-muted"><span id="${ch.prefix}-cast">${cast}</span> / ${ch.total} votes cast</span></div>
      <div class="card__body">
        <div class="tally">
          <div class="tally__counts">
            <span style="color:var(--green-600)">Yea: <span id="${ch.prefix}-yea-count">${count ? count.yea : 0}</span></span>
            <span style="color:var(--red-600)">Nay: <span id="${ch.prefix}-nay-count">${count ? count.nay : 0}</span></span>
            <span style="color:var(--slate-500)">Other: <span id="${ch.prefix}-other-count">${count ? count.present + count.absent : 0}</span></span>
          </div>
          <div class="tally__bar">
            <div class="tally__yea" id="${ch.prefix}-yea-bar" style="width:${count ? count.yea/ch.total*100 : 0}%"></div>
            <div class="tally__nay" id="${ch.prefix}-nay-bar" style="width:${count ? count.nay/ch.total*100 : 0}%"></div>
            <div class="tally__other" id="${ch.prefix}-other-bar" style="width:${count ? (count.present+count.absent)/ch.total*100 : 0}%"></div>
            <div class="tally__threshold" style="left:66.7%"><span class="tally__threshold-label">2/3</span></div>
          </div>
        </div>
        ${voteDone ? `<div class="alert ${passed ? 'alert--success' : 'alert--error'}">${passed ? 'OVERRIDE PASSED' : 'OVERRIDE FAILED'}: ${count.yea} yea, ${count.nay} nay &mdash; ${threshold} of the ${count.yea + count.nay} voting needed</div>` : ''}
        ${canVote && !voteDone ? `<button class="btn btn--primary" data-action="simulate-override" data-chamber="${ch.key}" data-bill-id="${bill.id}" ${voteAnimating ? 'disabled' : ''}>Simulate ${ch.key === 'house' ? 'House' : 'Senate'} Override</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ========== CARD ISSUANCE VIEW (NDFR phase 2: Drawing) ========== */
// After enactment the agency cannot touch the ATM yet: it must request a
// Public Credit Card ("Purse Key"). Congress — acting through its committees
// and legislative-branch organs (GAO, CBO, Library of Congress) — negotiates
// the Card's Terms & Conditions with the agency and issues it under the ATM
// Access Protocol. This is the intra-legislative counterpart of what OMB
// apportionment does today (in the real system, post-enactment subdivision is
// OMB/agency work under 31 U.S.C. 1512-1514, not a congressional committee's).
function renderCards(state) {
  const enactedBills = state.bills.filter(b => b.status === 'enacted');
  const selLine = state.selectedLineId;
  const line = selLine ? findCreditLine(state, selLine) : null;
  const agency = line ? state.agencies.find(ag => ag.id === line.agencyId) : null;
  return `<div class="split-view">
    <div class="sidebar">
      <div class="sidebar-header"><h2>Enacted Credit Lines</h2></div>
      ${enactedBills.length === 0 ? '<div class="text-sm text-muted" style="padding:20px;">No enacted credit lines. Pass legislation in the Appropriating phase first.</div>' : ''}
      ${enactedBills.map(b => `
        <div class="refinement-tree-bill">${escHtml(b.title)}</div>
        ${b.creditLines.map(a => {
          const ag = state.agencies.find(ag => ag.id === a.agencyId);
          const card = cardForLine(state, a.id);
          return `<div class="refinement-tree-item ${selLine === a.id ? 'refinement-tree-item--selected' : ''}" data-action="select-line-card" data-line-id="${a.id}">
            <span class="color-dot" style="background:${a.color};margin-right:6px;"></span>
            ${ag ? ag.abbreviation : a.agencyId} — ${formatCurrency(a.amountCap)}
            ${card ? '<span class="badge badge--green" style="margin-left:6px;">Card issued</span>' : '<span class="badge badge--amber" style="margin-left:6px;">No card</span>'}
          </div>`;
        }).join('')}
      `).join('')}
    </div>
    <div class="content">
      ${line && line.billStatus === 'enacted' ? renderCardPanel(line, agency, state) : '<div class="empty-state"><p>Select an enacted credit line to issue its Public Credit Card</p></div>'}
    </div>
  </div>`;
}

function renderCardPanel(line, agency, state) {
  const card = cardForLine(state, line.id);
  const fs = formState.card;
  return `<div class="content-inner">
    <h2 style="font-size:18px;font-weight:700;margin-bottom:4px;">Public Credit Card Issuance</h2>
    <p class="text-sm text-muted mb-4">The Card is the "Purse Key": it encodes the Terms &amp; Conditions under which ${agency ? escHtml(agency.abbreviation) : 'the agency'} may withdraw new eCoins from Congress's Treasury ATM against this credit line. Issuance is administered by congressional committees and legislative-branch organs under the ATM Access Protocol, with Budget Key signatures.</p>
    <div class="card mb-4">
      <div class="card__header"><h3>Public Credit Line (from the Fiscal Record)</h3></div>
      <div class="card__body">
        <div class="flex justify-between mb-2"><span><span class="color-dot" style="background:${line.color};margin-right:6px;"></span><strong>${agency ? agency.name : line.agencyId}</strong></span><strong>${formatCurrency(line.amountCap)}</strong></div>
        <p class="text-sm text-muted mb-2">Available through: ${formatDate(line.timeLimit)} &middot; ${escHtml(line.billTitle || '')}</p>
        <div class="section-title" style="margin-top:12px;">Statutory Categories</div>
        <div class="flex flex-wrap gap-1">${line.categories.map(c => `<span class="badge badge--slate">${escHtml(c.label)}: ${formatCurrency(c.quantitativeCap)}</span>`).join('')}</div>
        ${line.restrictions.length ? `<div class="section-title" style="margin-top:12px;">Statutory Restrictions</div><ul class="text-sm text-muted" style="margin-left:16px;list-style:disc;">${line.restrictions.map(r => `<li>${escHtml(r)}</li>`).join('')}</ul>` : ''}
      </div>
    </div>
    ${card ? `<div class="alert alert--success mb-4"><strong>Card Active.</strong> Issued via ${escHtml(card.committeeName)} — ${card.termsAndConditions.length} Terms &amp; Conditions subcategories, ${card.signatories.length} Budget Key signatures. ${agency ? escHtml(agency.abbreviation) : 'The agency'} can now draw eCoins at the Treasury ATM.</div>` : `
    <div class="card">
      <div class="card__header"><h3>Negotiate Terms &amp; Conditions</h3><button class="btn btn--outline btn--sm" data-action="add-subcategory">+ Add Subcategory</button></div>
      <div class="card__body">
        <div class="form-group"><label class="form-label">Issuing Body</label><input class="form-input" id="card-committee" placeholder="e.g. Joint Committee on the Fiscal Record (with GAO/CBO support)" value="${escHtml(fs.committeeName)}"></div>
        <div class="section-title">Terms &amp; Conditions Subcategories</div>
        ${fs.subcategories.length === 0 ? '<p class="text-sm text-muted mb-4">Add subcategories to compile the statutory credit line into executable spending terms. These bind the agency at spend time.</p>' : ''}
        ${fs.subcategories.map((sc, i) => `<div class="card mb-2" style="padding:10px;background:var(--slate-50);">
          <div class="form-row">
            <div class="form-group"><label class="form-label">Label</label><input class="form-input subcat-label" data-idx="${i}" value="${escHtml(sc.label)}"></div>
            <div class="form-group"><label class="form-label">Cap ($)</label><input class="form-input subcat-cap" data-idx="${i}" type="number" value="${sc.quantitativeCap || ''}"></div>
            <div style="padding-top:20px;"><button class="btn btn--danger btn--xs" data-action="remove-subcategory" data-idx="${i}">Remove</button></div>
          </div>
          <div class="form-group"><label class="form-label">Qualitative Rules (one per line)</label><textarea class="form-textarea subcat-rules" data-idx="${i}" rows="2">${escHtml((sc.qualitativeRules || []).join('\n'))}</textarea></div>
        </div>`).join('')}
        <div class="section-title mt-4">Issuance Signatures</div>
        <p class="text-xs text-muted mb-2">The Card is issued and administered by Congress: legislative signatories sign with their <strong>Budget Keys</strong>. The receiving agency countersigns only to accept the negotiated Terms &amp; Conditions — it has no issuing authority.</p>
        <div class="form-group"><label class="form-label">Required Signatures</label><input class="form-input" id="card-req-sigs" type="number" min="1" value="${fs.requiredSigs}" style="width:80px;"></div>
        <div class="form-inline mb-2"><input class="form-input" id="card-new-sig" placeholder="Signatory name..."><button class="btn btn--outline btn--sm" data-action="add-signatory">Add</button></div>
        ${fs.signatories.map((sig, i) => `<div class="sig-check"><input type="checkbox" checked disabled> <span>${escHtml(sig)}</span> <button class="btn btn--danger btn--xs" data-action="remove-signatory" data-idx="${i}">&times;</button></div>`).join('')}
        ${fs.complianceResult ? `<div class="alert ${fs.complianceResult.passed ? 'alert--success' : 'alert--error'} mt-4">
          <strong>ATM Access Protocol Check: ${fs.complianceResult.passed ? 'PASSED' : 'FAILED'}</strong>
          ${fs.complianceResult.violations.length ? `<ul>${fs.complianceResult.violations.map(v => `<li>${escHtml(v)}</li>`).join('')}</ul>` : ''}
          <div class="text-xs mt-2 text-muted">Checked: ${fs.complianceResult.checkedAgainst.join(', ')}</div>
        </div>` : ''}
        <div class="flex gap-2 mt-4">
          <button class="btn btn--outline" data-action="run-compliance" data-line-id="${line.id}">Run Protocol Check</button>
          <button class="btn btn--primary" data-action="issue-card" data-line-id="${line.id}" ${!fs.complianceResult || !fs.complianceResult.passed || fs.signatories.length < fs.requiredSigs ? 'disabled' : ''}>Issue Public Credit Card</button>
        </div>
      </div>
    </div>`}
  </div>`;
}

/* ========== AGENCY VIEW (NDFR phases 3-4: Coining & Spending) ========== */
function renderAgency(state) {
  const withCredit = state.agencies.filter(a => agencyCreditLines(state, a.id).length > 0);
  const selected = withCredit.find(a => a.id === state.selectedAgencyId) || (withCredit.length === 1 ? withCredit[0] : null);
  return `<div class="split-view">
    <div class="sidebar">
      <div class="sidebar-header"><h2>Agencies with Public Credit</h2></div>
      ${withCredit.length === 0 ? '<div class="text-sm text-muted" style="padding:20px;">No agency holds Public Credit yet. Enact legislation in the Appropriating phase first.</div>' : ''}
      ${withCredit.map(a => {
        const lines = agencyCreditLines(state, a.id);
        const cap = lines.reduce((s, l) => s + (l.amountCap || 0), 0);
        const drawn = lines.reduce((s, l) => s + drawnOnLine(l.id, state.transactions), 0);
        const balance = ePurseBalance(a.id, state.transactions);
        const pct = cap > 0 ? (drawn / cap * 100).toFixed(1) : 0;
        return `<div class="sidebar-item ${a.id === (selected?.id) ? 'sidebar-item--selected' : ''}" data-action="select-agency" data-agency-id="${a.id}">
          <div class="sidebar-item__title">${a.abbreviation} — ${a.name}</div>
          <div class="sidebar-item__meta mb-2"><span>${formatCurrency(cap)} credit &middot; ePurse ${formatCurrency(balance)}</span></div>
          <div class="progress"><div class="progress__fill" style="width:${pct}%;background:${pct > 80 ? 'var(--red-500)' : pct > 50 ? 'var(--amber-500)' : 'var(--green-500)'}"></div></div>
          <div class="text-xs text-muted mt-2">${formatCurrency(drawn)} drawn (${pct}% of credit)</div>
        </div>`;
      }).join('')}
    </div>
    <div class="content">
      ${selected ? renderAgencyDashboard(selected, state) : '<div class="empty-state"><p>Select an agency to open its ePurse and ATM terminal</p></div>'}
    </div>
  </div>`;
}

function renderAgencyDashboard(agency, state) {
  const txs = state.transactions.filter(t => t.agencyId === agency.id);
  const lines = agencyCreditLines(state, agency.id);
  const totalCap = lines.reduce((s, l) => s + (l.amountCap || 0), 0);
  const totalDrawn = lines.reduce((s, l) => s + drawnOnLine(l.id, state.transactions), 0);
  const totalOutlaid = txs.filter(t => t.type === 'spend' && t.status === 'approved' && t.outlaid).reduce((s, t) => s + t.amount, 0);
  const unpaid = unpaidObligations(agency.id, state.transactions);
  const balance = ePurseBalance(agency.id, state.transactions);
  const fsD = formState.draw;
  const fsS = formState.spend;
  const spendLine = lines.find(l => l.id === fsS.lineId);
  const spendCard = spendLine ? cardForLine(state, spendLine.id) : null;
  const spendCats = spendCard && spendCard.termsAndConditions.length ? spendCard.termsAndConditions : (spendLine ? spendLine.categories : []);

  return `<div class="content-inner">
    <h2 style="font-size:18px;font-weight:700;margin-bottom:4px;">${agency.name}</h2>
    <p class="text-sm text-muted mb-4">${agency.abbreviation} &middot; locally hosted ePurse node on the Federated Federal Ledger</p>
    <div class="card mb-4">
      <div class="card__header"><h3>ePurse (hardware wallet)</h3></div>
      <div class="card__body">
        <div class="flex justify-between text-sm mb-2"><span>eCoins held: <strong style="font-size:16px;">${formatCurrency(balance)}</strong></span><span class="text-muted">drawn ${formatCurrency(totalDrawn)} &middot; obligated (unpaid) ${formatCurrency(unpaid)} &middot; outlaid ${formatCurrency(totalOutlaid)}</span></div>
        <p class="text-xs text-muted">Two separate controls: <strong>obligations</strong> are capped by the credit line — budget authority (31 U.S.C. 1341 analogue) — while <strong>payments</strong> require eCoins held here. eCoins are created <em>de novo</em> at the ATM when drawn.</p>
      </div>
    </div>
    ${lines.length > 0 ? `<div class="card mb-4"><div class="card__header"><h3>Public Credit Lines</h3><span class="text-sm text-muted">${formatCurrency(totalCap)} total credit</span></div><div class="card__body">
      ${lines.map(a => {
        const card = cardForLine(state, a.id);
        const lineDrawn = drawnOnLine(a.id, state.transactions);
        const drawnPct = a.amountCap > 0 ? (lineDrawn / a.amountCap * 100).toFixed(1) : 0;
        const cats = card && card.termsAndConditions.length ? card.termsAndConditions : a.categories;
        return `<div class="auth-card mb-2" style="border-left-color:${a.color}">
          <div class="auth-card__header"><span class="auth-card__title"><span class="color-dot" style="background:${a.color};margin-right:6px;"></span>${formatCurrency(a.amountCap)} credit line &middot; ${escHtml(a.billTitle || '')}</span>
          <span class="text-sm">${card ? '<span class="badge badge--green">Card active</span>' : '<span class="badge badge--amber">No card — cannot draw</span>'}${a.frozen ? ' <span class="badge badge--red">FROZEN</span>' : ''}</span></div>
          <div class="progress mb-2"><div class="progress__fill" style="width:${drawnPct}%;background:${a.color}"></div></div>
          <div class="text-xs text-muted mb-2">${formatCurrency(lineDrawn)} drawn &middot; ${formatCurrency(a.amountCap - lineDrawn)} undrawn credit</div>
          <div class="auth-card__categories">${cats.map(c => {
            const catSpent = txs.filter(t => t.type === 'spend' && t.creditLineId === a.id && t.category === c.label && t.status === 'approved').reduce((s, t) => s + t.amount, 0);
            return `<span class="badge badge--slate">${escHtml(c.label)}: ${formatCurrency(catSpent)}/${formatCurrency(c.quantitativeCap)}</span>`;
          }).join('')}</div>
        </div>`;
      }).join('')}
    </div></div>` : ''}
    <div class="card mb-4">
      <div class="card__header"><h3>Congress's Treasury ATM — Draw eCoins (Coining)</h3></div>
      <div class="card__body">
        <div class="form-row">
          <div class="form-group"><label class="form-label">Credit Line</label>
            <select class="form-select" id="draw-line">${lines.length === 0 ? '<option>No credit lines</option>' : `<option value="">Select...</option>${lines.map(a => `<option value="${a.id}" ${fsD.lineId === a.id ? 'selected' : ''}>${formatCurrency(a.amountCap)} — ${escHtml(a.billTitle || a.id)}</option>`).join('')}`}</select>
          </div>
          <div class="form-group"><label class="form-label">Amount ($)</label><input class="form-input" id="draw-amount" type="number" placeholder="e.g. 1000000000" value="${fsD.amount}"></div>
        </div>
        <div class="form-group"><label class="form-label">Memo</label><input class="form-input" id="draw-desc" placeholder="Purpose of this draw..." value="${escHtml(fsD.description)}"></div>
        <button class="btn btn--success" data-action="submit-draw" data-agency-id="${agency.id}">Withdraw eCoins</button>
      </div>
    </div>
    <div class="card mb-4">
      <div class="card__header"><h3>Obligate Funds (Spending)</h3></div>
      <div class="card__body">
        <p class="text-xs text-muted mb-2">Submitting creates an <strong>obligation</strong> (contract award, grant, hire) checked against budget authority, purpose, and subcategory caps. Pay it afterwards from the ledger below — payment needs eCoins on the ePurse.</p>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Credit Line</label>
            <select class="form-select" id="spend-line">${lines.length === 0 ? '<option>No credit lines</option>' : `<option value="">Select...</option>${lines.map(a => `<option value="${a.id}" ${fsS.lineId === a.id ? 'selected' : ''}>${formatCurrency(a.amountCap)} — ${escHtml(a.billTitle || a.id)}</option>`).join('')}`}</select>
          </div>
          <div class="form-group"><label class="form-label">Purpose (Card T&amp;C category)</label>
            <select class="form-select" id="spend-category">${!spendLine ? '<option value="">Select credit line first</option>' : spendCats.map(c => `<option value="${escHtml(c.label)}" ${fsS.category === c.label ? 'selected' : ''}>${escHtml(c.label)}</option>`).join('')}</select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Amount ($)</label><input class="form-input" id="spend-amount" type="number" placeholder="e.g. 50000000" value="${fsS.amount}"></div>
          <div class="form-group"><label class="form-label">Description</label><input class="form-input" id="spend-desc" placeholder="What is this spending for?" value="${escHtml(fsS.description)}"></div>
        </div>
        <button class="btn btn--primary" data-action="submit-spend" data-agency-id="${agency.id}">Submit Obligation</button>
      </div>
    </div>
    ${renderTransactionLog(txs)}
  </div>`;
}

function txTypeBadge(tx) {
  const t = typeof tx === 'string' ? tx : tx.type;
  if (t === 'draw') return '<span class="badge badge--blue">ATM draw</span>';
  if (t === 'spend') {
    if (typeof tx === 'object' && tx.status === 'approved' && !tx.outlaid) return '<span class="badge badge--amber">obligation</span>';
    return '<span class="badge badge--purple">outlay</span>';
  }
  if (t === 'collect') return '<span class="badge badge--slate">collection</span>';
  return `<span class="badge badge--slate">${t}</span>`;
}

function renderTransactionLog(txs) {
  if (txs.length === 0) return '<div class="card"><div class="card__body text-sm text-muted">No ledger entries yet.</div></div>';
  const sorted = [...txs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  return `<div class="card card--flush">
    <div class="card__header"><h3>Ledger Node (Publishing)</h3><span class="text-sm text-muted">synced to the Public Statement and Account</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Timestamp</th><th>Type</th><th>Category</th><th>Amount</th><th>Status</th><th>Description</th></tr></thead>
      <tbody>
        ${sorted.map(tx => {
          const statusBadge = tx.status === 'approved' ? 'badge--green' : tx.status === 'rejected' ? 'badge--red' : tx.status === 'flagged' ? 'badge--orange' : 'badge--amber';
          const isExpanded = formState.expandedTxId === tx.id;
          const payable = tx.type === 'spend' && tx.status === 'approved' && !tx.outlaid;
          return `<tr style="cursor:pointer;" data-action="toggle-tx" data-tx-id="${tx.id}">
            <td class="text-sm">${formatDate(tx.timestamp)}</td>
            <td>${txTypeBadge(tx)}</td>
            <td>${tx.category ? `<span class="badge badge--slate">${escHtml(tx.category)}</span>` : '<span class="text-muted">—</span>'}</td>
            <td class="text-right"><strong>${formatCurrency(tx.amount)}</strong></td>
            <td><span class="badge ${statusBadge}">${tx.status}</span>${payable ? ` <button class="btn btn--success btn--xs" data-action="pay-obligation" data-tx-id="${tx.id}">Pay</button>` : ''}</td>
            <td class="text-sm">${escHtml(tx.description)}${tx.payError ? `<div class="text-xs" style="color:var(--red-600);margin-top:2px;">${escHtml(tx.payError)}</div>` : ''}</td>
          </tr>
          ${isExpanded && tx.complianceCheck ? `<tr class="expanded-row"><td colspan="6"><div class="compliance-detail">
            <strong>Compliance: ${tx.complianceCheck.passed ? 'PASSED' : 'FAILED'}</strong>
            ${tx.complianceCheck.violations.length ? `<ul>${tx.complianceCheck.violations.map(v => `<li style="color:var(--red-600)">${escHtml(v)}</li>`).join('')}</ul>` : ''}
            <div class="text-xs text-muted mt-2">Checked: ${tx.complianceCheck.checkedAgainst.join(', ')}</div>
          </div></td></tr>` : ''}`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

/* ========== FISCAL RECORD VIEW (NDFR phase 5: Publishing) ========== */
// Congress's "Public Statement and Account" super-node: government-wide
// aggregates of funds appropriated, drawn, held, spent, and collected —
// the constitutional Statement and Account (Art. I, § 9, cl. 7) rendered as
// a live dashboard, plus the financing handbrake ("the parliamentary finger
// on the button") that replaces the debt ceiling.
function renderRecord(state) {
  const agg = fiscAggregates(state);
  const lines = enactedCreditLines(state);
  const fsC = formState.collection;
  const recent = [...state.transactions].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 12);
  const stats = [
    { label: 'Appropriated (credit lines)', value: agg.appropriated, hint: 'spending power delegated on the Fiscal Record' },
    { label: 'Drawn (eCoins created)', value: agg.drawn, hint: 'new digital dollars issued at the Treasury ATM' },
    { label: 'Held on ePurses', value: agg.held, hint: 'drawn but not yet paid out' },
    { label: 'Obligated (unpaid)', value: agg.unpaidObligations, hint: 'committed against budget authority, payment due' },
    { label: 'Outlaid (paid into circulation)', value: agg.outlaid, hint: 'eCoins paid out by agencies' },
    { label: 'Collected (deleted)', value: agg.collected, hint: 'taxes & receipts redeem/delete eCoins' },
    { label: 'Outstanding eCoins', value: agg.outstanding, hint: 'drawn minus collected — no bond issuance required' }
  ];
  return `<div class="content" style="height:calc(100vh - 56px);overflow-y:auto;"><div class="content-inner">
    <h2 style="font-size:18px;font-weight:700;margin-bottom:4px;">Congressional Fiscal Record — Public Statement and Account</h2>
    <p class="text-sm text-muted mb-4">Agency ledger nodes sync automatically to this congressionally managed super-node. Deficits are money-financed by design: draws create eCoins, collections delete them, and no Treasury debt issuance intermediates spending.</p>
    <div class="stat-grid mb-4">
      ${stats.map(s => `<div class="card" style="margin-bottom:0;"><div class="text-xs text-muted">${s.label}</div><div style="font-size:20px;font-weight:700;margin:4px 0;">${formatCurrency(s.value)}</div><div class="text-xs text-muted">${s.hint}</div></div>`).join('')}
    </div>
    ${state.atmFrozen ? '<div class="alert alert--error"><strong>ATM FROZEN GOVERNMENT-WIDE.</strong> A Joint Resolution has suspended all new eCoin draws at the Treasury ATM hardware layer. eCoins already on agency ePurses remain spendable.</div>' : ''}
    <div class="card card--flush mb-4">
      <div class="card__header"><h3>Credit Lines &amp; Financing Handbrake</h3>
        <span class="flex items-center gap-2"><span class="text-sm text-muted">freeze = Joint Resolution suspending new draws</span>
        ${state.atmFrozen ? '<button class="btn btn--outline btn--xs" data-action="unfreeze-atm">Lift ATM-wide freeze (JRes)</button>' : '<button class="btn btn--danger btn--xs" data-action="freeze-atm">Freeze ATM government-wide (JRes)</button>'}</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Agency</th><th>Bill</th><th>Cap</th><th>Drawn</th><th>Card</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${lines.length === 0 ? '<tr><td colspan="7" class="text-sm text-muted">No enacted credit lines yet.</td></tr>' : lines.map(l => {
          const ag = state.agencies.find(a => a.id === l.agencyId);
          const card = cardForLine(state, l.id);
          const drawn = drawnOnLine(l.id, state.transactions);
          return `<tr>
            <td><span class="color-dot" style="background:${l.color};margin-right:6px;"></span>${ag ? ag.abbreviation : l.agencyId}</td>
            <td class="text-sm">${escHtml(l.billTitle || '')}</td>
            <td class="text-right">${formatCurrency(l.amountCap)}</td>
            <td class="text-right">${formatCurrency(drawn)}</td>
            <td>${card ? '<span class="badge badge--green">active</span>' : '<span class="badge badge--amber">none</span>'}</td>
            <td>${l.frozen ? '<span class="badge badge--red">FROZEN</span>' : '<span class="badge badge--green">open</span>'}</td>
            <td>${l.frozen ? `<button class="btn btn--outline btn--xs" data-action="unfreeze-line" data-line-id="${l.id}">Lift freeze (JRes)</button>` : `<button class="btn btn--danger btn--xs" data-action="freeze-line" data-line-id="${l.id}">Freeze (JRes)</button>`}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>
    </div>
    <div class="card mb-4">
      <div class="card__header"><h3>Record Collections (taxes &amp; receipts)</h3></div>
      <div class="card__body">
        <p class="text-xs text-muted mb-2">Under the NDFR, taxes do not "fund" spending: dollars redeemed through taxes and other public dues are <em>deleted</em>, shrinking outstanding eCoins.</p>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Amount ($)</label><input class="form-input" id="collect-amount" type="number" placeholder="e.g. 300000000" value="${fsC.amount}"></div>
          <div class="form-group"><label class="form-label">Description</label><input class="form-input" id="collect-desc" placeholder="e.g. Q3 corporate income tax receipts" value="${escHtml(fsC.description)}"></div>
        </div>
        <button class="btn btn--outline" data-action="submit-collection">Record Collection</button>
      </div>
    </div>
    <div class="card card--flush">
      <div class="card__header"><h3>Recent Ledger Activity (all nodes)</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Timestamp</th><th>Node</th><th>Type</th><th>Amount</th><th>Status</th><th>Description</th></tr></thead>
        <tbody>
        ${recent.length === 0 ? '<tr><td colspan="6" class="text-sm text-muted">No activity yet.</td></tr>' : recent.map(tx => {
          const ag = state.agencies.find(a => a.id === tx.agencyId);
          const statusBadge = tx.status === 'approved' ? 'badge--green' : 'badge--red';
          return `<tr>
            <td class="text-sm">${formatDate(tx.timestamp)}</td>
            <td class="text-sm">${ag ? ag.abbreviation : 'Fiscal Record'}</td>
            <td>${txTypeBadge(tx)}</td>
            <td class="text-right"><strong>${formatCurrency(tx.amount)}</strong></td>
            <td><span class="badge ${statusBadge}">${tx.status}</span></td>
            <td class="text-sm">${escHtml(tx.description)}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>
    </div>
  </div></div>`;
}

/* ========== EVENT HANDLING ========== */
function mountHandlers(state) {
  document.getElementById('app').onclick = function(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    handleAction(action, target.dataset, state);
  };
  // Capture changes for form inputs
  document.getElementById('app').onchange = function(e) {
    const t = e.target;
    if (t.id === 'draw-line') formState.draw.lineId = t.value;
    if (t.id === 'spend-line') { formState.spend.lineId = t.value; formState.spend.category = ''; render(); }
    if (t.id === 'spend-category') formState.spend.category = t.value;
    if (t.id === 'new-line-agency') formState.newLine.agencyId = t.value;
  };
  document.getElementById('app').oninput = function(e) {
    const t = e.target;
    if (t.id === 'new-bill-title') formState.newBill.title = t.value;
    if (t.id === 'new-bill-sponsor') formState.newBill.sponsor = t.value;
    if (t.id === 'new-line-amount') formState.newLine.amountCap = t.value;
    if (t.id === 'new-line-time') formState.newLine.timeLimit = t.value;
    if (t.id === 'new-line-restrictions') formState.newLine.restrictions = t.value;
    if (t.id === 'amend-author') formState.newAmendment.author = t.value;
    if (t.id === 'amend-desc') formState.newAmendment.description = t.value;
    if (t.id === 'amend-old') formState.newAmendment.oldText = t.value;
    if (t.id === 'amend-new') formState.newAmendment.newText = t.value;
    if (t.id === 'amend-line') formState.newAmendment.lineNumber = parseInt(t.value) || 0;
    if (t.id === 'draw-amount') formState.draw.amount = t.value;
    if (t.id === 'draw-desc') formState.draw.description = t.value;
    if (t.id === 'spend-amount') formState.spend.amount = t.value;
    if (t.id === 'spend-desc') formState.spend.description = t.value;
    if (t.id === 'collect-amount') formState.collection.amount = t.value;
    if (t.id === 'collect-desc') formState.collection.description = t.value;
    if (t.id === 'card-committee') formState.card.committeeName = t.value;
    if (t.id === 'card-req-sigs') formState.card.requiredSigs = parseInt(t.value) || 1;
    if (t.classList.contains('subcat-label')) { formState.card.subcategories[t.dataset.idx].label = t.value; }
    if (t.classList.contains('subcat-cap')) { formState.card.subcategories[t.dataset.idx].quantitativeCap = parseFloat(t.value) || 0; }
    if (t.classList.contains('subcat-rules')) { formState.card.subcategories[t.dataset.idx].qualitativeRules = t.value.split('\n').filter(Boolean); }
  };
}

function handleAction(action, data, state) {
  switch (action) {
    case 'set-view':
      Store.dispatch({ type: 'SET_VIEW', payload: data.view });
      break;
    case 'select-bill':
      Store.dispatch({ type: 'SELECT_BILL', payload: data.billId });
      break;
    case 'select-agency':
      Store.dispatch({ type: 'SELECT_AGENCY', payload: data.agencyId });
      break;
    case 'toggle-new-bill':
      formState.newBill.visible = !formState.newBill.visible;
      render();
      break;
    case 'create-bill': {
      if (!formState.newBill.title.trim()) return;
      const bill = {
        id: 'bill-' + uid(), title: formState.newBill.title.trim(), status: 'draft',
        sponsor: formState.newBill.sponsor.trim() || 'Unknown', introducedDate: new Date().toISOString().slice(0, 10),
        text: '', creditLines: [], amendments: [],
        votes: { billId: '', houseVotes: [], senateVotes: [], houseCount: {yea:0,nay:0,present:0,absent:0}, senateCount: {yea:0,nay:0,present:0,absent:0}, presidentialAction: null, vetoOverrideHouse: null, vetoOverrideSenate: null }
      };
      bill.votes.billId = bill.id;
      formState.newBill = { title: '', sponsor: '', visible: false };
      Store.dispatch({ type: 'ADD_BILL', payload: bill });
      break;
    }
    case 'set-tab':
      formState.activeTab = data.tab;
      render();
      break;
    case 'toggle-new-line':
      formState.newLine.visible = !formState.newLine.visible;
      render();
      break;
    case 'set-line-color':
      formState.newLine.color = data.color;
      render();
      break;
    case 'create-line': {
      if (!formState.newLine.agencyId || !formState.newLine.amountCap) return;
      const line = {
        id: 'auth-' + uid(), billId: state.selectedBillId, agencyId: formState.newLine.agencyId,
        frozen: false, amountCap: parseFloat(formState.newLine.amountCap), timeLimit: formState.newLine.timeLimit || null,
        restrictions: formState.newLine.restrictions.split('\n').filter(Boolean),
        categories: [], color: formState.newLine.color
      };
      formState.newLine = { agencyId: '', amountCap: '', timeLimit: '', restrictions: '', color: '#2563eb', visible: false };
      Store.dispatch({ type: 'ADD_CREDIT_LINE', payload: { billId: state.selectedBillId, creditLine: line } });
      break;
    }
    case 'toggle-new-amendment':
      formState.newAmendment.visible = !formState.newAmendment.visible;
      render();
      break;
    case 'create-amendment': {
      const amend = {
        id: 'amend-' + uid(), billId: data.billId, author: formState.newAmendment.author || 'Anonymous',
        timestamp: new Date().toISOString(), description: formState.newAmendment.description,
        changes: [{ lineNumber: formState.newAmendment.lineNumber, oldText: formState.newAmendment.oldText, newText: formState.newAmendment.newText }],
        status: 'proposed'
      };
      formState.newAmendment = { author: '', description: '', oldText: '', newText: '', lineNumber: 0, visible: false };
      Store.dispatch({ type: 'ADD_AMENDMENT', payload: { billId: data.billId, amendment: amend } });
      break;
    }
    case 'adopt-amendment':
      Store.dispatch({ type: 'UPDATE_AMENDMENT_STATUS', payload: { billId: data.billId, amendmentId: data.amendmentId, status: 'adopted' } });
      break;
    case 'reject-amendment':
      Store.dispatch({ type: 'UPDATE_AMENDMENT_STATUS', payload: { billId: data.billId, amendmentId: data.amendmentId, status: 'rejected' } });
      break;
    case 'simulate-vote':
      Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId: data.billId, status: data.chamber === 'house' ? 'house_voting' : 'senate_voting' } });
      setTimeout(() => startVoteAnimation(data.chamber, data.billId, false), 50);
      break;
    case 'simulate-override':
      if (!Store.getState().bills.find(b => b.id === data.billId).votes.vetoOverrideHouse && data.chamber === 'house') {
        Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId: data.billId, status: 'veto_override_house' } });
      } else if (data.chamber === 'senate') {
        Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId: data.billId, status: 'veto_override_senate' } });
      }
      setTimeout(() => startVoteAnimation(data.chamber, data.billId, true), 50);
      break;
    case 'sign-bill':
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { billId: data.billId, votes: { presidentialAction: 'signed' } } });
      Store.dispatch({ type: 'ENACT_BILL', payload: { billId: data.billId } });
      break;
    case 'veto-bill':
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { billId: data.billId, votes: { presidentialAction: 'vetoed' } } });
      Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId: data.billId, status: 'vetoed' } });
      break;
    case 'select-line-card':
      formState.card = { subcategories: [], committeeName: '', requiredSigs: 1, signatories: [], complianceResult: null, visible: false };
      Store.dispatch({ type: 'SELECT_LINE', payload: data.lineId });
      break;
    case 'add-subcategory':
      formState.card.subcategories.push({ id: 'sc-' + uid(), label: '', parentCategory: null, quantitativeCap: 0, qualitativeRules: [] });
      render();
      break;
    case 'remove-subcategory':
      formState.card.subcategories.splice(parseInt(data.idx), 1);
      render();
      break;
    case 'add-signatory': {
      const sigInput = document.getElementById('card-new-sig');
      if (sigInput && sigInput.value.trim()) {
        formState.card.signatories.push(sigInput.value.trim());
        render();
      }
      break;
    }
    case 'remove-signatory':
      formState.card.signatories.splice(parseInt(data.idx), 1);
      render();
      break;
    case 'run-compliance': {
      const st = Store.getState();
      const line = findCreditLine(st, data.lineId);
      if (line) {
        formState.card.complianceResult = checkCardTermsCompliance(formState.card.subcategories, line);
      }
      render();
      break;
    }
    case 'issue-card': {
      const card = {
        id: 'card-' + uid(), creditLineId: data.lineId, agencyId: (findCreditLine(Store.getState(), data.lineId) || {}).agencyId,
        committeeName: formState.card.committeeName || 'Unnamed Issuing Body',
        termsAndConditions: JSON.parse(JSON.stringify(formState.card.subcategories)),
        signatories: [...formState.card.signatories],
        requiredSignatures: formState.card.requiredSigs,
        issuedDate: new Date().toISOString(),
        status: 'active'
      };
      formState.card = { subcategories: [], committeeName: '', requiredSigs: 1, signatories: [], complianceResult: null, visible: false };
      Store.dispatch({ type: 'ISSUE_CARD', payload: card });
      break;
    }
    case 'submit-draw': {
      const st = Store.getState();
      const lineId = formState.draw.lineId;
      const line = findCreditLine(st, lineId);
      if (!line || !formState.draw.amount) return;
      const tx = {
        id: 'tx-' + uid(), type: 'draw', agencyId: data.agencyId, creditLineId: lineId,
        amount: parseFloat(formState.draw.amount), category: null,
        description: formState.draw.description || 'eCoin draw at the Treasury ATM', timestamp: new Date().toISOString(),
        status: 'pending', complianceCheck: { passed: true, violations: [], checkedAgainst: [] }
      };
      const card = cardForLine(st, lineId);
      const compliance = checkDrawCompliance(tx, line, card, st.transactions, st.atmFrozen);
      tx.complianceCheck = compliance;
      tx.status = compliance.passed ? 'approved' : 'rejected';
      formState.draw = { lineId: '', amount: '', description: '' };
      Store.dispatch({ type: 'ADD_TRANSACTION', payload: tx });
      break;
    }
    case 'submit-spend': {
      const st = Store.getState();
      const lineId = formState.spend.lineId;
      const line = findCreditLine(st, lineId);
      if (!line || !formState.spend.amount || !formState.spend.category) return;
      const tx = {
        id: 'tx-' + uid(), type: 'spend', agencyId: data.agencyId, creditLineId: lineId,
        amount: parseFloat(formState.spend.amount), category: formState.spend.category,
        description: formState.spend.description || '', timestamp: new Date().toISOString(),
        outlaid: false, payError: null,
        status: 'pending', complianceCheck: { passed: true, violations: [], checkedAgainst: [] }
      };
      const card = cardForLine(st, lineId);
      const compliance = checkSpendCompliance(tx, line, card, data.agencyId, st.transactions);
      tx.complianceCheck = compliance;
      tx.status = compliance.passed ? 'approved' : 'rejected';
      formState.spend = { lineId: '', category: '', amount: '', description: '' };
      Store.dispatch({ type: 'ADD_TRANSACTION', payload: tx });
      break;
    }
    case 'submit-collection': {
      if (!formState.collection.amount) return;
      const st = Store.getState();
      const agg = fiscAggregates(st);
      const amount = parseFloat(formState.collection.amount);
      // Collections redeem circulating eCoins; you cannot delete more than
      // exist. (The Miscellaneous Receipts analogue: receipts flow to the
      // Record, not into any agency's ePurse — cf. 31 U.S.C. 3302(b).)
      const ok = amount <= agg.outstanding;
      const tx = {
        id: 'tx-' + uid(), type: 'collect', agencyId: null, creditLineId: null,
        amount, category: null,
        description: formState.collection.description || 'Tax & receipt collections (eCoins deleted)',
        timestamp: new Date().toISOString(), status: ok ? 'approved' : 'rejected',
        complianceCheck: ok
          ? { passed: true, violations: [], checkedAgainst: ['Receipts deposited to the Record, not to any ePurse (Miscellaneous Receipts analogue, 31 U.S.C. 3302(b))', 'Redeemed eCoins deleted from outstanding'] }
          : { passed: false, violations: [`Cannot delete ${formatCurrency(amount)}: only ${formatCurrency(agg.outstanding)} in eCoins are outstanding.`], checkedAgainst: ['Outstanding eCoins check'] }
      };
      formState.collection = { amount: '', description: '' };
      Store.dispatch({ type: 'ADD_TRANSACTION', payload: tx });
      break;
    }
    case 'pay-obligation':
      Store.dispatch({ type: 'MARK_OUTLAID', payload: { txId: data.txId } });
      break;
    case 'freeze-line':
      Store.dispatch({ type: 'SET_LINE_FROZEN', payload: { lineId: data.lineId, frozen: true } });
      break;
    case 'unfreeze-line':
      Store.dispatch({ type: 'SET_LINE_FROZEN', payload: { lineId: data.lineId, frozen: false } });
      break;
    case 'freeze-atm':
      Store.dispatch({ type: 'SET_ATM_FROZEN', payload: true });
      break;
    case 'unfreeze-atm':
      Store.dispatch({ type: 'SET_ATM_FROZEN', payload: false });
      break;
    case 'no-action-bill':
      // Art. I, § 7: if the President neither signs nor returns the bill
      // within ten days (Sundays excepted) while Congress is in session, it
      // becomes law without his signature — the NDFR's 'failure to propose
      // an alternative edit in ten days' branch.
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { billId: data.billId, votes: { presidentialAction: 'no_action' } } });
      Store.dispatch({ type: 'ENACT_BILL', payload: { billId: data.billId } });
      break;
    case 'toggle-tx':
      formState.expandedTxId = formState.expandedTxId === data.txId ? null : data.txId;
      render();
      break;
    case 'export-state': {
      const blob = new Blob([JSON.stringify(Store.getState(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `fiscal-ledger-${new Date().toISOString().slice(0,10)}.json`;
      a.click(); URL.revokeObjectURL(url);
      break;
    }
    case 'import-state': {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => { try { Store.dispatch({ type: 'SET_STATE', payload: JSON.parse(ev.target.result) }); } catch(err) { alert('Invalid state file.'); } };
        reader.readAsText(file);
      };
      input.click();
      break;
    }
    case 'reset-demo':
      if (confirm('Reset all data to defaults? This cannot be undone.')) {
        localStorage.removeItem('fiscal-ledger-state-v2');
        formState.activeTab = 'authorizations';
        formState.expandedTxId = null;
        formState.card = { subcategories: [], committeeName: '', requiredSigs: 1, signatories: [], complianceResult: null, visible: false };
        Store._state = getInitialState();
        Store._notify();
      }
      break;
    case 'start-guided-demo':
      startGuidedDemo();
      break;
    case 'demo-next':
      if (window._demoResolve) window._demoResolve();
      break;
    case 'demo-stop':
      stopGuidedDemo();
      break;
  }
}

/* ========== GUIDED DEMO ENGINE ========== */
let _demoRunning = false;
let _demoAborted = false;

function stopGuidedDemo() {
  _demoRunning = false;
  _demoAborted = true;
  if (window._demoResolve) window._demoResolve();
  document.body.classList.remove('demo-active');
  const bar = document.getElementById('demo-bar');
  if (bar) bar.remove();
  render();
}

function demoWaitForClick(stepLabel, stepNum, totalSteps, message) {
  return new Promise(resolve => {
    if (_demoAborted) { resolve(); return; }
    window._demoResolve = resolve;
    updateDemoBar(stepLabel, stepNum, totalSteps, message, false);
  });
}

function demoWait(ms) {
  return new Promise(resolve => {
    if (_demoAborted) { resolve(); return; }
    setTimeout(resolve, ms);
  });
}

function demoWaitForVote() {
  return new Promise(resolve => {
    if (_demoAborted) { resolve(); return; }
    const check = setInterval(() => {
      if (!voteAnimating || _demoAborted) { clearInterval(check); resolve(); }
    }, 100);
  });
}

function updateDemoBar(stepLabel, stepNum, totalSteps, message, waiting) {
  let bar = document.getElementById('demo-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'demo-bar';
    bar.className = 'demo-bar';
    document.body.appendChild(bar);
  }
  const pct = ((stepNum) / totalSteps * 100).toFixed(1);
  bar.innerHTML = `<div class="demo-bar__progress" style="width:${pct}%"></div>
    <div class="demo-bar__inner">
      <div class="demo-bar__step">Step ${stepNum}/${totalSteps}</div>
      <div class="demo-bar__text">${message}</div>
      <div class="demo-bar__actions">
        ${waiting ? '<span class="text-sm text-muted" style="color:var(--slate-400);white-space:nowrap;">Processing...</span>' : `<button class="demo-bar__btn demo-bar__btn--next" data-action="demo-next">Next &rarr;</button>`}
        <button class="demo-bar__btn demo-bar__btn--skip" data-action="demo-stop">Exit Demo</button>
      </div>
    </div>`;
  bar.onclick = function(e) {
    const t = e.target.closest('[data-action]');
    if (t) handleAction(t.dataset.action, t.dataset, Store.getState());
  };
}

  if (ab()) return;

  // ===== PHASE 5: PUBLISHING =====
  Store.dispatch({ type: 'SET_VIEW', payload: 'record' });
  render();
  await demoWaitForClick('Publishing', 33, T,
    '<strong>Phase 5: Publishing.</strong> Agency nodes sync automatically to Congress\'s super-node: the <strong>Public Statement and Account</strong> (Art. I, &sect; 9, cl. 7, as a live dashboard). Read the aggregates: appropriated, drawn, held, obligated, outlaid, collected, outstanding. Budgetary obfuscation gets structurally harder.');
  if (ab()) return;

  // Step 34: Financing handbrake — freeze
  if (dotLineId) Store.dispatch({ type: 'SET_LINE_FROZEN', payload: { lineId: dotLineId, frozen: true } });
  render();
  await demoWaitForClick('Handbrake', 34, T,
    'Congress just passed a Joint Resolution activating the <strong>financing handbrake</strong> on DOT\'s line — the NDFR\'s replacement for the debt ceiling. Instead of the Treasury Secretary running out of cash and dictating terms, <strong>only Congress</strong> can suspend new draws (subject to presidential veto and override) — per line, or government-wide at the ATM hardware layer. The parliamentary finger is on the button.');
  if (ab()) return;

  // Step 35: Draw while frozen — rejected
  if (dotLineId) {
    runDemoDraw(5e8, 'Draw attempted during handbrake freeze');
    render();
  }
  await demoWaitForClick('Handbrake', 35, T,
    'DOT tried to draw <strong>$500M</strong> during the freeze — <strong>REJECTED at the ATM</strong>. Note what is <em>not</em> affected: eCoins already on the ePurse remain spendable, and the freeze is a deliberate, attributable act of Congress rather than an executive-branch improvisation.');
  if (ab()) return;

  // Step 36: Lift the freeze, record collections
  if (dotLineId) Store.dispatch({ type: 'SET_LINE_FROZEN', payload: { lineId: dotLineId, frozen: false } });
  Store.dispatch({ type: 'ADD_TRANSACTION', payload: {
    id: 'tx-demo-collect', type: 'collect', agencyId: null, creditLineId: null,
    amount: 3e8, category: null, description: 'Q3 tax receipts redeemed (eCoins deleted)',
    timestamp: new Date().toISOString(), status: 'approved',
    complianceCheck: { passed: true, violations: [], checkedAgainst: ['Receipts deposited to the Record, not to any ePurse (Miscellaneous Receipts analogue, 31 U.S.C. 3302(b))', 'Redeemed eCoins deleted from outstanding'] }
  }});
  render();
  await demoWaitForClick('Collections', 36, T,
    'Freeze lifted, and <strong>$300M in tax receipts</strong> just arrived. Under the NDFR taxes don\'t "fund" spending — collected eCoins are <strong>deleted</strong>, shrinking outstanding money (and receipts flow to the Record, never into an agency\'s ePurse — the Miscellaneous Receipts principle). Watch <strong>Collected</strong> and <strong>Outstanding</strong> move: draws create, taxes delete.');
  if (ab()) return;

  // Step 37: Second bill
  Store.dispatch({ type: 'SET_VIEW', payload: 'legislative' });
  Store.dispatch({ type: 'SELECT_BILL', payload: 'bill-002' });
  formState.activeTab = 'authorizations';
  render();
  await demoWaitForClick('Second Bill', 37, T,
    'Back on the Record: the <strong>Public Health Emergency Preparedness Act</strong> appropriates credit lines for HHS ($5B) and EPA ($2.5B). Each line gets its own Card, draws, and ledger trail — agencies\' fiscal affairs stay decentralized while Congress keeps the consolidated books.');
  if (ab()) return;

  // Step 38: Closing
  await demoWaitForClick('Complete', 38, T,
    '<strong>Demo complete!</strong> You walked the NDFR\'s five phases — <strong>Appropriating</strong> (credit lines on the Fiscal Record), <strong>Drawing</strong> (Public Credit Card issuance), <strong>Coining</strong> (eCoins created at Congress\'s Treasury ATM), <strong>Spending</strong> (obligation against budget authority, payment from the ePurse), and <strong>Publishing</strong> (the live Public Statement and Account) — plus the financing handbrake and tax-deletion mechanics. Explore freely.');
  if (ab()) return;

  // Clean up
  _demoRunning = false;
  document.body.classList.remove('demo-active');
  const bar = document.getElementById('demo-bar');
  if (bar) bar.remove();
}

/* ========== INIT ========== */
Store.init();
Store.subscribe(render);
render();
</script>
</body>
</html>
