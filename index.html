  const latest = check && note ? (check.seq > note.seq ? check : note) : (check || note);
  if (!latest) return '';
  if (latest.kind === 'note') {
    return `<div class="alert alert--error mb-4"><strong>Refused (not a conformity violation):</strong> ${escHtml(latest.payload.note)}</div>`;
  }
  const p = latest.payload;
  const cls = p.outcome === 'PASS' ? 'alert--success' : p.outcome === 'VIOLATION' ? 'alert--error' : 'alert--warning';
  return `<div class="card card--flush mb-4">
    <div class="card__header"><h3>Latest conformity check — entry #${latest.seq}</h3><span class="badge ${p.outcome === 'PASS' ? 'badge--green' : p.outcome === 'VIOLATION' ? 'badge--red' : 'badge--amber'}">${p.outcome}</span></div>
    <div class="card__body">
      ${p.tests.map(t => `<div class="check-test check-test--${t.pass ? 'pass' : 'fail'}"><span class="check-test__icon">${t.pass ? '&#10003;' : '&#10007;'}</span><span style="min-width:130px;font-weight:600;">${t.id}</span><span class="text-muted">${escHtml(t.detail)}</span></div>`).join('')}
      ${p.outcome === 'PASS' ? '<div class="alert alert--success mt-2" style="margin-bottom:0;">Warrant issued <strong>automatically</strong> — no human touched it, and none could. (A warrant is not money and orders no one.)</div>' : ''}
      ${p.outcome === 'VIOLATION' ? `<div class="alert alert--error mt-2" style="margin-bottom:0;"><strong>Refused automatically, with reasons — fixable, never waivable.</strong> The exact enacted term violated:<br><em>"${escHtml(p.citedTerm)}"</em></div>` : ''}
      ${p.outcome === 'FLAG' ? `<div class="alert alert--warning mt-2" style="margin-bottom:0;"><strong>Judgment call — the machine never touches it.</strong> Routed to ${escHtml(p.flag.adjudicator)}; due ${formatDateTime(p.flag.deadline)}; silence deems approval — silence can never be a way to sit on lawful money.</div>` : ''}
    </div>
  </div>`;
}

/* ========== EVENT HANDLING ========== */
function mountHandlers(state) {
  const app = document.getElementById('app');
  app.onclick = function(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    handleAction(target.dataset.action, target.dataset, Store.getState());
  };
  app.onchange = function(e) {
    const t = e.target;
    if (t.id === 'commit-line') { formState.commitment.lineId = t.value; formState.commitment.purposeCode = ''; render(); }
    if (t.id === 'commit-purpose') formState.commitment.purposeCode = t.value;
    if (t.id === 'req-line') { formState.request.lineId = t.value; formState.request.commitmentRef = ''; formState.request.payeeId = ''; formState.request.purposeCode = ''; render(); }
    if (t.id === 'req-commitment') formState.request.commitmentRef = t.value;
    if (t.id === 'req-payee') formState.request.payeeId = t.value;
    if (t.id === 'req-purpose') formState.request.purposeCode = t.value;
    if (t.id === 'brake-line') formState.brakeForm.lineId = t.value;
    if (t.id === 'protocol-line') Store.dispatch({ type: 'SELECT_LINE', payload: t.value });
    if (t.classList.contains('brake-holder')) { formState.brakeForm.holders[parseInt(t.dataset.idx)] = t.checked; render(); }
  };
  app.oninput = function(e) {
    const t = e.target;
    if (t.id === 'commit-amount') formState.commitment.amount = t.value;
    if (t.id === 'commit-contractor') formState.commitment.contractor = t.value;
    if (t.id === 'commit-desc') formState.commitment.description = t.value;
    if (t.id === 'req-amount') formState.request.amount = t.value;
    if (t.id === 'req-invoice') formState.request.invoiceNo = t.value;
    if (t.id === 'reqn-amount') formState.requisition.amount = t.value;
    if (t.id === 'reqn-basis') formState.requisition.basis = t.value;
    if (t.id === 'brake-reasons') formState.brakeForm.reasons = t.value;
    if (t.classList.contains('adj-reason')) formState.adjReasons[t.dataset.seq] = t.value;
  };
}

function currentFormDefaults(state) {
  // Keep selects meaningful when values are unset.
  const fc = formState.commitment;
  const line = lineById(state, fc.lineId) || state.bill.annex.lines[0];
  if (!fc.purposeCode && line) fc.purposeCode = line.purposeCodes[0];
  const fr = formState.request;
  const rl = lineById(state, fr.lineId) || state.bill.annex.lines[0];
  if (!fr.purposeCode && rl) fr.purposeCode = rl.purposeCodes[0];
  if (!fr.payeeId && rl) fr.payeeId = (PAYEE_LISTS[rl.payeeListId][0] || {}).id || '';
  if (!fr.commitmentRef) {
    const ledger = deriveLedger(state.journal, state.bill.annex.lines);
    const per = (ledger.lines[rl.id] || { perCommitment: [] }).perCommitment;
    if (per.length) fr.commitmentRef = String(per[per.length - 1].seq);
  }
}

function handleAction(action, data, state) {
  switch (action) {
    case 'set-view': Store.dispatch({ type: 'SET_VIEW', payload: data.view }); break;
    case 'set-bill-tab': Store.dispatch({ type: 'SET_BILL_TAB', payload: data.tab }); break;
    case 'select-entry': Store.dispatch({ type: 'SELECT_ENTRY', payload: parseInt(data.seq) }); break;
    case 'journal-filter': Store.dispatch({ type: 'SET_JOURNAL_FILTER', payload: data.filter }); break;
    case 'select-study-copy': Store.dispatch({ type: 'SELECT_STUDY_COPY', payload: data.id }); break;

    case 'clock-hours': Store.dispatch({ type: 'ADVANCE_CLOCK', payload: { hours: parseInt(data.hours) } }); break;
    case 'clock-bdays': Store.dispatch({ type: 'ADVANCE_CLOCK', payload: { businessDays: parseInt(data.days) } }); break;
    case 'clock-next': Store.dispatch({ type: 'ADVANCE_CLOCK', payload: { toNext: true } }); break;

    /* enactment */
    case 'refer-committee': Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { status: 'in_committee' } }); break;
    case 'report-bill': Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { status: 'house_floor' } }); break;
    case 'simulate-vote':
      Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { status: data.chamber === 'house' ? 'house_voting' : 'senate_voting' } });
      setTimeout(() => startVoteAnimation(data.chamber, false), 50);
      break;
    case 'simulate-override':
      Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { status: data.chamber === 'house' ? 'veto_override_house' : 'veto_override_senate' } });
      setTimeout(() => startVoteAnimation(data.chamber, true), 50);
      break;
    case 'file-cloture': {
      const yea = 55 + Math.floor(Math.random() * 12);
      const nay = 100 - yea - Math.floor(Math.random() * 3);
      const invoked = yea >= 60;
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { votes: { cloture: { yea, nay, invoked } } } });
      if (invoked) Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { status: 'senate_floor' } });
      break;
    }
    case 'vp-tiebreak': {
      const b = Store.getState().bill;
      if (!b.votes.senateCount || b.votes.senateCount.yea !== b.votes.senateCount.nay) return;
      const newCount = Object.assign({}, b.votes.senateCount, { yea: b.votes.senateCount.yea + 1 });
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { votes: { senateCount: newCount, vpTieBreak: true } } });
      Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { status: 'senate_passed' } });
      break;
    }
    case 'sign-bill':
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { votes: { presidentialAction: 'signed' } } });
      Store.dispatch({ type: 'ENACT_BILL' });
      break;
    case 'no-action-bill':
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { votes: { presidentialAction: 'no_action' } } });
      Store.dispatch({ type: 'ENACT_BILL' });
      break;
    case 'veto-bill':
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { votes: { presidentialAction: 'vetoed' } } });
      Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { status: 'vetoed' } });
      break;
    case 'certify-enactment': Store.dispatch({ type: 'CERTIFY_ENACTMENT' }); break;

    /* pipeline */
    case 'certify-readiness': Store.dispatch({ type: 'CERTIFY_READINESS', payload: { lineId: data.line } }); break;
    case 'submit-commitment': {
      const fc = formState.commitment;
      if (!fc.lineId || !fc.amount) return;
      Store.dispatch({ type: 'ADD_COMMITMENT', payload: { lineId: fc.lineId, amount: parseFloat(fc.amount), contractor: fc.contractor || 'Unnamed contractor', description: fc.description || '', purposeCode: fc.purposeCode || (lineById(state, fc.lineId) || {}).purposeCodes[0] } });
      formState.commitment.amount = ''; formState.commitment.contractor = ''; formState.commitment.description = '';
      break;
    }
    case 'submit-request': {
      const fr = formState.request;
      if (!fr.lineId || !fr.amount || !fr.commitmentRef) return;
      Store.dispatch({ type: 'SUBMIT_REQUEST', payload: { lineId: fr.lineId, commitmentRef: parseInt(fr.commitmentRef), payeeId: fr.payeeId, amount: parseFloat(fr.amount), purposeCode: fr.purposeCode, invoiceNo: fr.invoiceNo || ('INV-' + uid().slice(-5)) } });
      formState.request.amount = ''; formState.request.invoiceNo = '';
      break;
    }
    case 'adjudicate': {
      const seq = parseInt(data.seq);
      const reasons = formState.adjReasons[seq] || '';
      const flag = entryBySeq(Store.getState().journal, seq);
      const line = flag ? lineById(Store.getState(), flag.lineId) : null;
      Store.dispatch({ type: 'ADJUDICATE_FLAG', payload: { flagRef: seq, decision: data.decision, reasons, citedTerm: data.decision === 'deny' ? (line ? line.enactedText : reasons) : null } });
      delete formState.adjReasons[seq];
      break;
    }
    case 'execute-payment': Store.dispatch({ type: 'EXECUTE_PAYMENT', payload: { warrantRef: parseInt(data.seq) } }); break;
    case 'run-reconstruction': Store.dispatch({ type: 'RUN_RECONSTRUCTION' }); break;
    case 'council-requisition': {
      const fq = formState.requisition;
      if (!fq.amount) return;
      Store.dispatch({ type: 'COUNCIL_REQUISITION', payload: { amount: parseFloat(fq.amount), basis: fq.basis || 'operations of the record', votes: 3 } });
      formState.requisition.amount = ''; formState.requisition.basis = '';
      break;
    }
    case 'pull-brake': {
      const bf = formState.brakeForm;
      const holders = BRAKE_PRINCIPALS.filter((_, i) => bf.holders[i]);
      if (holders.length < 3) return;
      Store.dispatch({ type: 'PULL_BRAKE', payload: { holders, reasons: bf.reasons || '(reasons required — published instantly)', lineId: bf.lineId || null } });
      formState.brakeForm = { holders: [false, false, false, false], reasons: '', lineId: '' };
      break;
    }
    case 'renew-brake': Store.dispatch({ type: 'RENEW_BRAKE' }); break;
    case 'release-brake': Store.dispatch({ type: 'RELEASE_BRAKE' }); break;
    case 'system-down': Store.dispatch({ type: 'SET_SYSTEM_DOWN' }); break;
    case 'restore-system': Store.dispatch({ type: 'RESTORE_SYSTEM' }); break;
    case 'certify-milestone': Store.dispatch({ type: 'CERTIFY_MILESTONE', payload: { milestoneId: data.id } }); break;

    case 'ask-question': {
      const st = Store.getState();
      const line = lineById(st, st.selectedLineId) || st.bill.annex.lines[0];
      const ledger = deriveLedger(st.journal, st.bill.annex.lines);
      const L = ledger.lines[line.id];
      const el = document.getElementById('protocol-answer');
      if (!el) return;
      let ans = '';
      if (data.q === '1') ans = st.certified ? `YES — "${line.name}" is enacted law, certified as Journal entry #1 (fingerprint ${st.bill.annex.fingerprint}).` : 'NO — the bill has not been certified into the Journal yet.';
      if (data.q === '2') ans = `${formatExact(Math.max(0, L.remaining))} unobligated of ${formatExact(L.provided)} provided (committed ${formatExact(L.committed)}, paid ${formatExact(L.paid)}). Recomputed from the Journal just now.`;
      if (data.q === '4') ans = `Enacted payee list for "${line.name}": ${(PAYEE_LISTS[line.payeeListId] || []).map(p => p.name).join('; ')}. Anyone not on the list fails test 4 automatically.`;
      if (data.q === '8') {
        const lastPayment = [...st.journal].reverse().find(e => e.kind === 'payment');
        ans = lastPayment ? 'Chain for payment #' + lastPayment.seq + ': ' + chainFor(st.journal, lastPayment.seq).map(c => `#${c.seq} ${c.kind}`).join(' ← ') : 'No payments in the Journal yet.';
      }
      el.textContent = ans;
      el.classList.remove('hidden');
      break;
    }

    case 'reset-demo':
      if (confirm('Reset all data to defaults? This cannot be undone.')) {
        localStorage.removeItem('efiscal-demo-state-v1');
        Store._state = getInitialState();
        Store._notify();
      }
      break;
    case 'start-guided-demo': startGuidedDemo(); break;
    case 'demo-next': if (window._demoResolve) window._demoResolve(); break;
    case 'demo-stop': stopGuidedDemo(); break;
  }
}

/* ========== GUIDED DEMO ENGINE ========== */
let _demoRunning = false;
let _demoAborted = false;
function stopGuidedDemo() {
  _demoRunning = false; _demoAborted = true;
  if (window._demoResolve) window._demoResolve();
  document.body.classList.remove('demo-active');
  const bar = document.getElementById('demo-bar');
  if (bar) bar.remove();
  render();
}
function demoWaitForClick(stepLabel, stepNum, totalSteps, message) {
  return new Promise(resolve => {
    if (_demoAborted) { resolve(); return; }
    window._demoResolve = resolve;
    updateDemoBar(stepLabel, stepNum, totalSteps, message, false);
  });
}
function demoWait(ms) {
  return new Promise(resolve => { if (_demoAborted) { resolve(); return; } setTimeout(resolve, ms); });
}
function demoWaitForVote() {
  return new Promise(resolve => {
    if (_demoAborted) { resolve(); return; }
    const check = setInterval(() => { if (!voteAnimating || _demoAborted) { clearInterval(check); resolve(); } }, 100);
  });
}
function updateDemoBar(stepLabel, stepNum, totalSteps, message, waiting) {
  let bar = document.getElementById('demo-bar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'demo-bar'; bar.className = 'demo-bar'; document.body.appendChild(bar); }
  const pct = (stepNum / totalSteps * 100).toFixed(1);
  bar.innerHTML = `<div class="demo-bar__progress" style="width:${pct}%"></div>
    <div class="demo-bar__inner">
      <div class="demo-bar__step">Step ${stepNum}/${totalSteps}</div>
      <div class="demo-bar__text">${message}</div>
      <div class="demo-bar__actions">
        ${waiting ? '<span class="text-sm" style="color:var(--slate-400);white-space:nowrap;">Processing...</span>' : `<button class="demo-bar__btn demo-bar__btn--next" data-action="demo-next">Next &rarr;</button>`}
        <button class="demo-bar__btn demo-bar__btn--skip" data-action="demo-stop">Exit Demo</button>
      </div>
    </div>`;
  bar.onclick = function(e) {
    const t = e.target.closest('[data-action]');
    if (t) handleAction(t.dataset.action, t.dataset, Store.getState());
  };
}

/* ========== SMOKE TESTS (pure logic, no DOM) ========== */
function runSmokeTests() {
  const results = [];
  const check = (name, cond, detail) => results.push({ name, pass: !!cond, detail: detail || '' });
  let s = getInitialState();
  const D = (type, payload) => { s = reducer(s, { type, payload }); };

  check('fresh: journal empty, draft, all shadow', s.journal.length === 0 && s.bill.status === 'draft' && Object.values(s.readiness).every(r => r.mode === 'shadow'));
  check('fingerprint deterministic', fingerprint(s.bill.annex.lines) === s.bill.annex.fingerprint);
  check('addBusinessDays skips weekend', addBusinessDays('2027-01-08T09:00:00.000Z', 3).startsWith('2027-01-13')); // Fri + 3 biz = Wed

  // enact + certify
  D('ENACT_BILL'); D('CERTIFY_ENACTMENT');
  check('certification appends law entry v1 w/ two dates', s.journal.length === 2 && s.journal[0].kind === 'law' && s.journal[0].version === 1 && !!s.journal[0].writtenAt && !!s.journal[0].enteredAt);
  const snapshot = JSON.stringify(s.journal[0]);
  D('CERTIFY_ENACTMENT');
  check('certify is idempotent', s.journal.length === 2);

  // shadow gating
  D('ADD_COMMITMENT', { lineId: 'line-a', amount: 100000, contractor: 'X', description: 'x', purposeCode: 'operations' });
  check('commitment refused while in shadow', s.journal[s.journal.length - 1].kind === 'note' && s.journal[s.journal.length - 1].payload.refusedKind === 'commitment');
  D('CERTIFY_READINESS', { lineId: 'line-a' });
  D('CERTIFY_READINESS', { lineId: 'line-b' });
  D('CERTIFY_READINESS', { lineId: 'line-e' });

  // commitment + ledger math
  D('ADD_COMMITMENT', { lineId: 'line-a', amount: 120000, contractor: 'CapTech', description: 'IT', purposeCode: 'operations' });
  const commitSeq = s.journal[s.journal.length - 1].seq;
  let led = deriveLedger(s.journal, s.bill.annex.lines);
  check('commitment raises committed', led.lines['line-a'].committed === 120000 && led.lines['line-a'].remaining === 6000000 - 120000);
  D('ADD_COMMITMENT', { lineId: 'line-a', amount: 99000000, contractor: 'Too big', description: 'x', purposeCode: 'operations' });
  check('over-authority commitment refused & cites enacted text', s.journal[s.journal.length - 1].payload.refused === true && s.journal[s.journal.length - 1].payload.citedTerm.includes('6,000,000'));

  // happy path: PASS auto-warrant in same dispatch
  D('SUBMIT_REQUEST', { lineId: 'line-a', commitmentRef: commitSeq, payeeId: 'p-capitol-tech', amount: 40000, purposeCode: 'operations', invoiceNo: 'I1' });
  const lastThree = s.journal.slice(-3).map(e => e.kind);
  check('PASS: request+check+warrant in one dispatch', JSON.stringify(lastThree) === JSON.stringify(['request','check','warrant']) && s.journal[s.journal.length - 1].payload.autoIssued === true);
  const warrantSeq = s.journal[s.journal.length - 1].seq;
  D('EXECUTE_PAYMENT', { warrantRef: warrantSeq });
  led = deriveLedger(s.journal, s.bill.annex.lines);
  check('payment: paid & open reconcile', led.lines['line-a'].paid === 40000 && led.lines['line-a'].open === 80000);
  check('chain walks payment→law', chainFor(s.journal, s.journal[s.journal.length - 1].seq).some(e => e.kind === 'law'));
  D('EXECUTE_PAYMENT', { warrantRef: warrantSeq });
  check('double payment blocked', s.journal.filter(e => e.kind === 'payment').length === 1);

  // violations
  D('SUBMIT_REQUEST', { lineId: 'line-a', commitmentRef: commitSeq, payeeId: 'p-capitol-tech', amount: 200000, purposeCode: 'operations', invoiceNo: 'I2' });
  let lastCheck = [...s.journal].reverse().find(e => e.kind === 'check');
  check('over-commitment request = VIOLATION citing enacted term', lastCheck.payload.outcome === 'VIOLATION' && !!lastCheck.payload.citedTerm);
  check('violation issues no warrant', s.journal.filter(e => e.kind === 'warrant').length === 1);
  D('SUBMIT_REQUEST', { lineId: 'line-a', commitmentRef: commitSeq, payeeId: 'p-loc', amount: 1000, purposeCode: 'operations', invoiceNo: 'I3' });
  lastCheck = [...s.journal].reverse().find(e => e.kind === 'check');
  check('ineligible payee fails test 4', lastCheck.payload.outcome === 'VIOLATION' && lastCheck.payload.tests.find(t => t.id === 'eligible-recipient').pass === false);
  D('SUBMIT_REQUEST', { lineId: 'line-a', commitmentRef: commitSeq, payeeId: 'p-capitol-tech', amount: 1000, purposeCode: 'operations', invoiceNo: 'I1' });
  lastCheck = [...s.journal].reverse().find(e => e.kind === 'check');
  check('duplicate invoice fails test 5', lastCheck.payload.outcome === 'VIOLATION' && lastCheck.payload.tests.find(t => t.id === 'no-duplicate').pass === false);

  // judgment flag + clock
  D('ADD_COMMITMENT', { lineId: 'line-b', amount: 900000, contractor: 'RT', description: 'red team', purposeCode: 'red-team' });
  const commitB = s.journal[s.journal.length - 1].seq;
  D('SUBMIT_REQUEST', { lineId: 'line-b', commitmentRef: commitB, payeeId: 'p-researcher', amount: 30000, purposeCode: 'red-team', invoiceNo: 'R1' });
  let flag = pendingFlags(s.journal)[0];
  check('judgment payee → FLAG w/ 3-biz-day deadline', !!flag && flag.payload.flag.deadline === addBusinessDays(flag.enteredAt, 3));
  check('small flag: no ping', s.oversightPings.length === 0);
  D('ADJUDICATE_FLAG', { flagRef: flag.seq, decision: 'deny' });
  check('deny without citedTerm rejected', pendingFlags(s.journal).length === 1);
  D('ADJUDICATE_FLAG', { flagRef: flag.seq, decision: 'approve', reasons: 'ok' });
  check('approve issues warrant', s.journal[s.journal.length - 1].kind === 'warrant');

  // large flag ping + silence
  D('SUBMIT_REQUEST', { lineId: 'line-b', commitmentRef: commitB, payeeId: 'p-researcher', amount: 600000, purposeCode: 'red-team', invoiceNo: 'R2' });
  flag = pendingFlags(s.journal)[0];
  const deadlineBefore = flag.payload.flag.deadline;
  check('large flag pings overseers, clock unmoved', s.oversightPings.length === 1 && flag.payload.flag.deadline === deadlineBefore);
  D('ADVANCE_CLOCK', { businessDays: 3 }); D('ADVANCE_CLOCK', { hours: 1 });
  const deemed = [...s.journal].reverse().find(e => e.kind === 'adjudication');
  check('silence deems approval + warrant by operation of law', deemed.payload.deemed === true && s.journal.some(e => e.kind === 'warrant' && e.payload.deemed === true));

  // brake
  D('PULL_BRAKE', { holders: BRAKE_PRINCIPALS.slice(0, 2), reasons: 'x', lineId: 'line-b' });
  check('brake needs 3 of 4', s.brake.active === false);
  D('PULL_BRAKE', { holders: BRAKE_PRINCIPALS.slice(0, 3), reasons: 'review', lineId: 'line-b' });
  check('brake active & instantly public', s.brake.active === true && isPublic([...s.journal].reverse().find(e => e.kind === 'brake'), s.simNow));
  D('SUBMIT_REQUEST', { lineId: 'line-b', commitmentRef: commitB, payeeId: 'p-redline', amount: 1000, purposeCode: 'red-team', invoiceNo: 'R3' });
  check('brake refuses new request (not a violation)', s.journal[s.journal.length - 1].kind === 'note' && s.journal[s.journal.length - 1].payload.brake === true);
  const wPending = warrantsAwaitingPayment(s.journal)[0];
  D('EXECUTE_PAYMENT', { warrantRef: wPending.seq });
  check('in-flight warrant still pays during brake', s.journal[s.journal.length - 1].kind === 'payment');
  D('ADVANCE_CLOCK', { hours: 73 });
  check('brake expires after 72h unless renewed', s.brake.active === false && s.journal.some(e => e.kind === 'brake-release'));

  // publication embargo
  const freshEntry = [...s.journal].reverse().find(e => e.kind === 'brake-release');
  check('brake-release instantly public; payments embargoed 24h', isPublic(freshEntry, s.simNow) === true);

  // milestone idempotent
  D('CERTIFY_MILESTONE', { milestoneId: 'milestone-loc-1' });
  led = deriveLedger(s.journal, s.bill.annex.lines);
  const providedAfter = led.lines['line-c'].provided;
  D('CERTIFY_MILESTONE', { milestoneId: 'milestone-loc-1' });
  led = deriveLedger(s.journal, s.bill.annex.lines);
  check('milestone unlocks C-2 exactly once', providedAfter === 3000000 && led.lines['line-c'].provided === 3000000 && s.journal.filter(e => e.kind === 'milestone-cert').length === 1);

  // account / rail B
  D('COUNCIL_REQUISITION', { amount: 250000, basis: 'ops', votes: 2 });
  check('requisition needs 3 votes', s.account.balance === 0);
  D('COUNCIL_REQUISITION', { amount: 250000, basis: 'ops', votes: 3 });
  check('requisition credits the Account', s.account.balance === 250000 && s.journal.slice(-2).map(e => e.kind).join(',') === 'requisition,credit');
  D('ADD_COMMITMENT', { lineId: 'line-e', amount: 90000, contractor: 'NAPA', description: 'eval', purposeCode: 'evaluation' });
  const commitE = s.journal[s.journal.length - 1].seq;
  D('SUBMIT_REQUEST', { lineId: 'line-e', commitmentRef: commitE, payeeId: 'p-eval', amount: 45000, purposeCode: 'evaluation', invoiceNo: 'C1' });
  const wE = warrantsAwaitingPayment(s.journal).find(w => w.lineId === 'line-e');
  D('EXECUTE_PAYMENT', { warrantRef: wE.seq });
  check('rail B payment debits the Account', s.account.balance === 205000);

  // floor
  D('SET_SYSTEM_DOWN');
  D('SUBMIT_REQUEST', { lineId: 'line-a', commitmentRef: commitSeq, payeeId: 'p-capitol-tech', amount: 15000, purposeCode: 'operations', invoiceNo: 'I9' });
  check('floor routes payment old-way', s.floor.oldWayPayments.length === 1);
  D('RESTORE_SYSTEM');
  check('restore reconciles into the Journal', s.floor.oldWayPayments.length === 0 && s.journal.some(e => e.kind === 'reconciliation'));
  led = deriveLedger(s.journal, s.bill.annex.lines);
  check('reconciled payment counted as paid', led.lines['line-a'].paid === 55000);

  // append-only + reconstruction + round-trip
  check('append-only: entry #1 unchanged; seq strictly increasing', JSON.stringify(s.journal[0]) === snapshot && s.journal.every((e, i) => i === 0 || e.seq === s.journal[i - 1].seq + 1));
  const a = deriveLedger(s.journal, s.bill.annex.lines);
  const b = deriveLedger(JSON.parse(JSON.stringify(s.journal)), JSON.parse(JSON.stringify(s.bill.annex.lines)));
  check('outside reconstruction matches to the penny', JSON.stringify(a) === JSON.stringify(b));
  check('state JSON round-trips', JSON.stringify(JSON.parse(JSON.stringify(s))) === JSON.stringify(s));

  const failed = results.filter(r => !r.pass);
  const summary = failed.length === 0 ? `SMOKE PASS ${results.length}/${results.length}` : `SMOKE FAIL ${failed.length}/${results.length}`;
  if (typeof document !== 'undefined' && document.title !== undefined) {
    try { document.title = summary; } catch (e) {}
  }
  return { summary, results, failed };
}
if (typeof window !== 'undefined') window.runSmokeTests = runSmokeTests;

/* ========== INIT ========== */
Store.init();
Store.subscribe(function() { currentFormDefaults(Store.getState()); render(); });
currentFormDefaults(Store.getState());
render();
if (typeof location !== 'undefined' && location.search && location.search.indexOf('smoke=1') !== -1) {
  const out = runSmokeTests();
  const pre = document.createElement('pre');
  pre.id = 'smoke-results';
  pre.textContent = out.summary + '\n\n' + out.results.map(r => (r.pass ? '  ok  ' : 'FAIL  ') + r.name + (r.detail ? ' — ' + r.detail : '')).join('\n');
  document.body.appendChild(pre);
}
</script>
</body>
</html>
