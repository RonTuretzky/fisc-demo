<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congressional Fiscal Ledger</title>
<style>
/* ========== RESET & VARIABLES ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy-900: #0f172a; --navy-800: #1e293b; --navy-700: #334155;
  --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
  --slate-300: #cbd5e1; --slate-400: #94a3b8; --slate-500: #64748b;
  --slate-600: #475569; --slate-700: #334155; --slate-800: #1e293b;
  --gray-950: #030712;
  --blue-50: #eff6ff; --blue-100: #dbeafe; --blue-500: #3b82f6; --blue-600: #2563eb; --blue-700: #1d4ed8;
  --green-50: #f0fdf4; --green-100: #dcfce7; --green-500: #22c55e; --green-600: #16a34a; --green-700: #15803d;
  --red-50: #fef2f2; --red-100: #fee2e2; --red-500: #ef4444; --red-600: #dc2626; --red-700: #b91c1c;
  --amber-50: #fffbeb; --amber-100: #fef3c7; --amber-500: #f59e0b; --amber-600: #d97706;
  --orange-500: #f97316; --orange-600: #ea580c;
  --purple-50: #faf5ff; --purple-100: #f3e8ff; --purple-500: #a855f7; --purple-600: #7c3aed;
  --emerald-500: #10b981; --emerald-600: #059669;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius: 8px; --radius-sm: 4px; --radius-lg: 12px;
}
html, body { height: 100%; font-family: var(--font-sans); background: var(--slate-100); color: var(--gray-950); font-size: 14px; line-height: 1.5; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: inherit; }
a { color: var(--blue-600); text-decoration: none; }

/* ========== HEADER ========== */
.header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: var(--navy-900); display: flex; align-items: center; padding: 0 24px; z-index: 100; gap: 24px; }
.header__brand { display: flex; align-items: center; gap: 10px; color: white; font-weight: 700; font-size: 16px; white-space: nowrap; }
.header__brand svg { flex-shrink: 0; }
.header__nav { display: flex; gap: 4px; margin-left: 24px; }
.header__tab { padding: 8px 16px; border-radius: var(--radius); color: var(--slate-300); font-weight: 500; font-size: 13px; transition: all 0.15s; }
.header__tab:hover { background: var(--navy-700); color: white; }
.header__tab--active { background: var(--blue-600); color: white; }
.header__actions { margin-left: auto; display: flex; gap: 8px; }
.header__btn { padding: 6px 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; color: var(--slate-300); border: 1px solid var(--navy-700); transition: all 0.15s; }
.header__btn:hover { background: var(--navy-700); color: white; }
.header__btn--danger { color: var(--red-500); border-color: var(--red-500)/30; }
.header__btn--danger:hover { background: rgba(220,38,38,0.15); color: var(--red-400); }

/* ========== LAYOUT ========== */
.app-main { padding-top: 56px; height: 100vh; }
.split-view { display: flex; height: calc(100vh - 56px); }
.sidebar { width: 340px; border-right: 1px solid var(--slate-200); background: white; overflow-y: auto; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; background: var(--slate-50); }
.content-inner { max-width: 960px; margin: 0 auto; padding: 24px; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--slate-400); gap: 12px; }
.empty-state svg { opacity: 0.4; }
.empty-state p { font-size: 15px; }

/* ========== SIDEBAR ITEMS ========== */
.sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--slate-200); display: flex; justify-content: space-between; align-items: center; }
.sidebar-header h2 { font-size: 15px; font-weight: 700; color: var(--gray-950); }
.sidebar-item { padding: 12px 20px; border-bottom: 1px solid var(--slate-100); cursor: pointer; transition: background 0.1s; }
.sidebar-item:hover { background: var(--slate-50); }
.sidebar-item--selected { background: var(--blue-50); border-left: 3px solid var(--blue-600); }
.sidebar-item__title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.sidebar-item__meta { font-size: 12px; color: var(--slate-500); display: flex; gap: 8px; align-items: center; }

/* ========== BADGES ========== */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge--blue { background: var(--blue-100); color: var(--blue-700); }
.badge--green { background: var(--green-100); color: var(--green-700); }
.badge--red { background: var(--red-100); color: var(--red-700); }
.badge--amber { background: var(--amber-100); color: var(--amber-600); }
.badge--purple { background: var(--purple-100); color: var(--purple-600); }
.badge--slate { background: var(--slate-200); color: var(--slate-600); }
.badge--orange { background: #fff7ed; color: var(--orange-600); }

/* ========== CARDS & SECTIONS ========== */
.card { background: white; border: 1px solid var(--slate-200); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
.card--flush { padding: 0; }
.card__header { padding: 16px 20px; border-bottom: 1px solid var(--slate-200); display: flex; justify-content: space-between; align-items: center; }
.card__header h3 { font-size: 14px; font-weight: 700; }
.card__body { padding: 16px 20px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

/* ========== TABS ========== */
.tabs { display: flex; border-bottom: 2px solid var(--slate-200); margin-bottom: 20px; }
.tab { padding: 10px 20px; font-weight: 600; font-size: 13px; color: var(--slate-500); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
.tab:hover { color: var(--slate-700); }
.tab--active { color: var(--blue-600); border-bottom-color: var(--blue-600); }

/* ========== FORMS ========== */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--slate-600); margin-bottom: 4px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 8px 12px; border: 1px solid var(--slate-300); border-radius: var(--radius-sm);
  font-size: 13px; background: white; color: var(--gray-950); transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.form-textarea { resize: vertical; min-height: 60px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
.form-inline { display: flex; gap: 8px; }

/* ========== BUTTONS ========== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; transition: all 0.15s; }
.btn--primary { background: var(--blue-600); color: white; }
.btn--primary:hover { background: var(--blue-700); }
.btn--success { background: var(--green-600); color: white; }
.btn--success:hover { background: var(--green-700); }
.btn--danger { background: var(--red-600); color: white; }
.btn--danger:hover { background: var(--red-700); }
.btn--outline { border: 1px solid var(--slate-300); color: var(--slate-700); background: white; }
.btn--outline:hover { background: var(--slate-50); border-color: var(--slate-400); }
.btn--sm { padding: 5px 10px; font-size: 12px; }
.btn--xs { padding: 3px 8px; font-size: 11px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn--full { width: 100%; }

/* ========== PROGRESS BARS ========== */
.progress { height: 8px; background: var(--slate-200); border-radius: 9999px; overflow: hidden; }
.progress--lg { height: 12px; }
.progress__fill { height: 100%; border-radius: 9999px; transition: width 0.3s; }

/* ========== TALLY BAR (Vote Simulation) ========== */
.tally { margin-bottom: 16px; }
.tally__label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
.tally__counts { display: flex; gap: 16px; font-size: 12px; }
.tally__counts span { font-weight: 600; }
.tally__bar { height: 28px; background: var(--slate-200); border-radius: var(--radius-sm); overflow: hidden; display: flex; position: relative; }
.tally__yea { background: var(--green-500); height: 100%; transition: width 0.05s linear; }
.tally__nay { background: var(--red-500); height: 100%; transition: width 0.05s linear; }
.tally__other { background: var(--slate-300); height: 100%; transition: width 0.05s linear; }
.tally__threshold { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gray-950); z-index: 2; }
.tally__threshold-label { position: absolute; top: -18px; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--slate-600); }

/* ========== STEPPER ========== */
.stepper { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 24px; padding: 16px 0; }
.stepper__step { display: flex; align-items: center; gap: 0; }
.stepper__circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid var(--slate-300); color: var(--slate-400); background: white; flex-shrink: 0; }
.stepper__circle--active { border-color: var(--blue-600); color: var(--blue-600); background: var(--blue-50); }
.stepper__circle--done { border-color: var(--green-600); color: white; background: var(--green-600); }
.stepper__circle--failed { border-color: var(--red-600); color: white; background: var(--red-600); }
.stepper__text { font-size: 11px; font-weight: 600; color: var(--slate-400); margin-top: 4px; text-align: center; max-width: 80px; }
.stepper__text--active { color: var(--blue-600); }
.stepper__text--done { color: var(--green-600); }
.stepper__text--failed { color: var(--red-600); }
.stepper__line { width: 48px; height: 2px; background: var(--slate-300); margin: 0 4px; flex-shrink: 0; }
.stepper__line--done { background: var(--green-600); }
.stepper__node { display: flex; flex-direction: column; align-items: center; }

/* ========== AUTHORIZATION CARDS ========== */
.auth-card { border: 1px solid var(--slate-200); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--slate-300); }
.auth-card__header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
.auth-card__title { font-weight: 600; font-size: 13px; }
.auth-card__amount { font-weight: 700; font-size: 14px; }
.auth-card__details { font-size: 12px; color: var(--slate-500); }
.auth-card__categories { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

/* ========== DIFF VIEW ========== */
.diff-line { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; }
.diff-line--old { background: var(--red-50); color: var(--red-700); }
.diff-line--new { background: var(--green-50); color: var(--green-700); }
.diff-line--old::before { content: '- '; }
.diff-line--new::before { content: '+ '; }

/* ========== TABLE ========== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; padding: 10px 12px; font-weight: 600; font-size: 12px; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--slate-200); background: var(--slate-50); }
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--slate-100); vertical-align: top; }
tbody tr:hover { background: var(--slate-50); }
tbody tr.expanded-row { background: var(--slate-50); }
.compliance-detail { padding: 12px; background: var(--slate-100); border-radius: var(--radius-sm); margin: 4px 0; font-size: 12px; }
.compliance-detail ul { list-style: disc; margin-left: 16px; margin-top: 4px; }

/* ========== CREDIT BAR ========== */
.credit-bar { margin-bottom: 16px; }
.credit-bar__header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.credit-bar__label { font-weight: 600; }
.credit-bar__value { color: var(--slate-500); }
.credit-bar__track { height: 20px; background: var(--slate-200); border-radius: var(--radius-sm); overflow: hidden; position: relative; }
.credit-bar__fill { height: 100%; border-radius: var(--radius-sm); transition: width 0.3s; }
.credit-bar__pct { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: var(--slate-600); }

/* ========== ALERTS ========== */
.alert { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; }
.alert--success { background: var(--green-50); border: 1px solid var(--green-500); color: var(--green-700); }
.alert--error { background: var(--red-50); border: 1px solid var(--red-500); color: var(--red-700); }
.alert--warning { background: var(--amber-50); border: 1px solid var(--amber-500); color: var(--amber-600); }
.alert--info { background: var(--blue-50); border: 1px solid var(--blue-500); color: var(--blue-700); }
.alert ul { margin-left: 16px; margin-top: 4px; list-style: disc; }

/* ========== MISC ========== */
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-muted { color: var(--slate-500); }
.text-right { text-align: right; }
.mt-2 { margin-top: 8px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }
.flex { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-1 { gap: 4px; }
.hidden { display: none !important; }
pre.bill-text { font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; background: var(--slate-50); padding: 16px; border-radius: var(--radius); border: 1px solid var(--slate-200); max-height: 300px; overflow-y: auto; }
.color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.sig-check { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
.sig-check input[type="checkbox"] { width: 16px; height: 16px; }
.refinement-tree-item { padding: 8px 16px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--slate-100); }
.refinement-tree-item:hover { background: var(--slate-50); }
.refinement-tree-item--selected { background: var(--blue-50); font-weight: 600; }
.refinement-tree-bill { padding: 10px 16px; font-weight: 700; font-size: 13px; background: var(--slate-50); border-bottom: 1px solid var(--slate-200); }

/* ========== DEMO MODE ========== */
.demo-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: var(--navy-900); color: white; box-shadow: 0 -4px 20px rgba(0,0,0,0.25); transition: transform 0.3s ease; }
.demo-bar--hidden { transform: translateY(100%); }
.demo-bar__inner { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
.demo-bar__step { font-size: 11px; font-weight: 700; color: var(--blue-500); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; min-width: 90px; }
.demo-bar__text { flex: 1; font-size: 14px; line-height: 1.5; }
.demo-bar__text strong { color: var(--amber-500); }
.demo-bar__actions { display: flex; gap: 8px; flex-shrink: 0; }
.demo-bar__btn { padding: 8px 18px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; transition: all 0.15s; }
.demo-bar__btn--next { background: var(--blue-600); color: white; }
.demo-bar__btn--next:hover { background: var(--blue-500); }
.demo-bar__btn--skip { color: var(--slate-400); border: 1px solid var(--slate-600); }
.demo-bar__btn--skip:hover { color: white; border-color: var(--slate-400); }
.demo-bar__btn:disabled { opacity: 0.4; cursor: not-allowed; }
.demo-bar__progress { position: absolute; top: 0; left: 0; height: 3px; background: var(--blue-500); transition: width 0.4s ease; }
.demo-highlight { animation: demo-pulse 1.5s ease-in-out infinite; }
@keyframes demo-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); } 50% { box-shadow: 0 0 0 6px rgba(59,130,246,0); } }
.header__btn--demo { background: var(--blue-600); color: white; border-color: var(--blue-600); }
.header__btn--demo:hover { background: var(--blue-500); }
body.demo-active .app-main { padding-bottom: 80px; }
</style>

<body>
<div id="app"></div>
<script>
/* ========== FORMAT UTILITIES ========== */
function formatCurrency(amount) {
  if (amount === null || amount === undefined) return 'N/A';
  const abs = Math.abs(amount);
  if (abs >= 1e9) return '$' + (amount / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return '$' + (amount / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return '$' + (amount / 1e3).toFixed(2) + 'K';
  return '$' + amount.toFixed(0);
}
function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function statusLabel(s) {
  const m = { draft:'Draft', house_floor:'House Floor', house_voting:'House Voting', house_passed:'House Passed',
    house_failed:'House Failed', senate_floor:'Senate Floor', senate_voting:'Senate Voting', senate_passed:'Senate Passed',
    senate_failed:'Senate Failed', presidential_review:'Presidential Review', signed:'Signed', vetoed:'Vetoed',
    veto_override_house:'Veto Override (House)', veto_override_senate:'Veto Override (Senate)', enacted:'Enacted', failed:'Failed' };
  return m[s] || s;
}
function statusBadgeClass(s) {
  if (['enacted','signed','house_passed','senate_passed'].includes(s)) return 'badge--green';
  if (['failed','house_failed','senate_failed','vetoed'].includes(s)) return 'badge--red';
  if (['house_voting','senate_voting','veto_override_house','veto_override_senate'].includes(s)) return 'badge--amber';
  if (s === 'presidential_review') return 'badge--purple';
  if (['house_floor','senate_floor'].includes(s)) return 'badge--blue';
  return 'badge--slate';
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ========== COMPLIANCE ENGINE ========== */
function checkTransactionCompliance(tx, auth, agency, allTx) {
  const violations = [];
  const checks = [];
  if (auth.type === 'quantitative' || auth.type === 'both') {
    checks.push('Quantitative cap check');
    if (auth.amountCap !== null) {
      const spent = allTx.filter(t => t.authorizationId === auth.id && t.status === 'approved').reduce((s, t) => s + t.amount, 0);
      if (spent + tx.amount > auth.amountCap) {
        violations.push(`Exceeds authorization cap: ${formatCurrency(spent + tx.amount)} requested vs ${formatCurrency(auth.amountCap)} authorized (${formatCurrency(auth.amountCap - spent)} remaining)`);
      }
    }
  }
  if (auth.timeLimit) {
    checks.push('Time limit check');
    if (new Date(tx.timestamp) > new Date(auth.timeLimit)) {
      violations.push(`Authorization expired on ${formatDate(auth.timeLimit)}`);
    }
  }
  if (auth.categories && auth.categories.length > 0) {
    checks.push('Category restriction check');
    const validCats = auth.categories.map(c => c.label.toLowerCase());
    if (!validCats.includes(tx.category.toLowerCase())) {
      violations.push(`Category "${tx.category}" not authorized. Allowed: ${auth.categories.map(c => c.label).join(', ')}`);
    }
  }
  checks.push('Agency credit limit check');
  const agencySpent = allTx.filter(t => t.agencyId === agency.id && t.status === 'approved').reduce((s, t) => s + t.amount, 0);
  if (agencySpent + tx.amount > agency.creditLimit) {
    violations.push(`Exceeds agency credit limit: ${formatCurrency(agencySpent + tx.amount)} vs ${formatCurrency(agency.creditLimit)} limit`);
  }
  return { passed: violations.length === 0, violations, checkedAgainst: checks };
}

function checkRefinementCompliance(subcategories, auth) {
  const violations = [];
  const checks = [];
  if (auth.amountCap !== null) {
    checks.push('Subcategory total vs authorization cap');
    const total = subcategories.reduce((s, c) => s + (c.quantitativeCap || 0), 0);
    if (total > auth.amountCap) {
      violations.push(`Subcategories total ${formatCurrency(total)} exceeds authorization cap of ${formatCurrency(auth.amountCap)} by ${formatCurrency(total - auth.amountCap)}`);
    }
  }
  if (auth.restrictions && auth.restrictions.length > 0) {
    checks.push('Qualitative restriction consistency');
    for (const sub of subcategories) {
      for (const rule of (sub.qualitativeRules || [])) {
        for (const restriction of auth.restrictions) {
          const rl = rule.toLowerCase(), resl = restriction.toLowerCase();
          if ((rl.includes('allow') && resl.includes('no ')) || (rl.includes('permit') && resl.includes('prohibit'))) {
            violations.push(`Subcategory "${sub.label}" rule "${rule}" may contradict restriction "${restriction}"`);
          }
        }
      }
    }
  }
  return { passed: violations.length === 0, violations, checkedAgainst: checks };
}

function isPassed(votes) {
  if (!votes) return false;
  const houseOk = votes.houseCount && votes.houseCount.yea >= 218;
  const senateOk = votes.senateCount && votes.senateCount.yea >= 51;
  const signed = votes.presidentialAction === 'signed';
  const overridden = isVetoOverridden(votes);
  return houseOk && senateOk && (signed || overridden);
}
function isVetoOverridden(votes) {
  if (!votes || votes.presidentialAction !== 'vetoed') return false;
  if (!votes.vetoOverrideHouse || !votes.vetoOverrideSenate) return false;
  const hPresent = votes.vetoOverrideHouse.yea + votes.vetoOverrideHouse.nay + votes.vetoOverrideHouse.present;
  const sPresent = votes.vetoOverrideSenate.yea + votes.vetoOverrideSenate.nay + votes.vetoOverrideSenate.present;
  return hPresent > 0 && sPresent > 0 &&
    votes.vetoOverrideHouse.yea >= Math.ceil(hPresent * 2 / 3) &&
    votes.vetoOverrideSenate.yea >= Math.ceil(sPresent * 2 / 3);
}

/* ========== STORE ========== */
const Store = {
  _state: null,
  _listeners: [],
  getState() { return this._state; },
  dispatch(action) {
    this._state = reducer(this._state, action);
    this._persist();
    this._notify();
  },
  subscribe(fn) { this._listeners.push(fn); return () => { this._listeners = this._listeners.filter(l => l !== fn); }; },
  _notify() { this._listeners.forEach(fn => fn(this._state)); },
  _persist() { try { localStorage.setItem('fiscal-ledger-state', JSON.stringify(this._state)); } catch(e) {} },
  init() {
    try { const s = localStorage.getItem('fiscal-ledger-state'); if (s) { this._state = JSON.parse(s); return; } } catch(e) {}
    this._state = getInitialState();
  }
};

function reducer(state, action) {
  const s = JSON.parse(JSON.stringify(state));
  switch (action.type) {
    case 'SET_STATE': return action.payload;
    case 'SET_VIEW': s.currentView = action.payload; return s;
    case 'SELECT_BILL': s.selectedBillId = action.payload; return s;
    case 'SELECT_AGENCY': s.selectedAgencyId = action.payload; return s;
    case 'ADD_BILL': s.bills.push(action.payload); s.selectedBillId = action.payload.id; return s;
    case 'UPDATE_BILL': {
      const i = s.bills.findIndex(b => b.id === action.payload.id);
      if (i >= 0) Object.assign(s.bills[i], action.payload.changes);
      return s;
    }
    case 'UPDATE_BILL_STATUS': {
      const b = s.bills.find(b => b.id === action.payload.billId);
      if (b) b.status = action.payload.status;
      return s;
    }
    case 'UPDATE_VOTES': {
      const b = s.bills.find(b => b.id === action.payload.billId);
      if (b) Object.assign(b.votes, action.payload.votes);
      return s;
    }
    case 'ADD_AMENDMENT': {
      const b = s.bills.find(b => b.id === action.payload.billId);
      if (b) b.amendments.push(action.payload.amendment);
      return s;
    }
    case 'UPDATE_AMENDMENT_STATUS': {
      const b = s.bills.find(b => b.id === action.payload.billId);
      if (b) {
        const a = b.amendments.find(a => a.id === action.payload.amendmentId);
        if (a) {
          a.status = action.payload.status;
          if (action.payload.status === 'adopted') {
            for (const ch of a.changes) {
              const lines = b.text.split('\n');
              if (ch.lineNumber >= 0 && ch.lineNumber < lines.length) {
                lines[ch.lineNumber] = ch.newText;
              }
              b.text = lines.join('\n');
            }
          }
        }
      }
      return s;
    }
    case 'ADD_AUTHORIZATION': {
      const b = s.bills.find(b => b.id === action.payload.billId);
      if (b) b.authorizations.push(action.payload.authorization);
      return s;
    }
    case 'ENACT_BILL': {
      const b = s.bills.find(b => b.id === action.payload.billId);
      if (b) {
        b.status = 'enacted';
        for (const auth of b.authorizations) {
          const ag = s.agencies.find(a => a.id === auth.agencyId);
          if (ag) {
            ag.creditLimit += (auth.amountCap || 0);
            ag.authorizations.push(JSON.parse(JSON.stringify(auth)));
          }
        }
      }
      return s;
    }
    case 'ADD_REFINEMENT': s.refinements.push(action.payload); return s;
    case 'UPDATE_REFINEMENT': {
      const r = s.refinements.find(r => r.id === action.payload.id);
      if (r) Object.assign(r, action.payload.changes);
      return s;
    }
    case 'ADD_TRANSACTION': s.transactions.push(action.payload); return s;
    case 'UPDATE_TRANSACTION_STATUS': {
      const t = s.transactions.find(t => t.id === action.payload.id);
      if (t) { t.status = action.payload.status; if (action.payload.complianceCheck) t.complianceCheck = action.payload.complianceCheck; }
      return s;
    }
    default: return s;
  }
}

/* ========== VOTE ANIMATION ========== */
let voteAnimating = false;
let voteInterval = null;

function generateVoteOutcome(totalMembers, members, targetYea, variance) {
  const yea = Math.min(totalMembers, Math.max(0, targetYea + Math.floor((Math.random() - 0.5) * variance * 2)));
  const absent = Math.floor(Math.random() * Math.min(10, totalMembers * 0.05));
  const present = Math.floor(Math.random() * Math.min(5, totalMembers * 0.02));
  const nay = totalMembers - yea - absent - present;
  const outcomes = [];
  for (let i = 0; i < totalMembers; i++) {
    let vote;
    if (i < yea) vote = 'yea';
    else if (i < yea + nay) vote = 'nay';
    else if (i < yea + nay + present) vote = 'present';
    else vote = 'absent';
    const member = members[i] || { id: `gen-${i}`, name: `Member ${i + 1}`, chamber: members[0]?.chamber || 'house' };
    outcomes.push({ memberId: member.id, memberName: member.name, chamber: member.chamber, vote, timestamp: new Date().toISOString() });
  }
  // Fisher-Yates shuffle
  for (let i = outcomes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [outcomes[i], outcomes[j]] = [outcomes[j], outcomes[i]];
  }
  return outcomes;
}

function startVoteAnimation(chamber, billId, isOverride) {
  if (voteAnimating) return;
  voteAnimating = true;
  const state = Store.getState();
  const bill = state.bills.find(b => b.id === billId);
  if (!bill) { voteAnimating = false; return; }

  const isHouse = chamber === 'house';
  const totalMembers = isHouse ? 435 : 100;
  const members = isHouse ? HOUSE_MEMBERS : SENATE_MEMBERS;
  const targetYea = isHouse ? (isOverride ? 292 : 237) : (isOverride ? 68 : 55);
  const variance = isHouse ? 20 : 8;

  const outcomes = generateVoteOutcome(totalMembers, members, targetYea, variance);
  let idx = 0;
  const counts = { yea: 0, nay: 0, present: 0, absent: 0 };

  const prefix = isOverride ? `override-${chamber}` : chamber;

  voteInterval = setInterval(() => {
    if (idx >= outcomes.length) {
      clearInterval(voteInterval);
      voteAnimating = false;
      const voteUpdate = {};
      if (isOverride) {
        if (isHouse) voteUpdate.vetoOverrideHouse = { ...counts };
        else voteUpdate.vetoOverrideSenate = { ...counts };
      } else {
        if (isHouse) { voteUpdate.houseVotes = outcomes; voteUpdate.houseCount = { ...counts }; }
        else { voteUpdate.senateVotes = outcomes; voteUpdate.senateCount = { ...counts }; }
      }
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { billId, votes: voteUpdate } });

      // Auto-advance status
      if (!isOverride) {
        if (isHouse) {
          Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId, status: counts.yea >= 218 ? 'house_passed' : 'house_failed' } });
        } else {
          Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId, status: counts.yea >= 51 ? 'senate_passed' : 'senate_failed' } });
        }
      } else {
        // After override vote, check if both chambers overrode
        const st = Store.getState();
        const b = st.bills.find(b => b.id === billId);
        if (b && isVetoOverridden(b.votes)) {
          Store.dispatch({ type: 'ENACT_BILL', payload: { billId } });
        }
      }
      return;
    }
    const v = outcomes[idx];
    counts[v.vote]++;
    idx++;
    // Update DOM directly for speed
    const yeaEl = document.getElementById(`${prefix}-yea-count`);
    const nayEl = document.getElementById(`${prefix}-nay-count`);
    const otherEl = document.getElementById(`${prefix}-other-count`);
    const yeaBar = document.getElementById(`${prefix}-yea-bar`);
    const nayBar = document.getElementById(`${prefix}-nay-bar`);
    const otherBar = document.getElementById(`${prefix}-other-bar`);
    const castEl = document.getElementById(`${prefix}-cast`);
    if (yeaEl) yeaEl.textContent = counts.yea;
    if (nayEl) nayEl.textContent = counts.nay;
    if (otherEl) otherEl.textContent = counts.present + counts.absent;
    if (yeaBar) yeaBar.style.width = (counts.yea / totalMembers * 100) + '%';
    if (nayBar) nayBar.style.width = (counts.nay / totalMembers * 100) + '%';
    if (otherBar) otherBar.style.width = ((counts.present + counts.absent) / totalMembers * 100) + '%';
    if (castEl) castEl.textContent = idx;
  }, 7);
}

/* ========== VOTE TAB ========== */
function renderVoteTab(bill) {
  const v = bill.votes;
  const s = bill.status;
  const steps = getStepperState(bill);
  return `<div>
    ${renderStepper(steps)}
    ${renderVoteSection(bill, 'house', v, s)}
    ${renderVoteSection(bill, 'senate', v, s)}
    ${renderPresidentialSection(bill, v, s)}
    ${v.presidentialAction === 'vetoed' ? renderOverrideSection(bill, v, s) : ''}
    ${s === 'signed' || (s === 'enacted' && v.presidentialAction === 'signed') ? '<div class="alert alert--success mt-4"><strong>Bill Enacted.</strong> All authorizations are now active. View them in the Agency Spending dashboard.</div>' : ''}
    ${s === 'enacted' && isVetoOverridden(v) ? '<div class="alert alert--success mt-4"><strong>Veto Overridden — Bill Enacted.</strong> Both chambers achieved 2/3 supermajority. Authorizations are now active.</div>' : ''}
  </div>`;
}

function getStepperState(bill) {
  const s = bill.status;
  const steps = [
    { label: 'House Vote', state: 'pending' },
    { label: 'Senate Vote', state: 'pending' },
    { label: 'Presidential', state: 'pending' },
    { label: 'Enacted', state: 'pending' }
  ];
  const idx = ['draft','house_floor','house_voting'].includes(s) ? 0 :
    ['house_passed','house_failed','senate_floor','senate_voting'].includes(s) ? 1 :
    ['senate_passed','senate_failed','presidential_review','signed','vetoed','veto_override_house','veto_override_senate'].includes(s) ? 2 :
    s === 'enacted' ? 3 : 0;
  for (let i = 0; i < 4; i++) {
    if (i < idx) steps[i].state = 'done';
    else if (i === idx) steps[i].state = 'active';
  }
  if (s === 'enacted') steps[3].state = 'done';
  if (['house_failed','failed'].includes(s)) { steps[0].state = 'failed'; steps[1].state = 'pending'; steps[2].state = 'pending'; steps[3].state = 'pending'; }
  if (s === 'senate_failed') { steps[0].state = 'done'; steps[1].state = 'failed'; }
  return steps;
}

function renderStepper(steps) {
  return `<div class="stepper">${steps.map((st, i) => `
    ${i > 0 ? `<div class="stepper__line ${st.state === 'done' || (steps[i-1] && steps[i-1].state === 'done') ? 'stepper__line--done' : ''}"></div>` : ''}
    <div class="stepper__node">
      <div class="stepper__circle stepper__circle--${st.state}">${st.state === 'done' ? '&#10003;' : st.state === 'failed' ? '&#10007;' : (i+1)}</div>
      <div class="stepper__text stepper__text--${st.state}">${st.label}</div>
    </div>
  `).join('')}</div>`;
}

function renderVoteSection(bill, chamber, votes, status) {
  const isHouse = chamber === 'house';
  const total = isHouse ? 435 : 100;
  const threshold = isHouse ? 218 : 51;
  const label = isHouse ? 'House of Representatives' : 'United States Senate';
  const count = isHouse ? votes.houseCount : votes.senateCount;
  const cast = count ? count.yea + count.nay + count.present + count.absent : 0;
  const canVote = isHouse ?
    ['draft','house_floor','house_voting'].includes(status) :
    ['house_passed','senate_floor','senate_voting'].includes(status);
  const passed = isHouse ? (count && count.yea >= 218) : (count && count.yea >= 51);
  const voteDone = cast >= total;

  return `<div class="card mb-4">
    <div class="card__header"><h3>${label}</h3><span class="text-sm text-muted"><span id="${chamber}-cast">${cast}</span> / ${total} votes cast</span></div>
    <div class="card__body">
      <div class="tally">
        <div class="tally__counts">
          <span style="color:var(--green-600)">Yea: <span id="${chamber}-yea-count">${count ? count.yea : 0}</span></span>
          <span style="color:var(--red-600)">Nay: <span id="${chamber}-nay-count">${count ? count.nay : 0}</span></span>
          <span style="color:var(--slate-500)">Other: <span id="${chamber}-other-count">${count ? count.present + count.absent : 0}</span></span>
        </div>
        <div class="tally__bar">
          <div class="tally__yea" id="${chamber}-yea-bar" style="width:${count ? count.yea/total*100 : 0}%"></div>
          <div class="tally__nay" id="${chamber}-nay-bar" style="width:${count ? count.nay/total*100 : 0}%"></div>
          <div class="tally__other" id="${chamber}-other-bar" style="width:${count ? (count.present+count.absent)/total*100 : 0}%"></div>
          <div class="tally__threshold" style="left:${threshold/total*100}%"><span class="tally__threshold-label">${threshold}</span></div>
        </div>
      </div>
      ${voteDone ? `<div class="alert ${passed ? 'alert--success' : 'alert--error'}">${passed ? 'PASSED' : 'FAILED'}: ${count.yea} yea, ${count.nay} nay (${threshold} needed)</div>` : ''}
      ${canVote && !voteDone ? `<button class="btn btn--primary" data-action="simulate-vote" data-chamber="${chamber}" data-bill-id="${bill.id}" ${voteAnimating ? 'disabled' : ''}>Simulate ${isHouse ? 'House' : 'Senate'} Vote</button>` : ''}
    </div>
  </div>`;
}

function renderPresidentialSection(bill, votes, status) {
  if (!['senate_passed','presidential_review','signed','vetoed','veto_override_house','veto_override_senate','enacted'].includes(status)) return '';
  return `<div class="card mb-4">
    <div class="card__header"><h3>Presidential Action</h3></div>
    <div class="card__body">
      ${votes.presidentialAction === 'signed' ? '<div class="alert alert--success"><strong>President Signed</strong> the bill into law.</div>' : ''}
      ${votes.presidentialAction === 'vetoed' ? '<div class="alert alert--error"><strong>President Vetoed</strong> the bill.</div>' : ''}
      ${!votes.presidentialAction || votes.presidentialAction === 'pending' ? `<p class="mb-4 text-sm">The bill has passed both chambers. The President must now sign or veto.</p>
        <div class="flex gap-2">
          <button class="btn btn--success" data-action="sign-bill" data-bill-id="${bill.id}">Sign into Law</button>
          <button class="btn btn--danger" data-action="veto-bill" data-bill-id="${bill.id}">Veto</button>
        </div>` : ''}
    </div>
  </div>`;
}

function renderOverrideSection(bill, votes, status) {
  const chambers = [
    { key: 'house', label: 'House Override Vote', total: 435, count: votes.vetoOverrideHouse, prefix: 'override-house' },
    { key: 'senate', label: 'Senate Override Vote', total: 100, count: votes.vetoOverrideSenate, prefix: 'override-senate' }
  ];
  return chambers.map(ch => {
    const count = ch.count;
    const cast = count ? count.yea + count.nay + count.present + count.absent : 0;
    const voteDone = cast >= ch.total;
    const present = count ? count.yea + count.nay + count.present : 0;
    const threshold = present > 0 ? Math.ceil(present * 2 / 3) : Math.ceil(ch.total * 2 / 3);
    const passed = count && count.yea >= threshold;
    const canVote = ch.key === 'house' ? ['vetoed','veto_override_house'].includes(status) && !votes.vetoOverrideHouse :
      ['veto_override_house','veto_override_senate'].includes(status) && votes.vetoOverrideHouse && !votes.vetoOverrideSenate;

    return `<div class="card mb-4">
      <div class="card__header"><h3>${ch.label} (2/3 required)</h3><span class="text-sm text-muted"><span id="${ch.prefix}-cast">${cast}</span> / ${ch.total} votes cast</span></div>
      <div class="card__body">
        <div class="tally">
          <div class="tally__counts">
            <span style="color:var(--green-600)">Yea: <span id="${ch.prefix}-yea-count">${count ? count.yea : 0}</span></span>
            <span style="color:var(--red-600)">Nay: <span id="${ch.prefix}-nay-count">${count ? count.nay : 0}</span></span>
            <span style="color:var(--slate-500)">Other: <span id="${ch.prefix}-other-count">${count ? count.present + count.absent : 0}</span></span>
          </div>
          <div class="tally__bar">
            <div class="tally__yea" id="${ch.prefix}-yea-bar" style="width:${count ? count.yea/ch.total*100 : 0}%"></div>
            <div class="tally__nay" id="${ch.prefix}-nay-bar" style="width:${count ? count.nay/ch.total*100 : 0}%"></div>
            <div class="tally__other" id="${ch.prefix}-other-bar" style="width:${count ? (count.present+count.absent)/ch.total*100 : 0}%"></div>
            <div class="tally__threshold" style="left:66.7%"><span class="tally__threshold-label">2/3</span></div>
          </div>
        </div>
        ${voteDone ? `<div class="alert ${passed ? 'alert--success' : 'alert--error'}">${passed ? 'OVERRIDE PASSED' : 'OVERRIDE FAILED'}: ${count.yea} yea, ${count.nay} nay (${threshold} needed)</div>` : ''}
        ${canVote && !voteDone ? `<button class="btn btn--primary" data-action="simulate-override" data-chamber="${ch.key}" data-bill-id="${bill.id}" ${voteAnimating ? 'disabled' : ''}>Simulate ${ch.key === 'house' ? 'House' : 'Senate'} Override</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ========== COMMITTEE VIEW ========== */

function renderRefinementPanel(auth, bill, agency, state) {

  return `<div class="content-inner">
    <h2 style="font-size:18px;font-weight:700;margin-bottom:4px;">Committee Refinement</h2>
    <p class="text-sm text-muted mb-4">Break down broad authorization into specific spending subcategories.</p>
    <div class="card mb-4">
      <div class="card__header"><h3>Original Authorization</h3></div>
      <div class="card__body">
        <div class="flex justify-between mb-2"><span><span class="color-dot" style="background:${auth.color};margin-right:6px;"></span><strong>${agency ? agency.name : auth.agencyId}</strong></span><strong>${formatCurrency(auth.amountCap)}</strong></div>
        <p class="text-sm text-muted mb-2">Expires: ${formatDate(auth.timeLimit)}</p>
        <div class="section-title" style="margin-top:12px;">Existing Categories</div>
        <div class="flex flex-wrap gap-1">${auth.categories.map(c => `<span class="badge badge--slate">${escHtml(c.label)}: ${formatCurrency(c.quantitativeCap)}</span>`).join('')}</div>
        ${auth.restrictions.length ? `<div class="section-title" style="margin-top:12px;">Restrictions</div><ul class="text-sm text-muted" style="margin-left:16px;list-style:disc;">${auth.restrictions.map(r => `<li>${escHtml(r)}</li>`).join('')}</ul>` : ''}
      </div>
    </div>
    ${existing.filter(r => r.status === 'approved').map(r => `<div class="alert alert--success mb-2"><strong>Approved Refinement</strong> by ${escHtml(r.committeeName)} — ${r.subcategories.length} subcategories defined, ${r.signatories.length} signatures collected.</div>`).join('')}
    <div class="card">
      <div class="card__header"><h3>New Refinement</h3><button class="btn btn--outline btn--sm" data-action="add-subcategory">+ Add Subcategory</button></div>
      <div class="card__body">
        <div class="form-group"><label class="form-label">Committee Name</label><input class="form-input" id="ref-committee" placeholder="e.g. Senate Appropriations" value="${escHtml(fs.committeeName)}"></div>
        <div class="section-title">Subcategories</div>
        ${fs.subcategories.length === 0 ? '<p class="text-sm text-muted mb-4">Add subcategories to refine this authorization.</p>' : ''}
        ${fs.subcategories.map((sc, i) => `<div class="card mb-2" style="padding:10px;background:var(--slate-50);">
          <div class="form-row">
            <div class="form-group"><label class="form-label">Label</label><input class="form-input subcat-label" data-idx="${i}" value="${escHtml(sc.label)}"></div>
            <div class="form-group"><label class="form-label">Cap ($)</label><input class="form-input subcat-cap" data-idx="${i}" type="number" value="${sc.quantitativeCap || ''}"></div>
            <div style="padding-top:20px;"><button class="btn btn--danger btn--xs" data-action="remove-subcategory" data-idx="${i}">Remove</button></div>
          </div>
          <div class="form-group"><label class="form-label">Qualitative Rules (one per line)</label><textarea class="form-textarea subcat-rules" data-idx="${i}" rows="2">${escHtml((sc.qualitativeRules || []).join('\n'))}</textarea></div>
        </div>`).join('')}
        <div class="section-title mt-4">Multi-Signature Requirements</div>
        <div class="form-group"><label class="form-label">Required Signatures</label><input class="form-input" id="ref-req-sigs" type="number" min="1" value="${fs.requiredSigs}" style="width:80px;"></div>
        <div class="form-inline mb-2"><input class="form-input" id="ref-new-sig" placeholder="Signatory name..."><button class="btn btn--outline btn--sm" data-action="add-signatory">Add</button></div>
        ${fs.signatories.map((sig, i) => `<div class="sig-check"><input type="checkbox" checked disabled> <span>${escHtml(sig)}</span> <button class="btn btn--danger btn--xs" data-action="remove-signatory" data-idx="${i}">&times;</button></div>`).join('')}
        ${fs.complianceResult ? `<div class="alert ${fs.complianceResult.passed ? 'alert--success' : 'alert--error'} mt-4">
          <strong>Compliance Check: ${fs.complianceResult.passed ? 'PASSED' : 'FAILED'}</strong>
          ${fs.complianceResult.violations.length ? `<ul>${fs.complianceResult.violations.map(v => `<li>${escHtml(v)}</li>`).join('')}</ul>` : ''}
          <div class="text-xs mt-2 text-muted">Checked: ${fs.complianceResult.checkedAgainst.join(', ')}</div>
        </div>` : ''}
        <div class="flex gap-2 mt-4">
          <button class="btn btn--outline" data-action="run-compliance" data-auth-id="${auth.id}">Run Compliance Check</button>
          <button class="btn btn--primary" data-action="submit-refinement" data-auth-id="${auth.id}" ${!fs.complianceResult || !fs.complianceResult.passed || fs.signatories.length < fs.requiredSigs ? 'disabled' : ''}>Submit Refinement</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ========== AGENCY VIEW ========== */
function renderAgency(state) {
  const funded = state.agencies.filter(a => a.creditLimit > 0);
  const selected = funded.find(a => a.id === state.selectedAgencyId) || (funded.length === 1 ? funded[0] : null);
  return `<div class="split-view">
    <div class="sidebar">
      <div class="sidebar-header"><h2>Funded Agencies</h2></div>
      ${funded.length === 0 ? '<div class="text-sm text-muted" style="padding:20px;">No funded agencies. Enact legislation first to fund agencies.</div>' : ''}
      ${funded.map(a => {
        const spent = state.transactions.filter(t => t.agencyId === a.id && t.status === 'approved').reduce((s, t) => s + t.amount, 0);
        const pct = a.creditLimit > 0 ? (spent / a.creditLimit * 100).toFixed(1) : 0;
        return `<div class="sidebar-item ${a.id === (selected?.id) ? 'sidebar-item--selected' : ''}" data-action="select-agency" data-agency-id="${a.id}">
          <div class="sidebar-item__title">${a.abbreviation} — ${a.name}</div>
          <div class="sidebar-item__meta mb-2"><span>${formatCurrency(a.creditLimit)} authorized</span></div>
          <div class="progress"><div class="progress__fill" style="width:${pct}%;background:${pct > 80 ? 'var(--red-500)' : pct > 50 ? 'var(--amber-500)' : 'var(--green-500)'}"></div></div>
          <div class="text-xs text-muted mt-2">${formatCurrency(spent)} spent (${pct}%)</div>
        </div>`;
      }).join('')}
    </div>
    <div class="content">
      ${selected ? renderAgencyDashboard(selected, state) : '<div class="empty-state"><p>Select an agency to view spending dashboard</p></div>'}
    </div>
  </div>`;
}

function renderAgencyDashboard(agency, state) {
  const txs = state.transactions.filter(t => t.agencyId === agency.id);
  const spent = txs.filter(t => t.status === 'approved').reduce((s, t) => s + t.amount, 0);
  const remaining = agency.creditLimit - spent;
  const pct = agency.creditLimit > 0 ? (spent / agency.creditLimit * 100).toFixed(1) : 0;
  const fs = formState.transaction;
  const auths = agency.authorizations || [];

  return `<div class="content-inner">
    <h2 style="font-size:18px;font-weight:700;margin-bottom:4px;">${agency.name}</h2>
    <p class="text-sm text-muted mb-4">${agency.abbreviation}</p>
    <div class="card mb-4">
      <div class="card__header"><h3>Credit Overview</h3></div>
      <div class="card__body">
        <div class="credit-bar">
          <div class="credit-bar__header"><span class="credit-bar__label">Total Utilization</span><span class="credit-bar__value">${formatCurrency(spent)} / ${formatCurrency(agency.creditLimit)}</span></div>
          <div class="credit-bar__track"><div class="credit-bar__fill" style="width:${pct}%;background:${pct > 80 ? 'var(--red-500)' : pct > 50 ? 'var(--amber-500)' : 'var(--blue-600)'}"></div><span class="credit-bar__pct">${pct}%</span></div>
        </div>
        <div class="flex justify-between text-sm mt-2"><span>Remaining: <strong>${formatCurrency(remaining)}</strong></span></div>
      </div>
    </div>
    ${auths.length > 0 ? `<div class="card mb-4"><div class="card__header"><h3>Authorization Breakdown</h3></div><div class="card__body">
      ${auths.map(a => {
        const authSpent = txs.filter(t => t.authorizationId === a.id && t.status === 'approved').reduce((s, t) => s + t.amount, 0);
        const authPct = a.amountCap > 0 ? (authSpent / a.amountCap * 100).toFixed(1) : 0;
        return `<div class="auth-card mb-2" style="border-left-color:${a.color}">
          <div class="auth-card__header"><span class="auth-card__title"><span class="color-dot" style="background:${a.color};margin-right:6px;"></span>${formatCurrency(a.amountCap)} authorization</span><span class="text-sm">${authPct}% used</span></div>
          <div class="progress mb-2"><div class="progress__fill" style="width:${authPct}%;background:${a.color}"></div></div>
          <div class="auth-card__categories">${a.categories.map(c => {
            const catSpent = txs.filter(t => t.authorizationId === a.id && t.category === c.label && t.status === 'approved').reduce((s, t) => s + t.amount, 0);
            return `<span class="badge badge--slate">${escHtml(c.label)}: ${formatCurrency(catSpent)}/${formatCurrency(c.quantitativeCap)}</span>`;
          }).join('')}</div>
        </div>`;
      }).join('')}
    </div></div>` : ''}
    <div class="card mb-4">
      <div class="card__header"><h3>New Transaction</h3></div>
      <div class="card__body">
        <div class="form-row">
          <div class="form-group"><label class="form-label">Authorization</label>
            <select class="form-select" id="tx-auth">${auths.length === 0 ? '<option>No authorizations</option>' : `<option value="">Select...</option>${auths.map(a => `<option value="${a.id}" ${fs.authId === a.id ? 'selected' : ''}>${formatCurrency(a.amountCap)} (${a.categories.map(c=>c.label).join(', ')})</option>`).join('')}`}</select>
          </div>
          <div class="form-group"><label class="form-label">Category</label>
            <select class="form-select" id="tx-category">${(() => {
              const selA = auths.find(a => a.id === fs.authId);
              if (!selA) return '<option value="">Select authorization first</option>';
              return selA.categories.map(c => `<option value="${escHtml(c.label)}" ${fs.category === c.label ? 'selected' : ''}>${escHtml(c.label)}</option>`).join('');
            })()}</select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Amount ($)</label><input class="form-input" id="tx-amount" type="number" placeholder="e.g. 50000000" value="${fs.amount}"></div>
          <div class="form-group"><label class="form-label">Description</label><input class="form-input" id="tx-desc" placeholder="What is this spending for?" value="${escHtml(fs.description)}"></div>
        </div>
        <button class="btn btn--primary" data-action="submit-transaction" data-agency-id="${agency.id}">Submit Transaction</button>
      </div>
    </div>
    ${renderTransactionLog(txs, auths)}
  </div>`;
}

function renderTransactionLog(txs, auths) {
  if (txs.length === 0) return '<div class="card"><div class="card__body text-sm text-muted">No transactions yet.</div></div>';
  const sorted = [...txs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  return `<div class="card card--flush">
    <div class="card__header"><h3>Transaction Log</h3></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Timestamp</th><th>Category</th><th>Amount</th><th>Status</th><th>Description</th></tr></thead>
      <tbody>
        ${sorted.map(tx => {
          const statusBadge = tx.status === 'approved' ? 'badge--green' : tx.status === 'rejected' ? 'badge--red' : tx.status === 'flagged' ? 'badge--orange' : 'badge--amber';
          const isExpanded = formState.expandedTxId === tx.id;
          return `<tr style="cursor:pointer;" data-action="toggle-tx" data-tx-id="${tx.id}">
            <td class="text-sm">${formatDate(tx.timestamp)}</td>
            <td><span class="badge badge--slate">${escHtml(tx.category)}</span></td>
            <td class="text-right"><strong>${formatCurrency(tx.amount)}</strong></td>
            <td><span class="badge ${statusBadge}">${tx.status}</span></td>
            <td class="text-sm">${escHtml(tx.description)}</td>
          </tr>
          ${isExpanded && tx.complianceCheck ? `<tr class="expanded-row"><td colspan="5"><div class="compliance-detail">
            <strong>Compliance: ${tx.complianceCheck.passed ? 'PASSED' : 'FAILED'}</strong>
            ${tx.complianceCheck.violations.length ? `<ul>${tx.complianceCheck.violations.map(v => `<li style="color:var(--red-600)">${escHtml(v)}</li>`).join('')}</ul>` : ''}
            <div class="text-xs text-muted mt-2">Checked: ${tx.complianceCheck.checkedAgainst.join(', ')}</div>
          </div></td></tr>` : ''}`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

/* ========== EVENT HANDLING ========== */
function mountHandlers(state) {
  document.getElementById('app').onclick = function(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    handleAction(action, target.dataset, state);
  };
  // Capture changes for form inputs
  document.getElementById('app').onchange = function(e) {
    const t = e.target;
    if (t.id === 'tx-auth') { formState.transaction.authId = t.value; formState.transaction.category = ''; render(); }
    if (t.id === 'tx-category') formState.transaction.category = t.value;
    if (t.id === 'new-auth-agency') formState.newAuth.agencyId = t.value;
  };
  document.getElementById('app').oninput = function(e) {
    const t = e.target;
    if (t.id === 'new-bill-title') formState.newBill.title = t.value;
    if (t.id === 'new-bill-sponsor') formState.newBill.sponsor = t.value;
    if (t.id === 'new-auth-amount') formState.newAuth.amountCap = t.value;
    if (t.id === 'new-auth-time') formState.newAuth.timeLimit = t.value;
    if (t.id === 'new-auth-restrictions') formState.newAuth.restrictions = t.value;
    if (t.id === 'amend-author') formState.newAmendment.author = t.value;
    if (t.id === 'amend-desc') formState.newAmendment.description = t.value;
    if (t.id === 'amend-old') formState.newAmendment.oldText = t.value;
    if (t.id === 'amend-new') formState.newAmendment.newText = t.value;
    if (t.id === 'amend-line') formState.newAmendment.lineNumber = parseInt(t.value) || 0;
    if (t.id === 'tx-amount') formState.transaction.amount = t.value;
    if (t.id === 'tx-desc') formState.transaction.description = t.value;
    if (t.id === 'ref-committee') formState.refinement.committeeName = t.value;
    if (t.id === 'ref-req-sigs') formState.refinement.requiredSigs = parseInt(t.value) || 1;
    if (t.classList.contains('subcat-label')) { formState.refinement.subcategories[t.dataset.idx].label = t.value; }
    if (t.classList.contains('subcat-cap')) { formState.refinement.subcategories[t.dataset.idx].quantitativeCap = parseFloat(t.value) || 0; }
    if (t.classList.contains('subcat-rules')) { formState.refinement.subcategories[t.dataset.idx].qualitativeRules = t.value.split('\n').filter(Boolean); }
  };
}

function handleAction(action, data, state) {
  switch (action) {
    case 'set-view':
      Store.dispatch({ type: 'SET_VIEW', payload: data.view });
      break;
    case 'select-bill':
      Store.dispatch({ type: 'SELECT_BILL', payload: data.billId });
      break;
    case 'select-agency':
      Store.dispatch({ type: 'SELECT_AGENCY', payload: data.agencyId });
      break;
    case 'toggle-new-bill':
      formState.newBill.visible = !formState.newBill.visible;
      render();
      break;
    case 'create-bill': {
      if (!formState.newBill.title.trim()) return;
      const bill = {
        id: 'bill-' + uid(), title: formState.newBill.title.trim(), status: 'draft',
        sponsor: formState.newBill.sponsor.trim() || 'Unknown', introducedDate: new Date().toISOString().slice(0, 10),
        text: '', authorizations: [], amendments: [],
        votes: { billId: '', houseVotes: [], senateVotes: [], houseCount: {yea:0,nay:0,present:0,absent:0}, senateCount: {yea:0,nay:0,present:0,absent:0}, presidentialAction: null, vetoOverrideHouse: null, vetoOverrideSenate: null }
      };
      bill.votes.billId = bill.id;
      formState.newBill = { title: '', sponsor: '', visible: false };
      Store.dispatch({ type: 'ADD_BILL', payload: bill });
      break;
    }
    case 'set-tab':
      formState.activeTab = data.tab;
      render();
      break;
    case 'toggle-new-auth':
      formState.newAuth.visible = !formState.newAuth.visible;
      render();
      break;
    case 'set-auth-color':
      formState.newAuth.color = data.color;
      render();
      break;
    case 'create-auth': {
      if (!formState.newAuth.agencyId || !formState.newAuth.amountCap) return;
      const auth = {
        id: 'auth-' + uid(), billId: state.selectedBillId, agencyId: formState.newAuth.agencyId,
        type: 'both', amountCap: parseFloat(formState.newAuth.amountCap), timeLimit: formState.newAuth.timeLimit || null,
        restrictions: formState.newAuth.restrictions.split('\n').filter(Boolean),
        categories: [], color: formState.newAuth.color
      };
      formState.newAuth = { agencyId: '', amountCap: '', timeLimit: '', restrictions: '', type: 'both', color: '#2563eb', visible: false };
      Store.dispatch({ type: 'ADD_AUTHORIZATION', payload: { billId: state.selectedBillId, authorization: auth } });
      break;
    }
    case 'toggle-new-amendment':
      formState.newAmendment.visible = !formState.newAmendment.visible;
      render();
      break;
    case 'create-amendment': {
      const amend = {
        id: 'amend-' + uid(), billId: data.billId, author: formState.newAmendment.author || 'Anonymous',
        timestamp: new Date().toISOString(), description: formState.newAmendment.description,
        changes: [{ lineNumber: formState.newAmendment.lineNumber, oldText: formState.newAmendment.oldText, newText: formState.newAmendment.newText }],
        status: 'proposed'
      };
      formState.newAmendment = { author: '', description: '', oldText: '', newText: '', lineNumber: 0, visible: false };
      Store.dispatch({ type: 'ADD_AMENDMENT', payload: { billId: data.billId, amendment: amend } });
      break;
    }
    case 'adopt-amendment':
      Store.dispatch({ type: 'UPDATE_AMENDMENT_STATUS', payload: { billId: data.billId, amendmentId: data.amendmentId, status: 'adopted' } });
      break;
    case 'reject-amendment':
      Store.dispatch({ type: 'UPDATE_AMENDMENT_STATUS', payload: { billId: data.billId, amendmentId: data.amendmentId, status: 'rejected' } });
      break;
    case 'simulate-vote':
      Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId: data.billId, status: data.chamber === 'house' ? 'house_voting' : 'senate_voting' } });
      setTimeout(() => startVoteAnimation(data.chamber, data.billId, false), 50);
      break;
    case 'simulate-override':
      if (!Store.getState().bills.find(b => b.id === data.billId).votes.vetoOverrideHouse && data.chamber === 'house') {
        Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId: data.billId, status: 'veto_override_house' } });
      } else if (data.chamber === 'senate') {
        Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId: data.billId, status: 'veto_override_senate' } });
      }
      setTimeout(() => startVoteAnimation(data.chamber, data.billId, true), 50);
      break;
    case 'sign-bill':
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { billId: data.billId, votes: { presidentialAction: 'signed' } } });
      Store.dispatch({ type: 'ENACT_BILL', payload: { billId: data.billId } });
      break;
    case 'veto-bill':
      Store.dispatch({ type: 'UPDATE_VOTES', payload: { billId: data.billId, votes: { presidentialAction: 'vetoed' } } });
      Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId: data.billId, status: 'vetoed' } });
      break;
    case 'select-auth-refinement':
      formState.selectedAuthForRefinement = data.authId;
      formState.refinement = { subcategories: [], committeeName: '', requiredSigs: 1, signatories: [], complianceResult: null, visible: false };
      render();
      break;
    case 'add-subcategory':
      formState.refinement.subcategories.push({ id: 'sc-' + uid(), label: '', parentCategory: null, quantitativeCap: 0, qualitativeRules: [] });
      render();
      break;
    case 'remove-subcategory':
      formState.refinement.subcategories.splice(parseInt(data.idx), 1);
      render();
      break;
    case 'add-signatory': {
      const sigInput = document.getElementById('ref-new-sig');
      if (sigInput && sigInput.value.trim()) {
        formState.refinement.signatories.push(sigInput.value.trim());
        render();
      }
      break;
    }
    case 'remove-signatory':
      formState.refinement.signatories.splice(parseInt(data.idx), 1);
      render();
      break;
    case 'run-compliance': {
      const st = Store.getState();
      let auth = null;
      for (const b of st.bills) { auth = b.authorizations.find(a => a.id === data.authId); if (auth) break; }
      if (auth) {
        formState.refinement.complianceResult = checkRefinementCompliance(formState.refinement.subcategories, auth);
      }
      render();
      break;
    }
    case 'submit-refinement': {
      const ref = {
        id: 'ref-' + uid(), authorizationId: data.authId, committeeId: 'committee-' + uid(),
        committeeName: formState.refinement.committeeName || 'Unnamed Committee',
        subcategories: JSON.parse(JSON.stringify(formState.refinement.subcategories)),
        signatories: [...formState.refinement.signatories],
        requiredSignatures: formState.refinement.requiredSigs,
        status: 'approved'
      };
      formState.refinement = { subcategories: [], committeeName: '', requiredSigs: 1, signatories: [], complianceResult: null, visible: false };
      Store.dispatch({ type: 'ADD_REFINEMENT', payload: ref });
      break;
    }
    case 'submit-transaction': {
      const st = Store.getState();
      const agency = st.agencies.find(a => a.id === data.agencyId);
      if (!agency) return;
      const authId = formState.transaction.authId;
      const auth = agency.authorizations.find(a => a.id === authId);
      if (!auth || !formState.transaction.amount || !formState.transaction.category) return;
      const tx = {
        id: 'tx-' + uid(), agencyId: agency.id, authorizationId: authId,
        amount: parseFloat(formState.transaction.amount), category: formState.transaction.category,
        description: formState.transaction.description || '', timestamp: new Date().toISOString(),
        status: 'pending', complianceCheck: { passed: true, violations: [], checkedAgainst: [] }
      };
      const compliance = checkTransactionCompliance(tx, auth, agency, st.transactions);
      tx.complianceCheck = compliance;
      tx.status = compliance.passed ? 'approved' : 'rejected';
      formState.transaction = { authId: '', category: '', amount: '', description: '' };
      Store.dispatch({ type: 'ADD_TRANSACTION', payload: tx });
      break;
    }
    case 'toggle-tx':
      formState.expandedTxId = formState.expandedTxId === data.txId ? null : data.txId;
      render();
      break;
    case 'export-state': {
      const blob = new Blob([JSON.stringify(Store.getState(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `fiscal-ledger-${new Date().toISOString().slice(0,10)}.json`;
      a.click(); URL.revokeObjectURL(url);
      break;
    }
    case 'import-state': {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => { try { Store.dispatch({ type: 'SET_STATE', payload: JSON.parse(ev.target.result) }); } catch(err) { alert('Invalid state file.'); } };
        reader.readAsText(file);
      };
      input.click();
      break;
    }
    case 'reset-demo':
      if (confirm('Reset all data to defaults? This cannot be undone.')) {
        localStorage.removeItem('fiscal-ledger-state');
        formState.activeTab = 'authorizations';
        formState.selectedAuthForRefinement = null;
        formState.expandedTxId = null;
        Store._state = getInitialState();
        Store._notify();
      }
      break;
    case 'start-guided-demo':
      startGuidedDemo();
      break;
    case 'demo-next':
      if (window._demoResolve) window._demoResolve();
      break;
    case 'demo-stop':
      stopGuidedDemo();
      break;
  }
}

/* ========== GUIDED DEMO ENGINE ========== */
let _demoRunning = false;
let _demoAborted = false;

function stopGuidedDemo() {
  _demoRunning = false;
  _demoAborted = true;
  if (window._demoResolve) window._demoResolve();
  document.body.classList.remove('demo-active');
  const bar = document.getElementById('demo-bar');
  if (bar) bar.remove();
  render();
}

function demoWaitForClick(stepLabel, stepNum, totalSteps, message) {
  return new Promise(resolve => {
    if (_demoAborted) { resolve(); return; }
    window._demoResolve = resolve;
    updateDemoBar(stepLabel, stepNum, totalSteps, message, false);
  });
}

function demoWait(ms) {
  return new Promise(resolve => {
    if (_demoAborted) { resolve(); return; }
    setTimeout(resolve, ms);
  });
}

function demoWaitForVote() {
  return new Promise(resolve => {
    if (_demoAborted) { resolve(); return; }
    const check = setInterval(() => {
      if (!voteAnimating || _demoAborted) { clearInterval(check); resolve(); }
    }, 100);
  });
}

function updateDemoBar(stepLabel, stepNum, totalSteps, message, waiting) {
  let bar = document.getElementById('demo-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'demo-bar';
    bar.className = 'demo-bar';
    document.body.appendChild(bar);
  }
  const pct = ((stepNum) / totalSteps * 100).toFixed(1);
  bar.innerHTML = `<div class="demo-bar__progress" style="width:${pct}%"></div>
    <div class="demo-bar__inner">
      <div class="demo-bar__step">Step ${stepNum}/${totalSteps}</div>
      <div class="demo-bar__text">${message}</div>
      <div class="demo-bar__actions">
        ${waiting ? '<span class="text-sm text-muted" style="color:var(--slate-400);white-space:nowrap;">Processing...</span>' : `<button class="demo-bar__btn demo-bar__btn--next" data-action="demo-next">Next &rarr;</button>`}
        <button class="demo-bar__btn demo-bar__btn--skip" data-action="demo-stop">Exit Demo</button>
      </div>
    </div>`;
  bar.onclick = function(e) {
    const t = e.target.closest('[data-action]');
    if (t) handleAction(t.dataset.action, t.dataset, Store.getState());
  };
}

async function startGuidedDemo() {
  if (_demoRunning) return;
  _demoRunning = true;
  _demoAborted = false;

  // Reset to clean state
  localStorage.removeItem('fiscal-ledger-state');
  formState.activeTab = 'authorizations';

  formState.expandedTxId = null;
  formState.newBill = { title: '', sponsor: '', visible: false };

  formState.transaction = { authId: '', category: '', amount: '', description: '' };

  Store._notify();
  document.body.classList.add('demo-active');

  const T = 34; // total steps
  const billId = 'bill-001';

  // Helper to bail early
  function ab() { return _demoAborted; }

  // ===== PHASE 1: LEGISLATIVE =====
  await demoWaitForClick('Legislative', 1, T,
    'Welcome to the <strong>Congressional Fiscal Ledger</strong> demo. This guided tour walks through the full lifecycle: from drafting legislation, to committee refinement, to agency spending. Click <strong>Next</strong> to begin.');

  // Step 2: Select bill

    'We start in the <strong>Legislative Dashboard</strong>. Two sample bills are pre-loaded. We\'ve selected the <strong>Congressional Infrastructure & Innovation Act</strong> — a $10B bill funding DOT, DOE, and NSF.');
  if (ab()) return;

  // Step 3: Show authorizations
  formState.activeTab = 'authorizations';
  render();
  await demoWaitForClick('Authorizations', 3, T,
    'The <strong>Authorizations tab</strong> shows three color-coded spending authorizations: <strong>$5B to DOT</strong> (blue), <strong>$3B to DOE</strong> (green), and <strong>$2B to NSF</strong> (orange). Each has specific categories, caps, and qualitative restrictions.');
  if (ab()) return;

  // Step 4: Propose an amendment
  formState.activeTab = 'amendments';
  render();
  await demoWaitForClick('Amendments', 4, T,
    'Switching to the <strong>Amendments tab</strong>. Legislators can propose wiki-style amendments that show a diff of the original vs. proposed text. Let\'s add one now.');
  if (ab()) return;

  // Step 5: Create amendment
  const amendId = 'amend-demo-' + uid();
  Store.dispatch({ type: 'ADD_AMENDMENT', payload: { billId, amendment: {
    id: amendId, billId, author: 'Rep. Rashida Tlaib [D-MI]', timestamp: new Date().toISOString(),
    description: 'Increase rural connectivity allocation from $500M to $750M to address broadband gaps in underserved areas',
    changes: [{ lineNumber: 13, oldText: '  (4) Rural connectivity: up to $500,000,000', newText: '  (4) Rural connectivity: up to $750,000,000' }],
    status: 'proposed'
  }}});
  render();
  await demoWaitForClick('Amendments', 5, T,
    'Rep. Tlaib proposed an amendment to <strong>increase rural connectivity funding from $500M to $750M</strong>. The diff view shows the exact text change. Amendments can be adopted or rejected.');
  if (ab()) return;

  // Step 6: Adopt the amendment
  Store.dispatch({ type: 'UPDATE_AMENDMENT_STATUS', payload: { billId, amendmentId: amendId, status: 'adopted' } });
  render();
  await demoWaitForClick('Amendments', 6, T,
    'The amendment was <strong>adopted</strong>. The bill text is now updated with the new rural connectivity figure. In a real system, this creates an auditable revision history.');
  if (ab()) return;

  // Step 7: Move to vote tab
  formState.activeTab = 'vote';
  render();
  await demoWaitForClick('Voting', 7, T,
    'Now we move to the <strong>Vote tab</strong>. The pipeline stepper shows the bill\'s journey: House Vote &rarr; Senate Vote &rarr; Presidential Action &rarr; Enacted. Let\'s simulate the <strong>House vote</strong>.');
  if (ab()) return;

  // Step 8: Simulate House vote
  updateDemoBar('House Vote', 8, T, 'Simulating <strong>House of Representatives vote</strong>... Watch the tally bar fill in real time. 218 yea votes needed to pass.', true);

  await demoWait(100);
  startVoteAnimation('house', billId, false);
  await demoWaitForVote();

  await demoWait(300);
  render();

  const houseResult = Store.getState().bills.find(b => b.id === billId).votes.houseCount;

    `The House voted <strong>${houseResult.yea} yea to ${houseResult.nay} nay</strong>. The bill <strong>passed the House</strong>! Each of the 435 member votes was animated individually. Now on to the Senate.`);
  if (ab()) return;

  updateDemoBar('Senate Vote', 10, T, 'Simulating <strong>United States Senate vote</strong>... 51 yea votes needed.', true);
  Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId, status: 'senate_voting' } });
  await demoWait(100);
  startVoteAnimation('senate', billId, false);
  await demoWaitForVote();
  if (ab()) return;
  await demoWait(300);
  render();

  const senateResult = Store.getState().bills.find(b => b.id === billId).votes.senateCount;
  await demoWaitForClick('Senate Vote', 11, T,
    `The Senate voted <strong>${senateResult.yea} yea to ${senateResult.nay} nay</strong>. <strong>Passed the Senate!</strong> The bill now goes to the President.`);
  if (ab()) return;

  // Step 12: Presidential VETO (longest path)

  await demoWaitForClick('Presidential', 12, T,

  if (ab()) return;

  // Step 13: Execute veto
  Store.dispatch({ type: 'UPDATE_VOTES', payload: { billId, votes: { presidentialAction: 'vetoed' } } });

  await demoWaitForClick('Veto', 13, T,

  if (ab()) return;

  updateDemoBar('Override (House)', 14, T, 'Simulating <strong>House veto override vote</strong>... 2/3 of members present needed.', true);
  Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId, status: 'veto_override_house' } });
  await demoWait(100);
  startVoteAnimation('house', billId, true);
  await demoWaitForVote();
  if (ab()) return;
  await demoWait(300);
  render();

  const hOverride = Store.getState().bills.find(b => b.id === billId).votes.vetoOverrideHouse;
  await demoWaitForClick('Override (House)', 15, T,
    `House override vote: <strong>${hOverride.yea} yea to ${hOverride.nay} nay</strong>. The House override <strong>${hOverride.yea >= Math.ceil((hOverride.yea + hOverride.nay + hOverride.present) * 2/3) ? 'succeeded' : 'failed'}</strong>! Now the Senate must also override.`);

  // Step 16: Senate override vote
  updateDemoBar('Override (Senate)', 16, T, 'Simulating <strong>Senate veto override vote</strong>... 2/3 of members present needed.', true);
  Store.dispatch({ type: 'UPDATE_BILL_STATUS', payload: { billId, status: 'veto_override_senate' } });

  startVoteAnimation('senate', billId, true);

  if (ab()) return;
  await demoWait(300);
  render();

  const bill1State = Store.getState().bills.find(b => b.id === billId);
  const overridden = isVetoOverridden(bill1State.votes);
  if (overridden) {
    await demoWaitForClick('Enacted', 17, T,

  } else {
    // Override failed — sign the bill via alternate path so the demo can continue
    await demoWaitForClick('Override Failed', 17, T,
      'The veto override didn\'t achieve 2/3 in both chambers. For demo purposes, we\'ll <strong>enact the bill directly</strong> so we can continue to the committee and spending phases.');
    Store.dispatch({ type: 'ENACT_BILL', payload: { billId } });

  }
  if (ab()) return;

  // ===== PHASE 2: COMMITTEE REFINEMENT =====
  Store.dispatch({ type: 'SET_VIEW', payload: 'committee' });
  render();
  await demoWaitForClick('Committee', 18, T,
    'We\'ve moved to <strong>Phase 2: Committee Refinement</strong>. After enactment, broad authorizations need to be broken into specific spending subcategories by congressional committees. This is the intra-legislative phase.');

  // Step 19: Select an authorization to refine
  const enactedBill = Store.getState().bills.find(b => b.id === billId);

  if (authToRefine) {
    formState.selectedAuthForRefinement = authToRefine.id;
    formState.refinement = { subcategories: [], committeeName: '', requiredSigs: 2, signatories: [], complianceResult: null, visible: false };
    render();
  }
  await demoWaitForClick('Committee', 19, T,
    'We\'ve selected the <strong>DOT $5B authorization</strong> for refinement. The right panel shows the original authorization details — cap, expiration, categories, and restrictions. Now let\'s break it into specific subcategories.');
  if (ab()) return;

  // Step 20: Add subcategories
  formState.refinement.committeeName = 'Senate Appropriations Committee';
  formState.refinement.requiredSigs = 2;
  formState.refinement.subcategories = [
    { id: 'sc-d1', label: 'Interstate Bridge Repair', parentCategory: null, quantitativeCap: 1.5e9, qualitativeRules: ['Priority: structurally deficient bridges rated <4', 'Must follow FHWA design standards'] },

    { id: 'sc-d3', label: 'High-Speed Rail Corridors', parentCategory: null, quantitativeCap: 1e9, qualitativeRules: ['NEC and California HSR eligible', 'Environmental review required'] },
    { id: 'sc-d4', label: 'Rural Road & Broadband', parentCategory: null, quantitativeCap: 8e8, qualitativeRules: ['Counties under 50,000 population', 'Combined infrastructure projects prioritized'] },
    { id: 'sc-d5', label: 'Port & Freight Infrastructure', parentCategory: null, quantitativeCap: 5e8, qualitativeRules: ['Coastal and inland waterway ports', 'Supply chain resilience focus'] }

  await demoWaitForClick('Subcategories', 20, T,
    'We\'ve defined <strong>5 subcategories</strong> totaling $5B: Interstate Bridge Repair ($1.5B), Urban Transit ($1.2B), High-Speed Rail ($1B), Rural Road & Broadband ($800M), and Port Infrastructure ($500M). Each has specific qualitative rules.');
  if (ab()) return;

  // Step 21: Add signatories
  formState.refinement.signatories = ['Sen. Patty Murray, Committee Chair', 'Sec. Pete Buttigieg, DOT'];

  await demoWaitForClick('Multi-Sig', 21, T,
    '<strong>Multi-signature requirements</strong> are set: the Committee Chair (Sen. Murray) and the DOT Secretary must both sign off. This ensures both legislative and executive accountability on how funds are allocated.');
  if (ab()) return;

  // Step 22: Run compliance check
  if (authToRefine) {
    formState.refinement.complianceResult = checkRefinementCompliance(formState.refinement.subcategories, authToRefine);
  }
  render();
  await demoWaitForClick('Compliance', 22, T,
    `<strong>Compliance check: ${formState.refinement.complianceResult && formState.refinement.complianceResult.passed ? 'PASSED' : 'FAILED'}</strong>. The engine verified that subcategory caps sum within the original $5B authorization and that qualitative rules don't contradict the original restrictions.`);
  if (ab()) return;

  // Step 23: Now demonstrate a FAILING compliance check

  if (ab()) return;

  // Step 24: Fix and submit

  }
  render();
  const refPayload = {
    id: 'ref-demo-' + uid(), authorizationId: authToRefine ? authToRefine.id : '', committeeId: 'committee-demo',
    committeeName: 'Senate Appropriations Committee',

  await demoWaitForClick('Refinement', 24, T,
